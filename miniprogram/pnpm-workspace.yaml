# uni-app 间接依赖兼容/安全基线；变更时重跑两端构建及 pnpm audit。
# 来源为上游公告或发布记录；历史升级未保存具体公告编号，不补造 CVE。

# braces GHSA-vfj7-8cjw-p6xm：官方补丁版本为 <0.0.0（截至 2026-10-07 未发布修复版，
# 3.0.3 已是最新，且仅在 eslint 开发依赖链）。上游发布修复后应移除本豁免。
auditConfig:
  ignoreCves:
    - CVE-2026-93687

onlyBuiltDependencies:
  - esbuild
  - sharp

