[tool.mypy]
python_version = "3.12"
# pydantic 的 mypy 插件：让 mypy 理解 BaseModel 由字段生成的 __init__ 与 model_validate，
# 否则 Settings(...) / CatalogCreate(...) 这类调用会被误报成「缺少命名参数」(call-arg)。
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # 逐步启用，先从宽松开始
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "fastapi.*",
    "uvicorn.*",
    "httpx.*",
    "pydantic.*",
    "pydantic_settings.*",
    "psycopg.*",
    "psycopg_pool.*",
    "cryptography.*",
    "PIL.*",
    "pypdfium2.*",
]
ignore_missing_imports = true
