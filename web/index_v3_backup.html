<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出题工作台 · Learning Coach</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Serif+SC:wght@400;600;900&display=swap');

/* ═══════════ 设计令牌：标准 SaaS 风格 ═══════════ */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface2: #f7f8fa;
  --border: #e5e7eb;
  --border2: #d9dce3;
  --ink: #1f2329;
  --ink2: #646a73;
  --ink3: #8f959e;

  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --primary-light: #eff4ff;
  --primary-border: #b8cdf8;

  /* 旧变量兼容（A4 纸引用，保持原值） */
  --blue: #3b6ef0;
  --blue-hover: #2b55cc;
  --blue-light: #eef3ff;
  --blue-deep: #1e40af;
  --red: #e5484d;
  --red-light: #feeceb;
  --green: #22a06b;
  --green-light: #e9f9f1;
  --amber: #ee9d2b;
  --amber-light: #fff8ea;

  --radius: 8px;
  --radius-sm: 6px;
  --radius-xs: 4px;

  --shadow-xs: 0 1px 2px rgba(31,35,41,.04);
  --shadow-sm: 0 1px 2px rgba(31,35,41,.04), 0 2px 8px rgba(31,35,41,.05);
  --shadow-md: 0 4px 12px rgba(31,35,41,.08), 0 1px 3px rgba(31,35,41,.05);
  --shadow-lg: 0 8px 24px rgba(31,35,41,.12), 0 2px 6px rgba(31,35,41,.06);

  --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
  --font-title: 'ZCOOL KuaiLe', 'Microsoft YaHei', sans-serif;
  --font-body: 'Noto Serif SC', 'SimSun', serif;   /* A4 试卷正文（衬线，勿改） */
  --paper: #ffffff;
  --pencil: var(--ink2);
}

/* ═══════════ 基础 ═══════════ */
* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-ui);
  color: var(--ink);
  background: var(--bg);
  min-height: 100vh;
  padding: 16px 20px 48px;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

::selection { background: rgba(37,99,235,.15); }

button { font-family: var(--font-ui); }

button:focus-visible, input:focus-visible, select:focus-visible, [contenteditable]:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

.app { max-width: 1440px; margin: 0 auto; }

/* ═══════════ 顶部导航：常规白条 ═══════════ */
.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 20px;
  height: 56px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-xs);
  margin-bottom: 16px;
  position: sticky;
  top: 12px;
  z-index: 100;
}

.brand { display: flex; align-items: center; gap: 10px; flex: none; }
.brand .logo {
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  font-size: 19px;
  background: var(--primary);
  border-radius: var(--radius-sm);
  flex: none;
}
.brand-text { display: flex; flex-direction: column; gap: 0; }
.brand-name {
  font-family: var(--font-title);
  font-size: 18px;
  letter-spacing: .5px;
  color: var(--ink);
  line-height: 1.25;
}
.brand-slogan { font-size: 11px; color: var(--ink3); }

/* 步骤条：Ant Design 风格 */
.steps-nav {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 auto;
  min-width: 0;
}
.step {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--ink3);
  font-weight: 500;
  white-space: nowrap;
  transition: color .2s;
}
.step i {
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--border2);
  font-style: normal;
  font-size: 12px;
  font-weight: 600;
  transition: all .2s;
  flex: none;
}
.step.on { color: var(--primary); font-weight: 600; }
.step.on i {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.step.done { color: var(--ink2); }
.step.done i {
  background: var(--primary-light);
  border-color: var(--primary-border);
  color: var(--primary);
}

.step-arrow {
  position: relative;
  width: 32px;
  height: 12px;
  flex: none;
}
.step-arrow::before {
  content: '';
  position: absolute;
  left: 3px; right: 9px; top: 50%;
  height: 1px;
  transform: translateY(-50%);
  background: var(--border2);
}
.step-arrow::after {
  content: '';
  position: absolute;
  right: 3px; top: 50%;
  width: 5px; height: 5px;
  border-top: 1.5px solid var(--border2);
  border-right: 1.5px solid var(--border2);
  transform: translateY(-50%) rotate(45deg);
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
}
.btn-topbar {
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--ink2);
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s;
}
.btn-topbar:hover {
  color: var(--primary);
  border-color: var(--primary-border);
  background: var(--primary-light);
}
.btn-topbar:active { transform: scale(.97); }

.llm-cfg-toggle {
  font-size: 13px;
  color: var(--ink2);
  cursor: pointer;
  user-select: none;
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  transition: all .15s;
  font-weight: 500;
  white-space: nowrap;
}
.llm-cfg-toggle:hover {
  color: var(--primary);
  border-color: var(--primary-border);
  background: var(--primary-light);
}

/* ═══════════ LLM 配置面板 ═══════════ */
.llm-cfg-panel {
  display: none;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: center;
  padding: 14px 18px;
  margin-bottom: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
  box-shadow: var(--shadow-xs);
}
.llm-cfg-panel label { display: inline-flex; align-items: center; gap: 6px; color: var(--ink2); white-space: nowrap; }
.llm-cfg-panel input {
  padding: 6px 10px;
  font-size: 13px;
  border: 1px solid var(--border2);
  border-radius: var(--radius-xs);
  background: var(--surface);
  font-family: var(--font-ui);
  min-width: 130px;
  color: var(--ink);
  transition: border-color .15s, box-shadow .15s;
}
.llm-cfg-panel input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
.llm-actions { display: flex; gap: 8px; }
.llm-actions button {
  padding: 6px 16px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--primary);
  border-radius: var(--radius-xs);
  background: var(--primary);
  color: #fff;
  transition: all .15s;
}
.llm-actions button:hover { background: var(--primary-hover); }
.llm-actions button:active { transform: scale(.97); }
.llm-actions button + button { background: var(--surface); color: var(--ink2); border-color: var(--border2); }
.llm-actions button + button:hover { color: var(--red); border-color: var(--red); background: var(--red-light); }
.llm-msg { color: var(--green); font-size: 13px; }

/* ═══════════ 主工作区（双栏） ═══════════ */
.workbench {
  display: grid;
  grid-template-columns: minmax(380px, 5fr) minmax(560px, 7fr);
  gap: 16px;
  align-items: start;
}

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-xs);
  display: flex;
  flex-direction: column;
}

.panel-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.panel-head h2 {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  white-space: nowrap;
}
.head-step {
  font-size: 12px;
  font-weight: 500;
  color: var(--primary);
  background: var(--primary-light);
  padding: 2px 10px;
  border-radius: 999px;
  white-space: nowrap;
}

.panel-body { padding: 16px 20px 18px; }

/* ═══════════ 表单分组 ═══════════ */
.fgroup { margin-bottom: 18px; }
.fgroup:last-child { margin-bottom: 0; }
.fgroup-label {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  color: var(--ink);
  font-weight: 600;
  margin-bottom: 8px;
}
.fgroup-label i {
  width: 17px; height: 17px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--ink3);
  font-size: 11px;
  font-weight: 600;
  font-style: normal;
  border-radius: 50%;
  flex: none;
}
.fgroup-label b { color: var(--red); }
.fgroup-label .opt-tag {
  font-size: 11px;
  font-weight: 400;
  color: var(--ink3);
  background: var(--surface2);
  padding: 0 8px;
  border-radius: 999px;
  border: 1px solid var(--border);
}
.fgroup-label .type-hint { font-size: 12px; font-weight: 400; color: var(--ink3); margin-left: auto; }

/* 年级/科目胶囊 */
.grade-row, .subject-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.grade-row + .subject-row { margin-top: 8px; }
.grade-pill, .subject-pill {
  padding: 5px 14px;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid var(--border2);
  border-radius: var(--radius-xs);
  cursor: pointer;
  background: var(--surface);
  color: var(--ink2);
  transition: all .15s;
  white-space: nowrap;
}
.grade-pill:hover, .subject-pill:hover {
  border-color: var(--primary);
  color: var(--primary);
}
.grade-pill:active, .subject-pill:active { transform: scale(.96); }
.grade-pill.on, .subject-pill.on {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.subject-empty { font-size: 12px; color: var(--ink3); }

.kw-input {
  width: 100%;
  padding: 8px 12px;
  font-size: 13px;
  border: 1px solid var(--border2);
  border-radius: var(--radius-xs);
  background: var(--surface);
  font-family: var(--font-ui);
  color: var(--ink);
  transition: border-color .15s, box-shadow .15s;
}
.kw-input:focus {
  border-color: var(--primary);
  outline: none;
  box-shadow: 0 0 0 3px rgba(37,99,235,.1);
}
.kw-input::placeholder { color: var(--ink3); }

.scope-hint {
  font-size: 12px;
  color: var(--ink2);
  margin: 10px 0 0;
  line-height: 1.8;
  display: none;
  padding: 10px 12px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
}
.scope-hint b { color: var(--ink); font-size: 13px; display: block; margin-bottom: 6px; }
.scope-hint .tag {
  display: inline-block;
  padding: 3px 10px;
  margin: 2px 4px 2px 0;
  font-size: 12px;
  color: var(--ink2);
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--radius-xs);
  cursor: pointer;
  transition: all .15s;
  user-select: none;
}
.scope-hint .tag:hover { border-color: var(--primary); color: var(--primary); }
.scope-hint .tag.on {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}

/* 难度：分段控件 */
.diff-row {
  display: flex;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--radius-xs);
  overflow: hidden;
}
.diff {
  flex: 1;
  padding: 7px 4px;
  text-align: center;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  background: transparent;
  border: none;
  color: var(--ink2);
  transition: all .15s;
}
.diff + .diff { border-left: 1px solid var(--border); }
.diff small { display: none; }
.diff:hover { color: var(--primary); background: var(--primary-light); }
.diff.on-1 { background: var(--green-light); color: var(--green); font-weight: 600; }
.diff.on-2 { background: var(--primary); color: #fff; font-weight: 600; }
.diff.on-3 { background: var(--red-light); color: var(--red); font-weight: 600; }

/* 题型按钮 */
.type-groups { display: flex; flex-direction: column; gap: 8px; }
.type-group { display: flex; gap: 10px; align-items: flex-start; }
.tg-head {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink3);
  white-space: nowrap;
  padding-top: 6px;
  min-width: 30px;
  flex: none;
}
.tg-body { display: flex; flex-wrap: wrap; gap: 6px; }
.type-pill {
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid var(--border2);
  border-radius: var(--radius-xs);
  cursor: pointer;
  background: var(--surface);
  color: var(--ink);
  transition: all .15s;
  white-space: nowrap;
}
.type-pill:hover {
  border-color: var(--primary);
  color: var(--primary);
  background: var(--primary-light);
}
.type-pill:active { transform: scale(.96); }
.type-pill.flash { animation: pillFlash .5s ease; }
@keyframes pillFlash {
  0% { background: var(--primary); color: #fff; border-color: var(--primary); }
  100% { background: var(--surface); color: var(--ink); border-color: var(--border2); }
}
.type-add-btn {
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 500;
  border: 1px dashed var(--border2);
  border-radius: var(--radius-xs);
  cursor: pointer;
  background: transparent;
  color: var(--ink3);
  transition: all .15s;
  white-space: nowrap;
}
.type-add-btn:hover { border-color: var(--primary); color: var(--primary); border-style: solid; }

/* ═══════════ 左栏底部：生成条 ═══════════ */
.panel-foot {
  position: sticky;
  bottom: 0;
  z-index: 20;
  margin-top: auto;
  padding: 12px 20px 14px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  border-radius: 0 0 var(--radius) var(--radius);
}
.gen-row {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.gen-opt {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--ink2);
  cursor: pointer;
  user-select: none;
}
.gen-opt input[type="number"] {
  width: 56px;
  padding: 5px 8px;
  border: 1px solid var(--border2);
  border-radius: var(--radius-xs);
  font-size: 13px;
  font-family: var(--font-ui);
  color: var(--ink);
  transition: border-color .15s, box-shadow .15s;
}
.gen-opt input[type="number"]:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
.gen-opt input[type="checkbox"] { margin: 0; accent-color: var(--primary); width: 14px; height: 14px; cursor: pointer; }

.btn-go {
  width: 100%;
  padding: 9px 26px;
  font-size: 14px;
  font-weight: 600;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  background: var(--primary);
  color: #fff;
  transition: all .15s;
}
.btn-go:hover { background: var(--primary-hover); }
.btn-go:active { transform: scale(.98); }
.btn-go:disabled { opacity: .55; cursor: not-allowed; transform: none; }

.loading-bar { display: none; margin-top: 12px; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
.loading-bar.show { display: block; }
.loading-bar i {
  display: block;
  height: 100%;
  width: 30%;
  background: var(--primary);
  animation: barSlide 1.2s ease-in-out infinite;
  border-radius: 2px;
}
@keyframes barSlide { 0% { transform: translateX(-30%); } 100% { transform: translateX(360%); } }

.err-box {
  display: none;
  margin-top: 12px;
  padding: 10px 14px;
  background: var(--red-light);
  color: var(--red);
  border: 1px solid rgba(229,72,77,.25);
  border-radius: var(--radius-xs);
  font-size: 13px;
}
.err-box.show { display: block; }

/* ═══════════ 右栏：卷面搭建 ═══════════ */
.right-panel .tpl-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: auto;
  flex-wrap: wrap;
}
.tpl-label { font-size: 12px; font-weight: 500; color: var(--ink3); margin-right: 2px; }
.tpl-btn {
  font-size: 12px;
  padding: 4px 12px;
  border-radius: var(--radius-xs);
  border: 1px solid var(--border2);
  background: var(--surface);
  cursor: pointer;
  color: var(--ink2);
  transition: all .15s;
  white-space: nowrap;
}
.tpl-btn:hover:not(.on) { border-color: var(--primary); color: var(--primary); }
.tpl-btn.on {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
  font-weight: 500;
}

.my-tpl-wrap { position: relative; display: inline-flex; }
.my-tpl-drop {
  display: none;
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  z-index: 35;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-lg);
  min-width: 240px;
  padding: 6px;
}
.my-tpl-wrap.open .my-tpl-drop { display: block; }
.my-tpl-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  font-size: 13px;
  cursor: pointer;
  border-radius: var(--radius-xs);
  transition: background .12s;
}
.my-tpl-item:hover { background: var(--surface2); }
.my-tpl-item-name { font-weight: 500; color: var(--ink); flex: 1; }
.my-tpl-item-summary { font-size: 11px; color: var(--ink3); margin-left: 8px; }
.my-tpl-item-del {
  font-size: 12px;
  color: #c33;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: var(--radius-xs);
  margin-left: 6px;
  visibility: hidden;
  transition: background .12s;
}
.my-tpl-item:hover .my-tpl-item-del { visibility: visible; }
.my-tpl-item-del:hover { background: var(--red-light); }
.my-tpl-empty { padding: 14px 10px; text-align: center; font-size: 12px; color: var(--ink3); line-height: 1.8; }

.b-count {
  font-size: 12px;
  background: var(--primary-light);
  color: var(--primary);
  padding: 3px 10px;
  border-radius: 999px;
  font-weight: 500;
  white-space: nowrap;
}

.tpl-custom-cfg {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 14px;
  align-items: center;
  padding: 12px 20px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}
.tpl-custom-cfg label { display: inline-flex; align-items: center; gap: 4px; color: var(--ink2); white-space: nowrap; }
.tpl-custom-cfg input[type="text"] {
  width: 96px;
  padding: 4px 8px;
  font-size: 12px;
  border: 1px solid var(--border2);
  border-radius: var(--radius-xs);
  font-family: var(--font-ui);
  color: var(--ink);
  transition: border-color .15s, box-shadow .15s;
}
.tpl-custom-cfg input[type="text"]:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
.tpl-custom-cfg input[type="checkbox"] { margin: 0; accent-color: var(--primary); }
.tpl-save-btn {
  padding: 5px 16px;
  font-size: 12px;
  font-weight: 500;
  border: 1px solid var(--primary);
  border-radius: var(--radius-xs);
  background: var(--primary);
  color: #fff;
  cursor: pointer;
  transition: all .15s;
}
.tpl-save-btn:hover { background: var(--primary-hover); }
.tpl-save-btn:active { transform: scale(.96); }

.sec-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 60px;
  padding: 14px 16px;
}
.builder-empty {
  text-align: center;
  padding: 48px 24px;
  color: var(--ink3);
  font-size: 13px;
  line-height: 1.9;
  border: 1px dashed var(--border2);
  border-radius: var(--radius-sm);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  background: var(--surface2);
}
.builder-empty .be-icon { font-size: 36px; opacity: .5; }
.builder-empty b { font-size: 14px; color: var(--ink2); }

.builder-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  border-top: 1px solid var(--border);
  background: var(--surface);
  border-radius: 0 0 var(--radius) var(--radius);
}
.builder-summary { font-size: 12px; color: var(--ink2); flex: 1; line-height: 1.6; }
.builder-summary b { color: var(--primary); }
.btn-save-layout {
  padding: 6px 16px;
  font-size: 12px;
  font-weight: 500;
  border: 1px solid var(--border2);
  border-radius: var(--radius-xs);
  background: var(--surface);
  color: var(--ink2);
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.btn-save-layout:hover { border-color: var(--primary); color: var(--primary); }
.btn-save-layout:active { transform: scale(.96); }

/* ═══════════ 大题卡片 ═══════════ */
.sec-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  transition: all .15s;
  position: relative;
  overflow: visible;
}
.sec-card:hover { border-color: var(--border2); box-shadow: var(--shadow-xs); }
.sec-card.loading { opacity: .55; pointer-events: none; }
.sec-card.sortable-ghost, .sortable-ghost {
  opacity: .5;
  border: 1px dashed var(--primary) !important;
  background: var(--primary-light) !important;
}
.s-head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; margin-bottom: 7px; flex-wrap: wrap; }
.drag-handle { cursor: grab; color: var(--ink3); font-size: 14px; padding: 1px; transition: color .12s; flex: none; }
.drag-handle:hover { color: var(--primary); }
.drag-handle:active { cursor: grabbing; }
.s-idx {
  min-width: 18px; height: 18px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--primary-light);
  color: var(--primary);
  border-radius: var(--radius-xs);
  font-size: 11px;
  font-weight: 600;
  flex: none;
}
.s-name { color: var(--ink); white-space: nowrap; }
.s-cnt {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  margin-left: auto;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  padding: 1px 4px;
}
.s-cnt button, .s-cnt .minus, .s-cnt .plus {
  width: 20px; height: 20px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--radius-xs);
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 13px;
  line-height: 1;
  color: var(--ink2);
  transition: all .12s;
  user-select: none;
}
.s-cnt .minus:hover, .s-cnt .plus:hover { background: var(--primary-light); color: var(--primary); }
.s-cnt input {
  width: 28px;
  text-align: center;
  font-size: 12px;
  border: none;
  background: transparent;
  font-family: var(--font-ui);
  color: var(--ink);
  font-weight: 600;
  -moz-appearance: textfield;
}
.s-cnt input::-webkit-inner-spin-button, .s-cnt input::-webkit-outer-spin-button { -webkit-appearance: none; }
.s-cnt-unit { font-size: 11px; color: var(--ink3); margin-right: 4px; }
.s-btns { display: flex; gap: 4px; margin-left: 4px; }
.s-btns button {
  width: 22px; height: 22px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  cursor: pointer;
  font-size: 11px;
  background: var(--surface);
  color: var(--ink2);
  transition: all .12s;
  line-height: 1;
}
.s-btns button:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
.s-btns .s-del:hover { background: var(--red-light); border-color: var(--red); color: var(--red); }

.s-body { font-size: 12px; color: var(--ink2); line-height: 1.5; }
.s-summary {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px;
  background: var(--surface2);
  border-radius: var(--radius-xs);
}
.s-sum-stats {
  font-weight: 600;
  color: var(--primary);
  font-size: 12px;
  white-space: nowrap;
}
.s-sum-lines {
  font-size: 12px;
  color: var(--ink2);
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.s-q-preview { color: var(--ink2); font-size: 12px; }
.s-sum-more {
  font-size: 11px;
  color: var(--ink3);
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 0 6px;
  border-radius: 999px;
  white-space: nowrap;
}
.s-loading-txt { color: var(--ink3); }
.s-err-txt { color: var(--red); }
.s-ok-txt { color: var(--green); }
.s-loading { display: flex; align-items: center; gap: 10px; color: var(--ink2); font-size: 13px; padding: 6px 0; }
.spin {
  display: inline-block;
  width: 15px; height: 15px;
  border: 2px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.s-error {
  font-size: 13px;
  color: var(--red);
  padding: 6px 10px;
  background: var(--red-light);
  border-radius: var(--radius-xs);
}
.s-retry {
  margin-left: 8px;
  cursor: pointer;
  color: var(--primary);
  font-weight: 500;
  border: none;
  background: none;
  font-size: 13px;
}
.s-retry:hover { text-decoration: underline; }

/* ═══════════ 卡片排版设置 ═══════════ */
.s-layout-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
  margin-left: auto;
}
.s-lay-tabs { display: flex; gap: 3px; }
.s-lay-tab {
  padding: 2px 9px;
  font-size: 11px;
  cursor: pointer;
  color: var(--ink3);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  transition: all .13s;
  font-weight: 500;
  user-select: none;
  white-space: nowrap;
  background: var(--surface);
  line-height: 1.5;
}
.s-lay-tab:hover { color: var(--primary); border-color: var(--primary); }
.s-lay-tab.on { color: #fff; background: var(--primary); border-color: var(--primary); }
.s-layout-drop {
  display: none;
  position: absolute;
  top: calc(100% + 5px);
  right: 0;
  z-index: 40;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-lg);
  padding: 8px;
  min-width: 120px;
}
.s-layout-wrap.open .s-layout-drop { display: block; }
.s-lay-pane { display: none; flex-wrap: wrap; gap: 4px; }
.s-lay-pane.on { display: flex; }
.s-layout-opt {
  display: inline-block;
  padding: 3px 10px;
  font-size: 12px;
  cursor: pointer;
  border-radius: var(--radius-xs);
  color: var(--ink2);
  white-space: nowrap;
  transition: all .11s;
  font-weight: 500;
  line-height: 1.3;
  border: 1px solid var(--border);
  background: var(--surface);
}
.s-layout-opt:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
.s-layout-opt.on { background: var(--primary); color: #fff; border-color: var(--primary); }

/* ═══════════ 实时预览 ═══════════ */
.live-preview {
  border-top: 1px solid var(--border);
  padding: 16px 20px 20px;
  background: var(--surface2);
  border-radius: 0 0 var(--radius) var(--radius);
}
.live-preview-head {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.lp-title { font-size: 14px; font-weight: 600; }
.lp-hint { font-size: 12px; color: var(--ink3); }
.lp-actions { display: flex; gap: 6px; align-items: center; margin-left: auto; flex-wrap: wrap; }
.lp-btn {
  font-size: 12px;
  padding: 4px 12px;
  border: 1px solid var(--border2);
  border-radius: var(--radius-xs);
  cursor: pointer;
  background: var(--surface);
  color: var(--ink2);
  font-weight: 500;
  transition: all .12s;
  white-space: nowrap;
}
.lp-btn:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
.lp-select {
  font-size: 12px;
  padding: 3px 6px;
  border: 1px solid var(--border2);
  border-radius: var(--radius-xs);
  font-family: var(--font-ui);
  color: var(--ink);
  background: var(--surface);
}
.lp-color {
  width: 28px; height: 28px;
  border: 1px solid var(--border2);
  border-radius: var(--radius-xs);
  cursor: pointer;
  padding: 2px;
  background: var(--surface);
}
.lp-sep { width: 1px; height: 18px; background: var(--border); margin: 0 3px; }
.f-btn { font-weight: 700; }

.live-paper-stack { }
.live-paper-stack .paper {
  width: 210mm; max-width: 210mm; height: 297mm;
  margin: 0 auto 16px;
  box-shadow: var(--shadow-md);
}
.live-paper-stack .paper-breaker { display: none; }
.live-paper-stack .q-table { margin-top: 0; margin-bottom: 0; }

/* ═══════════ A4 纸（试卷排版核心样式 —— 请勿改动） ═══════════ */
.paper {
  background: #fff;
  width: 210mm;
  max-width: 210mm;
  height: 297mm;
  overflow: hidden;
  margin: 0 auto;
  padding: 15mm 16mm;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-md);
  position: relative;
  z-index: 1;
  font-family: var(--font-body);
}
.paper + .paper { margin-top: 18px; }

/* 可编辑 */
.can-edit { outline: 2px dashed transparent; outline-offset: 2px; transition: outline-color .15s; border-radius: 2px; }
.can-edit:hover { outline-color: rgba(59,110,240,.25); }
.can-edit:focus { outline-color: var(--blue); }
.ed-del {
  position: absolute;
  right: 2px;
  top: 2px;
  width: 17px;
  height: 17px;
  line-height: 17px;
  text-align: center;
  font-size: 10px;
  color: #bbb;
  cursor: pointer;
  border-radius: 50%;
  z-index: 5;
  transition: all .12s;
  pointer-events: auto;
  opacity: 0;
}
.can-edit:hover .ed-del, .ed-del:hover { opacity: 1; }
.ed-del:hover { color: var(--red); background: var(--red-light); }

.col-resizer { position: absolute; right: 0; top: 0; bottom: 0; width: 6px; cursor: col-resize; background: transparent; z-index: 3; }
.col-resizer:hover { background: rgba(59,110,240,.12); }
.row-resizer { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; cursor: row-resize; background: transparent; z-index: 3; }
.row-resizer:hover { background: rgba(59,110,240,.12); }
.cell-resizer {
  position: absolute; right: 0; bottom: 0;
  width: 15px; height: 15px;
  line-height: 15px;
  text-align: center;
  font-size: 11px;
  color: #999;
  cursor: nwse-resize;
  opacity: 0;
  transition: opacity .12s;
  z-index: 3;
  user-select: none;
}
.q-grid .q:hover .cell-resizer { opacity: 1; }
.cell-resizer:hover { color: var(--blue); background: rgba(59,110,240,.1); border-radius: 4px 0 0 0; }

/* ═══════════ 试卷内容排版 ═══════════ */
.exam h1 { text-align: center; font-size: 22pt; font-family: "SimHei", "Microsoft YaHei", sans-serif; letter-spacing: 2px; line-height: 1.4; }
.exam .sub-line { text-align: center; font-size: 11pt; color: #555; margin-bottom: 4mm; }
.exam .info-row { display: flex; justify-content: space-between; font-size: 10pt; border-bottom: 1px solid #000; padding-bottom: 2mm; margin-bottom: 4mm; }
.exam h2.sec { font-size: 13pt; font-family: "SimHei","Microsoft YaHei",sans-serif; display: flex; justify-content: space-between; align-items: center; margin: 5mm 0 2mm; }
.exam .score-box { font-size: 10pt; font-weight: 400; color: #555; }
.exam .notice { font-size: 9pt; color: #666; margin-bottom: 4mm; border-left: 3px solid #999; padding-left: 3mm; }
.exam .footer-note { text-align: center; font-size: 9pt; color: #999; margin-top: 4mm; border-top: 1px solid #eee; padding-top: 2mm; }
.exam .lv { display: inline-block; background: #fff7e6; color: #d48806; font-size: 9pt; padding: 0 3px; border-radius: 3px; }
.exam .q { margin-bottom: 3mm; line-height: 1.7; font-size: 11pt; }
.exam .opts { display: grid; gap: 2px 8px; margin-top: 1mm; font-size: 10.5pt; }
.exam .opts.one { grid-template-columns: 1fr; }
.exam .match-table { width: 100%; border-collapse: collapse; margin-top: 1mm; font-size: 10pt; }
.exam .match-table th, .exam .match-table td { border: 1px solid #999; padding: 2px 4px; }
.exam .match-table th { background: #f0f0f0; }

/* 数的分成（精致树状图） */
.split-wrap {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  margin: 6px 12px;
  vertical-align: middle;
}
.split-box {
  min-width: 28px;
  height: 26px;
  padding: 0 5px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11pt;
  font-weight: 400;
  color: #2b3a55;
  background: #f7f9fc;
  border: 1.5px solid #b9c6db;
  border-radius: 6px;
  line-height: 1;
  box-shadow: 0 1px 2px rgba(43,58,85,.06);
}
.split-box.blank {
  background: #fff;
  border: 1.5px dashed #c3cede;
  color: transparent;
  box-shadow: none;
}
.split-lines {
  width: 56px;
  height: 18px;
  margin: -1px 0;
}
.split-lines path {
  fill: none;
  stroke: #b9c6db;
  stroke-width: 1.5;
  stroke-linecap: round;
}
.split-bottom {
  display: flex;
  gap: 12px;
}

/* 比大小 */
.compare-row {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11pt;
  font-weight: 400;
  color: #2b3a55;
  margin: 3px 0;
}
.compare-expr {
  min-width: 28px;
  padding: 2px 6px;
  text-align: center;
  background: #f7f9fc;
  border: 1.5px solid #b9c6db;
  border-radius: 6px;
  line-height: 1.2;
}
.compare-circle {
  display: inline-block;
  width: 26px;
  height: 26px;
  border: 1.5px dashed #c3cede;
  border-radius: 50%;
  background: #fff;
}

.q-ans-inline { font-size: 9pt; color: var(--blue); margin-left: 4px; }
.paper-stack.layouting .paper { page-break-after: always; }

@media print {
  .paper { box-shadow: none; border: none; }
  .paper-stack.layouting .paper { page-break-after: always; }
}

/* ═══════════ 结果弹层 ═══════════ */
.result-area {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 900;
  background: rgba(31,35,41,.5);
  overflow: hidden;
  animation: fadeIn .18s ease;
}
.result-area > * { margin-left: auto; margin-right: auto; max-width: 1024px; }
.result-area {
  overflow-y: auto;
  padding: 24px 16px;
}
.result-area .panel-head {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius) var(--radius) 0 0;
}
.result-area .preview-bar {
  background: var(--surface);
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
}
.result-area .paper-stack {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 0 0 var(--radius) var(--radius);
  padding: 24px 12px;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}
.result-area .result-head {
  border-bottom: none;
  padding-bottom: 4px;
}
.result-area .sum { font-size: 12px; font-weight: 400; color: var(--ink2); margin-left: auto; text-align: right; line-height: 1.5; }
.preview-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding: 12px 20px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: sticky;
  top: 70px;
  z-index: 50;
}
.bar-sep { width: 1px; height: 22px; background: var(--border); margin: 0 6px; }
.btn-mini {
  padding: 6px 16px;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid var(--border2);
  border-radius: var(--radius-xs);
  cursor: pointer;
  background: var(--surface);
  color: var(--ink);
  transition: all .13s;
  white-space: nowrap;
}
.btn-mini:hover { border-color: var(--primary); color: var(--primary); }
.btn-mini:active { transform: scale(.97); }
.btn-mini.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-mini.primary:hover { background: var(--primary-hover); color: #fff; }
.btn-mini.warn { background: var(--amber-light); border-color: #e8c476; color: #9a6d10; }
.btn-mini.warn:hover { border-color: var(--amber); color: #7d5a0c; }
.btn-mini.ok { background: var(--green-light); border-color: var(--green); color: var(--green); }
.btn-mini.ok:hover { background: var(--green); color: #fff; }

.result-area .paper-stack { padding: 24px 12px; }

/* ═══════════ 排版模式工具（JS 动态注入） ═══════════ */
.layout-tip {
  display: none;
  margin: 0 auto 12px;
  padding: 10px 16px;
  background: var(--amber-light);
  border: 1px solid #e8c476;
  border-radius: var(--radius-sm);
  color: #7d5a0c;
  font-size: 13px;
  line-height: 1.8;
}
.layout-tip b { color: #9a6d10; }

.sec-tools { margin: 0 0 1mm; }
.q-tools { display: inline; margin-left: 3px; }
.tool-btn {
  display: inline-block;
  padding: 1px 8px;
  font-size: 9pt;
  color: #c0392b;
  background: #fdf0ef;
  border: 1px solid #ecc7c4;
  border-radius: 4px;
  cursor: pointer;
  user-select: none;
  font-family: var(--font-ui);
  transition: background .12s;
}
.tool-btn:hover { background: #f9e0de; }
.sort-handle { cursor: grab; color: #888; margin-left: 4px; user-select: none; }
.sort-handle:active { cursor: grabbing; }

/* ═══════════ 动画与反馈 ═══════════ */
.panel.need-attn { animation: attn 1s ease-in-out 2; }
@keyframes attn {
  0%, 100% { box-shadow: var(--shadow-xs); }
  50% { box-shadow: 0 0 0 4px rgba(229,72,77,.18), var(--shadow-xs); }
}

.pg-footer { display: none; }

/* ═══════════ 滚动条 ═══════════ */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: #c9cdd4;
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover { background: #adb2bc; }

/* ═══════════ 响应式 ═══════════ */
@media (max-width: 1120px) {
  .workbench { grid-template-columns: 1fr; }
}

@media (max-width: 860px) {
  body { padding: 10px 10px 32px; }
  .topbar { height: auto; flex-wrap: wrap; padding: 10px 14px; gap: 10px; }
  .steps-nav { order: 3; flex-basis: 100%; justify-content: flex-start; flex-wrap: wrap; gap: 6px; }
  .brand-slogan { display: none; }
  .step { font-size: 12px; }
  .step-arrow { width: 20px; }
  .panel-body, .panel-foot { padding-left: 14px; padding-right: 14px; }
  .preview-bar { top: 8px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
  html { scroll-behavior: auto; }
}

<div class="app">

  <!-- ═══════════ 顶部导航 ═══════════ -->
  <header class="topbar">
    <div class="brand">
      <span class="logo">✏️</span>

    <div class="topbar-actions">

      <span class="llm-cfg-toggle" id="llmCfgToggle">⚙ 模型配置</span>
    </div>
  </header>

  <!-- ═══════════ LLM 配置（点击顶栏「模型配置」展开） ═══════════ -->
  <div class="llm-cfg-panel" id="llmCfgPanel" style="display:none">

/* ── 按年级+科目动态显示题型（依据人教版真实试卷结构联网核实） ──
   一年级：口算/填空/判断/选择/数的分成/比大小 + 竖式（下册起）+ 应用
   二年级：+ 表内乘除法口算

const TYPE_GROUPS_BY_GRADE = {

/* 其他科目（科学等）默认题型 */
const TYPE_GROUPS_DEFAULT = [
  ['基础', ['quiz','fill_blank','match_pair']],

];
/* 自定义题型（localStorage 持久化） */
function getCustomTypes() {
  try { return JSON.parse(localStorage.getItem('lc_custom_types') || '[]'); } catch(e) { return []; }
}
function saveCustomTypes(arr) { localStorage.setItem('lc_custom_types', JSON.stringify(arr)); }

/* 根据年级+科目渲染题型区 */
const CN_GRADE_NUM = { '一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9 };
function gradeNumOf(g) {
  g = g || '';
  if (g.includes('初中') || g.includes('初')) {
    const m = g.match(/[一二三]/);
    return m ? (6 + (CN_GRADE_NUM[m[0]] || 0)) : 7; // 初一→7 初二→8 初三→9
  }
  const m = g.match(/[一二三四五六]/);
  return m ? (CN_GRADE_NUM[m[0]] || 0) : 0;
}
function renderTypeGroups() {
  const g = $('#grade').value;
  const s = $('#subject').value;
  const grid = $('#typeGrid');
  if (!grid) return;
  let groups;
  const gNum = gradeNumOf(g);
  if (s && TYPE_GROUPS_BY_GRADE[s] && TYPE_GROUPS_BY_GRADE[s][gNum]) {
    groups = TYPE_GROUPS_BY_GRADE[s][gNum];
  } else {
    groups = TYPE_GROUPS_DEFAULT;
  }
  // 自定义题型追加到最后一组
  const customs = getCustomTypes();
  let html = groups.map(([label, types]) =>
    `<div class="type-group"><div class="tg-head">${label}</div><div class="tg-body">` +
    types.filter(t => TYPE_NAME[t]).map(t =>
      `<button type="button" class="type-pill" data-v="${t}">${TYPE_NAME[t]}</button>`).join('') +
    `</div></div>`).join('');
  if (customs.length) {
    html += `<div class="type-group"><div class="tg-head">自定义</div><div class="tg-body">` +
      customs.map(t =>
        `<button type="button" class="type-pill" data-v="${esc(t.id)}" title="长按可删除">✳️ ${esc(t.name)}</button>`).join('') +
      `</div></div>`;
  }
  html += `<button type="button" class="type-add-btn" id="btnAddType">＋ 添加题型</button>`;
  grid.innerHTML = html;
  bindTypePills();
}

/* 绑定题型按钮点击（含自定义题型 → 走通用通道） */
function bindTypePills() {
  document.querySelectorAll('#typeGrid .type-pill').forEach(item => {
    item.onclick = () => {
      const v = item.dataset.v;
      const customs = getCustomTypes();
      const custom = customs.find(c => c.id === v);
      const actualType = custom ? custom.baseType : v;
      const defCnt = custom ? custom.defaultCount : (TYPE_DEFAULT[v] || 4);
      addSecToBuilder(actualType, defCnt);
      item.classList.remove('flash');
      void item.offsetWidth;
      item.classList.add('flash');
    };
  });
  const addBtn = $('#btnAddType');
  if (addBtn) addBtn.onclick = openAddTypeDialog;
}

      <input id="ctCount" type="number" value="5" min="1" max="99" style="width:70px;margin-top:4px;padding:7px 10px;border:1px solid #d5d8dd;border-radius:5px;font-size:13px"></label>
    <div style="display:flex;gap:8px;justify-content:flex-end">

    </div>`;
  overlay.appendChild(dlg);
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.onclick = (e) => { if (e.target === overlay) close(); };

  $('#ctOk').onclick = () => {
    const name = $('#ctName').value.trim();

    customs.push({ id, name, baseType: base, defaultCount: cnt });
    saveCustomTypes(customs);
    close();
    renderTypeGroups();
  };
}
const TYPE_DEFAULT = { quiz:4, fill_blank:4, match_pair:1, challenge:3, oral_math:6, reading:1, vertical_calc:4, recursive_calc:4, smart_calc:4, number_split:5, compare:5, true_false:5, word_problem:3 };

async function loadAvailable() {

    gradeRow.querySelectorAll('.grade-pill').forEach(p => {
      p.onclick = () => {
        gradeRow.querySelectorAll('.grade-pill').forEach(x => x.classList.remove('on'));
        p.classList.add('on');
        $('#grade').value = p.dataset.v;
        $('#scopeHint').style.display = 'none';
        renderSubjectPills(p.dataset.v);
        renderTypeGroups();
      };
    });
    $('#subject').onchange = loadScope;
  } catch (e) {
    $('#gradeRow').innerHTML = '<span class="subject-empty">年级加载失败，请刷新重试</span>';
  }
}

/* 渲染科目胶囊 */
function renderSubjectPills(g) {
  const row = $('#subjectRow');
  const subs = (_availableData[g] || []);
  if (!subs.length) {
    row.innerHTML = '<span class="subject-empty">该年级暂无可选科目</span>';
    return;
  }
  row.innerHTML = subs.map(s =>
    `<button type="button" class="subject-pill" data-v="${esc(s)}">${esc(s)}</button>`).join('');
  row.querySelectorAll('.subject-pill').forEach(p => {
    p.onclick = () => {
      row.querySelectorAll('.subject-pill').forEach(x => x.classList.remove('on'));
      p.classList.add('on');
      const sel = $('#subject');
      sel.disabled = false;
      sel.innerHTML = `<option value="">请选择科目</option>` +
        subs.map(s => `<option value="${s}">${s}</option>`).join('');
      sel.value = p.dataset.v;
      $('#scopeHint').style.display = 'none';
      renderTypeGroups();
      loadScope();
    };
  });
}

async function loadScope() {
  const g = $('#grade').value, s = $('#subject').value;
  if (!g || !s) return;
  try {
    const r = await fetch(API + `/api/v1/scope?grade=${encodeURIComponent(g)}&subject=${encodeURIComponent(s)}`);
    const d = await r.json();
    const box = $('#scopeHint');
    box.style.display = 'block';
    let html = `<b>📐 ${g} · ${s} 可出题的知识点</b>（可多选，点击选中/取消，也可在上方手动输入）：<br>`;
    if (d.semesters && (d.semesters['上册'] || d.semesters['下册'])) {
      // 按上/下册分组显示
      if (d.semesters['上册']) {
        html += `<div style="margin:6px 0 2px;font-size:12px;color:#888">📗 上册</div>` +
          d.semesters['上册'].map(k => `<span class="tag" data-v="上册·${esc(k)}">${esc(k)}（上）</span>`).join('');
      }
      if (d.semesters['下册']) {
        html += `<div style="margin:6px 0 2px;font-size:12px;color:#888">📘 下册</div>` +
          d.semesters['下册'].map(k => `<span class="tag" data-v="下册·${esc(k)}">${esc(k)}（下）</span>`).join('');
      }
    }
    // 其他通用知识点（若有）
    html += d.allowed.map(k => `<span class="tag">${esc(k)}</span>`).join('');
    box.innerHTML = html;
    box.querySelectorAll('.tag').forEach(t => t.onclick = () => {
      t.classList.toggle('on');
      syncKeywordFromTags();
    });
  } catch (e) {}
}

/* 多选知识点 → 拼入关键词输入框 */
function syncKeywordFromTags() {
  const sel = [...document.querySelectorAll('#scopeHint .tag.on')].map(t => t.dataset.v || t.textContent);
  $('#keyword').value = sel.join('、');
}

/* ── 卷面搭建区：点题型 → 立即生成真实题目并展示 ── */
let builderSeq = 0;
let builderSecSortable = null;

/* 表单校验：点题型/组卷前必须有年级+科目+关键词 */
function builderForm(quiet) {
  const grade = $('#grade').value, subject = $('#subject').value, keyword = $('#keyword').value.trim();
  if (!grade || !subject || !keyword) {
    if (!quiet) alert('请先选好年级、科目，并填写知识点关键词～');
    return null;
  }
  return { grade, subject, keyword };
}

function cardCount(card) {
  return Math.min(99, Math.max(1, parseInt(card.querySelector('.s-cnt input').value) || 1));
}

function initBuilder() {
  // 题型按钮由 renderTypeGroups 动态生成并绑定（选完年级/科目后更新）
  renderTypeGroups();

  // 大题块拖拽排序
  if (typeof Sortable !== 'undefined') {
    builderSecSortable = new Sortable($('#secList'), {
      animation: 150,
      handle: '.drag-handle',
      draggable: '.sec-card',
      ghostClass: 'sortable-ghost',
      onEnd: updateBuilderSummary
    });
  }

  // 换一批 / 重试 / 删除 / 数量加减（事件委托）
  $('#secList').addEventListener('click', e => {
    const card = e.target.closest('.sec-card');
    if (!card) return;
    if (e.target.classList.contains('s-del')) {
      // 增量删除：只移除 A4 纸上对应的 sec-block，其他不动（保留用户编辑）
      const sid = card._sid;
      card.remove();
      let removedBlock = false;
      if (sid) {
        const stack = $('#livePaperStack');
        const block = stack?.querySelector(`.sec-block[data-sid="${sid}"]`);
        if (block) {
          block.remove();
          removedBlock = true;
          // 若删空了整张纸，隐藏预览
          if (!stack.querySelector('.sec-block')) { $('#livePreview').style.display = 'none'; }
          else {
            // 重排剩余大题的序号（一、二、三…）—— 只替换开头的序号，保留内部格式标签
            stack.querySelectorAll('.sec-block').forEach((b, i) => {
              const h = b.querySelector('h2.sec span');
              if (h) {
                h.innerHTML = h.innerHTML.replace(/^[一二三四五六七八九十]+、/, (CN_NUM[i] || '') + '、');
              }
            });
          }
        }
      }
      if (removedBlock) {
        skipNextPreviewRefresh = true; // 手动删过了，汇总时不要再全量刷新预览
        updateBuilderSummary();
        skipNextPreviewRefresh = false;
      } else {
        updateBuilderSummary(); // 没匹配到块（sid 失效），退回全量刷新
      }
    } else if (e.target.classList.contains('s-retry')) {
      // 重试 LLM 出题，成功后同步到试卷
      retryCardFetch(card);
    } else if (e.target.classList.contains('minus') || e.target.classList.contains('plus')) {
      const input = card.querySelector('.s-cnt input');
      let n = parseInt(input.value) || 1;
      n = e.target.classList.contains('plus') ? n + 1 : n - 1;
      n = Math.min(99, Math.max(1, n));
      input.value = n;
      onCountChange(card, n);
    }
  });

  // 直接输入数量（防抖：减少=裁剪展示，增加=重新出一批）
  $('#secList').addEventListener('input', e => {
    if (e.target.tagName !== 'INPUT') return;
    const card = e.target.closest('.sec-card');
    if (!card) return;
    clearTimeout(card._cntTimer);
    card._cntTimer = setTimeout(() => {
      let n = parseInt(e.target.value) || 1;
      n = Math.min(99, Math.max(1, n));
      e.target.value = n;
      onCountChange(card, n);
    }, 600);
  });

  // 难度切换 → 已有大题自动重新出题（换难度=换题）
  document.querySelectorAll('.diff').forEach(d => d.addEventListener('click', () => {
    document.querySelectorAll('#secList .sec-card').forEach(card => {
      if (card._status === 'loading') return;
      mockFillData(card, card.dataset.type, cardCount(card));
    });
  }));

  // 排版选项事件代理
  $('#secList').addEventListener('click', e => {
    const tab = e.target.closest('.s-lay-tab');
    if (tab) {
      e.stopPropagation();
      const wrap = tab.closest('.s-layout-wrap');
      // 点击标签：切换弹层开关 + 激活对应 pane
      const wasOpen = wrap.classList.contains('open');
      document.querySelectorAll('.s-layout-wrap.open').forEach(w => w.classList.remove('open'));
      if (!wasOpen) wrap.classList.add('open');
      wrap.querySelectorAll('.s-lay-tab').forEach(t => t.classList.toggle('on', t === tab));
      wrap.querySelectorAll('.s-lay-pane').forEach(p => p.classList.toggle('on', p.dataset.pane === tab.dataset.tab));
      return;
    }
    const opt = e.target.closest('.s-layout-opt');
    if (opt) {
      e.stopPropagation();
      const card = opt.closest('.sec-card');
      const cols = parseInt(opt.dataset.cols);
      const kind = opt.dataset.kind; // 'q' 题目排列 / 'opt' 选项排列 / 'tbl' 表格线 / 'font' 字号 / 'no' 题号显隐
      if (kind === 'q') setQCols(card, cols);
      else if (kind === 'opt') setOptCols(card, cols);
      else if (kind === 'tbl') setTblBorder(card, opt.dataset.tbl);
      else if (kind === 'font') setFontSize(card, opt.dataset.fs);
      else if (kind === 'no') setShowHead(card, opt.dataset.show === '1');
      // 更新同 kind 高亮
      card.querySelectorAll(`.s-layout-opt[data-kind="${kind}"]`).forEach(o => {
        if (kind === 'tbl') o.classList.toggle('on', o.dataset.tbl === opt.dataset.tbl);
        else if (kind === 'font') o.classList.toggle('on', o.dataset.fs === opt.dataset.fs);
        else if (kind === 'no') o.classList.toggle('on', o.dataset.show === opt.dataset.show);
        else o.classList.toggle('on', o.dataset.cols == cols);
      });
      return;
    }
  });
  // 点击卡片外关闭排版弹层
  document.addEventListener('click', e => {
    if (!e.target.closest('.s-layout-wrap')) {
      document.querySelectorAll('.s-layout-wrap.open').forEach(w => w.classList.remove('open'));
    }
  });
}

/* 模拟题目数据——排版阶段用，快速出骨架（简短贴近真实题目） */
function mockQuestions(type, count) {
  const qs = [];
  for (let i = 0; i < count; i++) {
    const n = i + 1;
    if (type === 'quiz') {
      qs.push({ type:'multiple_choice', stem:`${n + 2} + 3 = ？`, options:['3','4','5','6'], answer:2, analysis:'' });
    } else if (type === 'fill_blank') {
      qs.push({ type:'fill_blank', stem:`${n} + ${n} = ____`, answer:`${n*2}`, analysis:'' });
    } else if (type === 'oral_math') {
      qs.push({ type:'oral_math', stem:`${n}×${n*7}=`, answer:`${n*n*7}`, analysis:'' });
    } else if (type === 'vertical_calc') {
      qs.push({ type:'vertical_calc', stem:`${123+n} + ${456-n} =`, answer:`${579}`, analysis:'' });
    } else if (type === 'recursive_calc') {
      qs.push({ type:'recursive_calc', stem:`${100+n} − ${n*3} + ${n*2} =`, answer:'', analysis:'' });
    } else if (type === 'smart_calc') {
      qs.push({ type:'smart_calc', stem:`${n*25}×4 =`, answer:`${n*100}`, analysis:'' });
    } else if (type === 'match_pair') {
      qs.push({ type:'match_pair', stem:'连一连。', left_items:[`2+3`,`4+1`], right_items:[`5`,`5`], answer:[[0,0],[1,1]], analysis:'' });
    } else if (type === 'challenge') {
      qs.push({ type:'challenge', stem:`第${n}关：${n*2} + ${n} = ____`, answer:`${n*3}`, analysis:'' });
    } else if (type === 'reading') {
      qs.push({ type:'reading', stem:`${n}. 读一读，答一答。`, answer:'', analysis:'' });
    } else if (type === 'number_split') {
      const top = n + 8;
      if (n % 2 === 1) {
        qs.push({ type:'number_split', top, left: n, right: '__', answer: top - n, analysis:'' });
      } else {
        qs.push({ type:'number_split', top: '__', left: n, right: n + 1, answer: n + (n+1), analysis:'' });
      }
    } else if (type === 'compare') {
      const a = n + 2, b = n + 1, ans = a > b ? '>' : (a < b ? '<' : '=');
      qs.push({ type:'compare', left_expr: `${a}`, right_expr: `${b}`, answer: ans, analysis:'' });
    } else if (type === 'true_false') {
      qs.push({ type:'true_false', stem:`${n + 5} 比 ${n} 大`, answer: '√', analysis:'' });
    } else if (type === 'word_problem') {
      qs.push({ type:'word_problem', stem:`小明有${n+3}个苹果，吃了${n}个，还剩几个？`, answer:`${3}`, analysis:'' });
    } else {
      qs.push({ type, stem:`第 ${n} 题：模拟题目，排版预览用。`, answer:'', analysis:'' });
    }
  }
  return qs;
}

/* 用模拟数据填充（排版阶段，不调LLM） */
function mockFillData(card, type, count, append = false) {
  const qs = mockQuestions(type, count);
  if (append && card._data?.questions) {
    card._data.questions.push(...qs);
  } else {
    card._data = { questions: qs, topic:'', difficulty:'', grade:'', subject:'' };
  }
  card._mock = true;
  card._status = 'ready';
  card.classList.remove('loading');
  const input = card.querySelector('.s-cnt input');
  if (input) input.value = (card._data.questions || []).length;
  renderSecBody(card);
  updateBuilderSummary();
}

/* 调后端出一批题 → 渲染进卡片（append=true 时追加到已有题目后面） */
async function fetchSecData(card, type, count, append = false) {
  const form = builderForm(true);
  if (!form) return;
  const body = card.querySelector('.s-body');
  card._status = 'loading';
  card.classList.add('loading');
  if (!append) {
    body.innerHTML = `<div class="s-loading"><span class="spin"></span>正在出题…（约 3~15 秒）</div>`;
  }
  try {
    const r = await fetch(API + '/api/v1/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        grade: form.grade, subject: form.subject, keyword: form.keyword,
        game_type: type, difficulty: curDiff,
        question_count: count, use_cache: false,
        llm_base_url: loadLlmCfg().baseUrl || undefined,
        llm_model: loadLlmCfg().model || undefined,
        llm_api_key: loadLlmCfg().apiKey || undefined
      })
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      throw new Error(e.detail?.error || ('HTTP ' + r.status));
    }
    const data = await r.json();
    if (append && card._data?.questions) {
      card._data.questions.push(...(data.questions || []));
    } else {
      card._data = data;
    }
    card._status = 'ready';
    card.classList.remove('loading');
    const input = card.querySelector('.s-cnt input');
    if (input) input.value = card._data.questions.length;
    renderSecBody(card);
    updateBuilderSummary();
  } catch (err) {
    card._status = 'error';
    card.classList.remove('loading');
    body.innerHTML = `<div class="s-error">⚠ ${TYPE_NAME[type]}出题失败：${esc(err.message)}<button class="s-retry">↻ 重试</button></div>`;
    updateBuilderSummary();
  }
}

/* 卡片摘要（不展开题目，题目在下面A4预览区展示） */
function renderSecBody(card) {
  const type = card.dataset.type;
  const data = card._data;
  const body = card.querySelector('.s-body');
  const qs = data.questions || [];
  const preview = qs.slice(0, 1).map((q, i) => {
    const stem = (q.stem || '').replace(/<[^>]*>/g, '').substring(0, 30);
    return `<span class="s-q-preview">${cirNum(i+1)} ${esc(stem)}${stem.length>=30?'…':''}</span>`;
  }).join('');
  body.innerHTML = `<div class="s-summary">
    <span class="s-sum-stats">📋 ${qs.length} 题</span>
    ${preview ? `<div class="s-sum-lines">${preview}</div>` : ''}
    ${qs.length > 1 ? `<span class="s-sum-more">+${qs.length-1}</span>` : ''}
  </div>`;
  applyCardLayout(card);
}

/* 数量变化：减少→裁剪题目；增加→追加生成（不丢已有题） */
function onCountChange(card, n) {
  const qs = card._data?.questions || [];
  if (card._status !== 'ready') { updateBuilderSummary(); return; }
  if (n < qs.length) {
    card._data.questions = qs.slice(0, n);
    renderSecBody(card);
    updateBuilderSummary();
  } else if (n > qs.length) {
    mockFillData(card, card.dataset.type, n - qs.length, true);
  } else {
    updateBuilderSummary();
  }
}

/* 空态显隐 */
function showBuilderEmpty(show) {
  const empty = $('#builderEmpty');
  if (show) {
    if (!empty) {
      const el = document.createElement('div');
      el.className = 'builder-empty';
      el.id = 'builderEmpty';
      el.innerHTML = `<b>卷面还是空的</b>点击左侧「选择题」「填空题」等题型卡片，<br>这里会实时出现对应的题型大题块 🧩`;
      $('#secList').appendChild(el);
    }
  } else {
    empty?.remove();
  }
}

/* 读取搭建区 → [{type, count, seq, data, status}]（按当前拖拽后的顺序） */
function readBuilder() {
  return Array.from(document.querySelectorAll('#secList .sec-card')).map(el => ({
    type: el.dataset.type,
    count: Math.min(99, Math.max(1, parseInt(el.querySelector('.s-cnt input').value) || 1)),
    seq: parseInt(el.dataset.seq),
    status: el._status,
    data: el._data,
    el
  }));
}

/* 更新搭建区汇总（大题数 / 总题数 / 预估分值） */
let suspendPreviewRefresh = false; // 生成试卷期间挂起预览刷新，保留编辑效果
let skipNextPreviewRefresh = false; // 单次跳过：手动增量删除后不再全量刷新
function updateBuilderSummary() {
  // 汇总行更新即可；预览刷新在非挂起、非跳过时才执行
  if (!suspendPreviewRefresh && !skipNextPreviewRefresh) {
    const stack = $('#livePaperStack');
    const existingBlocks = stack ? stack.querySelectorAll('.sec-block').length : 0;
    const readySecs = document.querySelectorAll('#secList .sec-card').length;
    if (existingBlocks <= readySecs) refreshLivePreview();
  }
  const secs = readBuilder();
  const nSec = secs.length;
  const nQ = secs.reduce((s, x) => s + (x.status === 'ready' ? x.data.questions.length : x.count), 0);
  const nReady = secs.filter(x => x.status === 'ready').length;
  const nLoading = secs.filter(x => x.status === 'loading').length;
  const nError = secs.filter(x => x.status === 'error').length;
  const seqs = Array.from(document.querySelectorAll('#secList .sec-card')).map(el => el.querySelector('.s-idx'));
  seqs.forEach((s, i) => s.textContent = i + 1);
  $('#builderCount').textContent = nSec ? `${nSec} 个大题` : '0 个大题';
  if (!nSec) {
    $('#builderSummary').innerHTML = '还没有安排任何大题';
    showBuilderEmpty(true);
  } else {
    let html = `共 <b>${nSec}</b> 个大题 ｜ <b>${nQ}</b> 道题 ｜ 预计总分 <b>100</b> 分`;
    if (nLoading) html += ` ｜ <span class="s-loading-txt">⏳ ${nLoading} 个出题中…</span>`;
    if (nError) html += ` ｜ <span class="s-err-txt">⚠ ${nError} 个失败</span>`;
    if (!nLoading && !nError && nReady === nSec) html += ` ｜ <span class="s-ok-txt">✅ 全部就绪，可组卷</span>`;
    $('#builderSummary').innerHTML = html;
    showBuilderEmpty(false);
  }
}

/* 实时A4纸预览 —— 每当题目变化/模板切换时自动刷新 */
let deletedElements = {}; // 记录每个模板中被删除的元素 key

function refreshLivePreview(forceFullRender) {
  const secs = readBuilder();
  const readySecs = secs.filter(s => s.status === 'ready');
  const preview = $('#livePreview');
  const stack = $('#livePaperStack');
  if (!preview || !stack) return;
  if (!readySecs.length) { preview.style.display = 'none'; return; }

  // 构建 paperData（不改变全局 paperData）
  const form = builderForm(true);
  if (!form) { preview.style.display = 'none'; return; } // 校验不通过静默跳过，不弹 alert
  const d = {
    grade: form.grade, subject: form.subject, keyword: form.keyword,
    title: $('#titleInput').value.trim(),
    sections: readySecs.map(s => ({ type: s.type, data: s.data, _layout: (s.el._layout || {qCols:1, optCols:2, showNo:true}), _sid: s.el._sid || undefined })),
    _manualOrder: true
  };
  // 全局题号
  let no = 0;
  d.sections.forEach(sec => sec.data.questions.forEach(q => { no++; q._no = no; q._qid = q._qid || `q${no}_${Math.random().toString(36).slice(2,7)}`; }));
  d.allQs = d.sections.flatMap(s => s.data.questions);

  // ── 增量模式：A4 纸上已有 sec-block 时，只追加新增的块，不重渲染（保留用户编辑）──
  const existingBlocks = stack.querySelectorAll('.sec-block');
  if (existingBlocks.length && existingBlocks.length < d.sections.length && !forceFullRender) {
    paperData = d; // 更新全局数据（题号等）
    // 只把新增加的 sections 渲染出来，插入到最后一页的 footer 前
    const newSecs = d.sections.slice(existingBlocks.length);
    const lastPaper = stack.querySelector('.paper:last-child') || stack.querySelector('.paper');
    const exam = lastPaper?.querySelector('.exam');
    if (exam) {
      const tpl = currentTemplate || TEMPLATES[0];
      const tmp = document.createElement('div');
      newSecs.forEach((sec, k) => {
        // 局部题号（每块内从 1 开始）
        sec.data.questions.forEach((q, qi) => { q._secIdx = qi; });
        tmp.innerHTML = renderSecHTML(sec, existingBlocks.length + k, { showScore: tpl.showScore, secTotal: () => '' });
        const block = tmp.firstElementChild;
        const footer = exam.querySelector('.footer-note');
        if (footer) exam.insertBefore(block, footer); else exam.appendChild(block);
      });
      // 新块可编辑
      makePaperEditable(stack);
      // 更新汇总行
      $('#sumLine').textContent = `📋 ${d.grade} ${d.subject} ｜ ${d.keyword} ｜ 共 ${no} 题（${d.sections.map(s => `${TYPE_NAME[s.type]}×${s.data.questions.length}`).join(' + ')}）｜ 满分 100 分`;
    }
    preview.style.display = '';
    return;
  }

  // 渲染到 livePaperStack（只取学生卷，不含答案）
  const oldPaperData = paperData;
  const oldShowAnswers = showAnswers;
  paperData = d;
  showAnswers = false;
  renderPaper();
  const paperStack = $('#paperStack');
  if (paperStack && stack) {
    const firstPaper = paperStack.querySelector('.paper');
    stack.innerHTML = firstPaper ? firstPaper.outerHTML : '';
    paperStack.innerHTML = '';
  }
  // 让A4纸上关键元素可编辑
  makePaperEditable(stack);
  // A4 分页
  paginateA4(stack);
  // 恢复删除状态
  const tplId = (currentTemplate || TEMPLATES[0]).id;
  const dels = deletedElements[tplId] || {};
  Object.keys(dels).forEach(key => {
    if (dels[key]) {
      const el = stack.querySelector(`[data-editable="${key}"]`);
      if (el) { el.style.display = 'none'; el.dataset.deleted = '1'; }
    }
  });
  paperData = oldPaperData;
  showAnswers = oldShowAnswers;
  preview.style.display = '';
}

/* 让A4纸上的标题、副标题、信息行、注意事项可点击编辑 */
function makePaperEditable(stack) {
  const paper = stack.querySelector('.paper');
  if (!paper) return;
  const els = [
    { sel:'h1',             key:'title', multi:false },
    { sel:'.sub-line',      key:'sub', multi:false },
    { sel:'.info-row',      key:'info', multi:false },
    { sel:'.notice',        key:'notice', multi:false },
    { sel:'.footer-note',   key:'footer', multi:false },
    { sel:'.sec',           key:'sec', multi:true }
  ];
  els.forEach(({sel, key, multi}) => {
    const elements = multi ? paper.querySelectorAll(sel) : [paper.querySelector(sel)].filter(Boolean);
    elements.forEach((el, idx) => {
      if (!el) return;
      el.contentEditable = 'true';
      const keyId = multi ? key + idx : key;
      el.dataset.editable = key;
      el.classList.add('can-edit');
      el.title = '点击编辑 · 右侧按钮可删除';
      const del = document.createElement('span');
      del.className = 'ed-del';
      del.textContent = '✕';
      del.title = '删除此元素';
      del.onclick = (e) => { e.stopPropagation(); el.style.display = 'none'; el.dataset.deleted = '1'; const tplId = (currentTemplate || TEMPLATES[0]).id; if (!deletedElements[tplId]) deletedElements[tplId] = {}; deletedElements[tplId][keyId] = true; };
      el.style.position = el.style.position || 'relative';
      el.appendChild(del);
    });
  });
  // 分数单独可删
  paper.querySelectorAll('.score-box').forEach(box => {
    box.contentEditable = 'true';
    box.classList.add('can-edit');
    box.title = '点击编辑 · 右侧可删除';
    if (!box.querySelector('.ed-del')) {
      const del = document.createElement('span');
      del.className = 'ed-del';
      del.textContent = '✕';
      del.title = '删除此分数';
      del.onclick = (e) => { e.stopPropagation(); box.style.display = 'none'; };
      box.style.position = box.style.position || 'relative';
      box.appendChild(del);
    }
  });
  // 表格大小可拖拽调整
  enableTableResize(paper);
  // 表格单元格可编辑（改字号、颜色等）
  paper.querySelectorAll('.q-table td').forEach(td => {
    td.contentEditable = 'true';
    td.classList.add('can-edit');
  });
  // 所有题目文字可编辑
  paper.querySelectorAll('.q, .opts > div').forEach(el => {
    el.contentEditable = 'true';
    el.classList.add('can-edit');
  });
  // 非表格模式下每道题可独立拖拽宽高
  enableCellResize(paper);
}

/* 非表格模式下每道题独立拖拽宽高 */
function enableCellResize(paper) {
  const cells = paper.querySelectorAll('.q-grid .q');
  cells.forEach(cell => {
    cell.style.position = cell.style.position || 'relative';
    // 右下角拖拽手柄
    if (!cell.querySelector('.cell-resizer')) {
      const rz = document.createElement('span');
      rz.className = 'cell-resizer';
      rz.title = '拖拽调整大小';
      rz.textContent = '⤡';
      cell.appendChild(rz);
      let sx, sy, sw, sh;
      rz.addEventListener('mousedown', (e) => {
        e.preventDefault(); e.stopPropagation();
        sx = e.clientX; sy = e.clientY;
        sw = cell.offsetWidth; sh = cell.offsetHeight;
        const onMove = (ev) => {
          cell.style.width = Math.max(30, sw + ev.clientX - sx) + 'px';
          cell.style.height = Math.max(20, sh + ev.clientY - sy) + 'px';
        };
        const onUp = () => {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    }
  });
}

/* 替换预览区模拟题目文字为 LLM 真实数据，不重渲染 */
function patchLivePreviewInStack(stack, finalSecs) {
  if (!stack) return;
  // 按顺序匹配：遍历每个 section 下的题目，依次替换预览区里对应 section 的 .q
  const secBlocks = stack.querySelectorAll('.sec-block');
  finalSecs.forEach((sec, si) => {
    if (!sec.data || !sec.data.questions) return;
    const newQs = sec.data.questions;
    const block = secBlocks[si];
    if (!block) return;
    const secLayout = sec._layout || {qCols:1, optCols:2, tableBorder:'none', fontSize:'', showNo:true};
    const qEls = block.querySelectorAll('.q');
    qEls.forEach((el, qi) => {
      const newQ = newQs[qi];
      if (!newQ) return;
      // 数的分成：重新渲染内容，保留外层元素的样式
      if (newQ.top != null) {
        el.innerHTML = (secLayout.showNo === false ? '' : `${cirNum((newQ._no || (qi + 1)))} `) + renderNumberSplit(newQ, secLayout);
        return;
      }
      // 比大小：重新渲染
      if (newQ.left_expr != null) {
        el.innerHTML = (secLayout.showNo === false ? '' : `${cirNum((newQ._no || (qi + 1)))} `) + renderCompare(newQ);
        return;
      }
      const stemEl = el.querySelector('[data-e="stem"]');
      if (stemEl && newQ.stem) {
        const lv = newQ.difficulty_level ? `[第${newQ.difficulty_level}关] ` : '';
        const circle = stemEl.textContent.match(/^[①-⑳]/);
        const prefix = circle ? circle[0] + ' ' : '';
        // 判断题：格式化题干（去句号、补括号）
        const tfText = newQ.type === 'true_false' ? tfStem(newQ.stem) : newQ.stem;
        stemEl.innerHTML = esc(prefix + lv + tfText);
      }
      const optsEl = el.querySelector('[data-e="opts"]');
      if (optsEl && newQ.options) {
        optsEl.innerHTML = newQ.options.map((o, j) =>
          `<div>${String.fromCharCode(65 + j)}. ${esc(stripOptPrefix(o))}</div>`).join('');
      }
      const matchEl = el.querySelector('[data-e="match"]');
      if (matchEl && newQ.left_items) {
        matchEl.innerHTML = `<tr><th style="width:50%">左栏</th><th style="width:50%">右栏</th></tr>` +
          newQ.left_items.map((lft, i) =>
            `<tr data-i="${i}"><td>（${i + 1}）${esc(lft)}</td><td>（${i + 1}）${esc(newQ.right_items[i])}</td></tr>`).join('');
      }
    });
  });
}

    if (!stillFailed) tip.remove();

  }
  const ps = $('#paperStack');
  if (ps) ps.innerHTML = fps.innerHTML;
}

/* A4 分页：超出一张纸高度的内容自动分到下一张 */
function paginateA4(stack) {
  const papers = stack.querySelectorAll('.paper');
  if (!papers.length) return;
  const firstPaper = papers[0];
  const exam = firstPaper.querySelector('.exam');
  if (!exam) return;
  const secBlocks = exam.querySelectorAll('.sec-block');
  if (!secBlocks.length) return;

  // 1. 锁定一页纸高度，测量"可用内容高度"（纸高 - 上下 padding）
  firstPaper.style.height = '297mm';
  firstPaper.style.overflow = 'hidden';
  const cs = getComputedStyle(firstPaper);
  const availH = firstPaper.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);

  // 2. 解除高度限制，测量每个大题块的真实高度 + 卷头高度
  firstPaper.style.height = 'auto';
  firstPaper.style.overflow = 'visible';

  // 卷头 = .sec-block 之前的所有元素（大标题、信息栏、注意事项等）；页脚单独提出，只放最后一页
  let headerHTML = '';
  let headerH = 0;
  let footerHTML = '';
  for (const k of Array.from(exam.children)) {
    if (k.classList && k.classList.contains('sec-block')) break;
    if (k.classList && k.classList.contains('footer-note')) { footerHTML = k.outerHTML; continue; }
    headerHTML += k.outerHTML;
    headerH += k.offsetHeight || 0;
  }

  const blocks = Array.from(secBlocks).map(b => ({ html: b.outerHTML, h: b.offsetHeight || 0 }));

  // 3. 恢复锁定
  firstPaper.style.height = '297mm';
  firstPaper.style.overflow = 'hidden';

  // 4. 按块切页：每页容量 = 可用高度 - 卷头（每页都带卷头，保持一致）
  const pageCap = availH - headerH - 2; // -2px 余量
  const pages = [];
  let cur = [], curH = 0;
  for (const b of blocks) {
    if (cur.length && curH + b.h > pageCap) {
      pages.push(cur);
      cur = []; curH = 0;
    }
    cur.push(b);
    curH += b.h;
  }
  if (cur.length) pages.push(cur);
  if (pages.length <= 1) return; // 一页装得下，无需分页

  // 5. 第一页 = 卷头 + 第一组块（+ 单页时附页脚）
  exam.innerHTML = headerHTML + pages[0].map(b => b.html).join('') + (pages.length === 1 ? footerHTML : '');

  // 6. 后续页：克隆纸张结构，替换内容；最后一页附页脚
  const wrapper = firstPaper.parentElement;
  for (let i = 1; i < pages.length; i++) {
    const newPage = firstPaper.cloneNode(true);
    newPage.style.width = '210mm';
    newPage.style.height = '297mm';
    newPage.style.maxWidth = '210mm';
    newPage.style.overflow = 'hidden';
    newPage.querySelector('.exam').innerHTML = headerHTML + pages[i].map(b => b.html).join('') + (i === pages.length - 1 ? footerHTML : '');
    wrapper.appendChild(newPage);
  }
}

function enableTableResize(paper) {
  const tables = paper.querySelectorAll('.q-table');
  tables.forEach(table => {
    // 给每个 td 加拖拽手柄（右边缘=列宽，底边缘=行高）
    table.querySelectorAll('td').forEach(td => {
      td.style.position = td.style.position || 'relative';
      // 列宽拖拽 —— 右边缘
      if (!td.querySelector('.col-resizer')) {
        const cr = document.createElement('span');
        cr.className = 'col-resizer';
        cr.title = '拖拽调整列宽';
        td.appendChild(cr);
        cr.addEventListener('mousedown', (e) => {
          e.preventDefault(); e.stopPropagation();
          const colIndex = Array.from(td.parentElement.children).indexOf(td);
          const allRows = table.querySelectorAll('tr');
          const sx = e.clientX;
          const sw = td.offsetWidth;
          const onMove = (ev) => {
            const w = Math.max(15, sw + ev.clientX - sx);
            allRows.forEach(row => {
              const cell = row.children[colIndex];
              if (cell) cell.style.width = w + 'px';
            });
          };
          const onUp = () => {
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
          };
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
        });
      }
      // 行高拖拽 —— 底边缘
      if (!td.querySelector('.row-resizer')) {
        const rr = document.createElement('span');
        rr.className = 'row-resizer';
        rr.title = '拖拽调整行高';
        td.appendChild(rr);
        rr.addEventListener('mousedown', (e) => {
          e.preventDefault(); e.stopPropagation();
          const row = td.closest('tr');
          const sy = e.clientY;
          const sh = td.offsetHeight;
          const onMove = (ev) => {
            const h = Math.max(15, sh + ev.clientY - sy);
            row.querySelectorAll('td').forEach(t => t.style.height = h + 'px');
          };
          const onUp = () => {
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
          };
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
        });
      }
    });
  });
}

  needFetch.forEach(c => { c._mock = true; }); // 确保 AI 会替换
  if (needFetch.length) {

    try {
      // 构造批量请求项（同题型多块合并，取最大题数）
      const items = [];
      const cardByType = {};
      needFetch.forEach(card => {
        const t = card.dataset.type;
        if (!cardByType[t]) {
          cardByType[t] = [];
          items.push({ game_type: t, question_count: cardCount(card) });
        }
        cardByType[t].push(card);
      });
      items.forEach(it => {
        const cards = cardByType[it.game_type];
        it.question_count = Math.max(...cards.map(c => cardCount(c)));
      });

      btn.textContent = `⏳ AI 出题中（整卷 1 次请求）…`;
      const form2 = builderForm();
      // 读取份数：多份时逐份生成（每份题目不同）
      const nPapers = Math.max(1, parseInt($('#paperCount')?.value) || 1);
      const addDay = $('#addDayLabel')?.checked ?? false;
      if (nPapers > 1) btn.textContent = `⏳ AI 出题中（共 ${nPapers} 份，逐份生成）…`;
      const fetchOne = async () => {
        const r = await fetch(API + '/api/v1/generate-batch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade: form2.grade, subject: form2.subject, keyword: form2.keyword,
            difficulty: curDiff, items,
            llm_base_url: loadLlmCfg().baseUrl || undefined,
            llm_model: loadLlmCfg().model || undefined,
            llm_api_key: loadLlmCfg().apiKey || undefined
          })
        });
        if (!r.ok) {
          const e = await r.json().catch(() => ({}));
          throw new Error(e.detail?.error || ('HTTP ' + r.status));
        }
        return await r.json();
      };
      const data = await fetchOne();
      // 多份：其余份数据存入 batchPapers（第一份已在上面正常处理）
      batchPapers = [];
      if (nPapers > 1) {
        for (let k = 1; k < nPapers; k++) {
          btn.textContent = `⏳ AI 出题中（第 ${k + 1}/${nPapers} 份）…`;
          try {
            const d2 = await fetchOne();
            batchPapers.push({ sections: d2.sections || [], layouts: needFetch.map(c => Object.assign({}, c._layout || {qCols:1,optCols:2,showNo:true})) });
          } catch (err) {
            console.warn(`第 ${k + 1} 份生成失败，跳过`, err);
          }
        }
        // 更新导出按钮文案
        const be1 = $('#btnBatchExport');
        if (be1) be1.textContent = `📦 导出全部（${batchPapers.length + 1} 份）`;
        const me1 = $('#btnMergeExport');
        if (me1) me1.textContent = `📄 合并 PDF（${batchPapers.length + 1} 份合一）`;
      }
      batchAddDay = addDay && nPapers > 1;
      // 将返回的 sections 按题型回填到卡片
      (data.sections || []).forEach((sec, idx) => {
        const t = items[idx]?.game_type;
        const cards = cardByType[t] || [];
        cards.forEach(card => {
          card._data = sec;
          card._mock = false;
          card._status = 'ready';
          card.classList.remove('loading');
          const input = card.querySelector('.s-cnt input');
          if (input) input.value = (sec.questions || []).length;
          renderSecBody(card);
        });
      });
      // 没覆盖到的卡片标记失败（保持模拟数据）
      needFetch.forEach(card => {
        if (card._mock) {
          failedTypes.push({ type: card.dataset.type, name: TYPE_NAME[card.dataset.type] || card.dataset.type });
        }
      });
      updateBuilderSummary();
    } catch(e) {
      console.warn('AI 批量出题失败，使用模拟数据:', e.message);
      failedTypes.push({ type: '批量', name: e.message });
    } finally {
      btn.textContent = '🚀 生成试卷';
      btn.disabled = false;
    }
  }

  // 重读搭建区（数据已更新）
  const finalSecs = readBuilder();
  finalSecs.forEach(s => syncCardEdits(s.el));
  paperData = {
    grade: form?.grade || '小学一年级',
    subject: form?.subject || '数学',
    keyword: form?.keyword || '练习',
    title: $('#titleInput').value.trim(),
    sections: finalSecs.map(s => ({ type: s.type, data: s.data, _layout: (s.el._layout || {qCols:1, optCols:2, showNo:true}) })),
    _manualOrder: true
  };
  showAnswers = false;
  $('#btnPreviewAns').textContent = '👁 预览答案';
  // 用 livePaperStack 作为最终试卷区（保留所有格式编辑）
  const liveStack = $('#livePaperStack');
  const fps = $('#finalPaperStack');
  const ps = $('#paperStack');
  if (liveStack && fps && ps) {
    // 先把 livePaperStack 里的 mock 内容替换为 AI 数据（保留格式标签）
    patchLivePreviewInStack(liveStack, finalSecs);
    const rendered = liveStack.innerHTML;
    fps.innerHTML = rendered;
    ps.innerHTML = rendered;
    if (failedTypes.length) {
      const failedTypeSet = new Set(failedTypes.map(f => f.type));
      fps.querySelectorAll('.sec-block').forEach(block => {
        if (failedTypeSet.has(block.dataset.type)) {
          const qs = block.querySelectorAll('.q');
          qs.forEach(q => {
            q.style.opacity = '0.35';
            q.title = '此题生成失败';
          });
        }
      });
      const tipDiv = document.createElement('div');
      tipDiv.className = 'sec-block';
      tipDiv.style.cssText = 'padding:4mm;border:2px dashed #e88;background:#fff5f5;margin-bottom:4mm;color:#c33;font-size:10pt';
      tipDiv.innerHTML = `<b>⚠ 以下题型生成失败：</b> ${failedTypes.map(f=>f.name).join('、')}<br><small>已显示为灰色，如需重试请返回搭建区点击"↻ 重试"</small>`;
      const exam = fps.querySelector('.exam');
      if (exam) exam.insertBefore(tipDiv, exam.firstChild);
      ps.innerHTML = fps.innerHTML;
    }
  }
  $('#resultArea').style.display = 'block';
  // 弹层关闭：按钮 / 点遮罩空白处 / ESC
  $('#btnCloseResult').onclick = () => { $('#resultArea').style.display = 'none'; };
  $('#resultArea').onclick = (e) => {

  };
  document.onkeydown = (e) => {
    if (e.key === 'Escape' && $('#resultArea').style.display === 'block') $('#resultArea').style.display = 'none';
  };
  // 恢复预览刷新
  suspendPreviewRefresh = false;
}

/* 搭建区 contenteditable 编辑内容 → 回写到大题数据（组卷前调用） */
function syncCardEdits(card) {
  if (!card._data?.questions) return;
  const type = card.dataset.type;
  if (type === 'reading') {
    const p = card.querySelector('.s-passage');
    if (p) card._data.passage = p.innerText.trim();
  }
  card.querySelectorAll('.s-q').forEach(qEl => {
    const q = card._data.questions[parseInt(qEl.dataset.i)];
    if (!q) return;
    const stemEl = qEl.querySelector('.s-q-stem');
    if (stemEl && q.stem != null) q.stem = stemEl.innerText.trim();
    qEl.querySelectorAll('.s-opts > div').forEach(oEl => {
      const j = parseInt(oEl.dataset.oi);
      if (q.options && q.options[j] != null) {
        const m = oEl.innerText.trim().match(/^[A-H][.、：:．]\s*(.+)$/);
        q.options[j] = m ? m[1] : oEl.innerText.trim();
      }
    });
    const tds = qEl.querySelectorAll('.s-match td');
    tds.forEach((td, k) => {
      if (!q.left_items || !q.right_items) return;
      if (k % 2 === 0) q.left_items[k / 2] = td.innerText.trim();
      else q.right_items[(k - 1) / 2] = td.innerText.trim();
    });
  });
}
