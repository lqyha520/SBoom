/* ── 渲染试卷 ── */
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* 判断题题干格式化：去掉末尾句号，补（　）括号 */
function tfStem(s) {
  let t = String(s ?? '').trim();
  t = t.replace(/。+\s*$/, '');            // 去掉末尾句号
  if (!/[（(]\s*[）)]\s*$/.test(t)) t += '（　）'; // 没括号则补
  return t;
}

/* 判断数的分成字段是否为空（兼容 __、____、空串、null、'?'） */
function isBlankVal(v) {
  if (v === null || v === undefined) return true;
  const s = String(v).trim();
  return s === '' || /^_+$/.test(s) || s === '?' || s === '□';
}

/* 数的分成渲染：返回 HTML 字符串（树状图，用 SVG 画斜线） */
function renderNumberSplit(q, layout) {
  const topIsBlank = isBlankVal(q.top);
  const leftIsBlank = isBlankVal(q.left);
  const rightIsBlank = isBlankVal(q.right);
  const topVal = topIsBlank ? '' : q.top;
  const leftVal = leftIsBlank ? '' : q.left;
  const rightVal = rightIsBlank ? '' : q.right;
  return `<div class="split-wrap">
    <div class="split-box${topIsBlank ? ' blank' : ''}">${esc(topVal)}</div>
    <svg class="split-lines" viewBox="0 0 120 22" preserveAspectRatio="none">
      <path d="M60 0 L30 22 M60 0 L90 22" />
    </svg>
    <div class="split-bottom">
      <span class="split-box${leftIsBlank ? ' blank' : ''}">${esc(leftVal)}</span>
      <span class="split-box${rightIsBlank ? ' blank' : ''}">${esc(rightVal)}</span>
    </div>
  </div>`;
}

/* 比大小渲染 */
function renderCompare(q) {
  return `<div class="compare-row">
    <span class="compare-expr">${esc(q.left_expr)}</span>
    <span class="compare-circle"></span>
    <span class="compare-expr">${esc(q.right_expr)}</span>
  </div>`;
}
function cirNum(n) { const c = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳'; return n <= 20 ? c[n - 1] : `${n}.`; }

function ansText(q) {
  if (q.options && typeof q.answer === 'number') return String.fromCharCode(65 + q.answer);
  if (Array.isArray(q.answer)) return q.answer.map(p => `${p[0]+1}－${p[1]+1}`).join('，');
  return String(q.answer);
}

/* 剥掉 LLM 可能误带的选项字母前缀（如 "A." "B：" "(C)" "D、"），避免出现 "A. A" 重复 */
function stripOptPrefix(o) {
  const m = String(o).trim().match(/^(?:[（(][A-H][）)]|[A-H](?:\.|:|：|、|．|\)|）))\s*(.+)$/);
  return m ? m[1] : String(o);
}

/* 渲染单个大题块的 HTML（renderPaper 与增量追加共用） */
function renderSecHTML(sec, si, opts) {
  const qs = sec.data.questions;
  const secLayout = sec._layout || {qCols:1, optCols:2, tableBorder:'none', fontSize:'', showNo:true};
  secLayout.tableBorder = secLayout.tableBorder || 'none';
  secLayout.qCols = secLayout.qCols || 1;
  const fsStyle = secLayout.fontSize ? `font-size:${secLayout.fontSize};` : '';
  sec._sid = sec._sid || `s${si}_${Math.random().toString(36).slice(2,7)}`;
  let html = `<div class="sec-block" data-type="${sec.type}" data-sid="${sec._sid}">`;
  html += `<h2 class="sec"><span>${CN_NUM[si]}、${TYPE_NAME[sec.type]}</span>` + (opts.showScore ? `<span class="score-box">共 ${opts.secTotal(sec)} 分</span>` : '') + `</h2>`;

  if (sec.type === 'reading' && sec.data.passage) {
    html += `<div class="reading-box" data-e="passage">${esc(sec.data.passage).replace(/\n/g, '<br>')}</div>`;
  }

  const hasBorder = secLayout.tableBorder && secLayout.tableBorder !== 'none';
  if (hasBorder) {
    const rows = [];
    for (let i = 0; i < qs.length; i += secLayout.qCols) {
      rows.push(qs.slice(i, i + secLayout.qCols));
    }
    const tblColor = secLayout.tableBorder === 'dashed' ? '#ccc' : '#333';
    html += `<table class="q-table" style="border-collapse:collapse;width:100%;border:1px ${secLayout.tableBorder} ${tblColor};margin:0;">`;
    rows.forEach(row => {
      html += `<tr>`;
      row.forEach(q => {
        const lv = q.difficulty_level ? `<span class="lv">[第${q.difficulty_level}关]</span> ` : '';
        let stem = q.stem ? esc(q.stem) : '';
        if (q.type === 'true_false') stem = esc(tfStem(q.stem));
        const noTag = secLayout.showNo === false ? '' : `${cirNum(q._secIdx + 1)} `;
        const isSplit = q.top != null;
        const isCompare = q.left_expr != null;
        const stemHtml = isSplit ? '' : (isCompare ? '' : `${noTag}${lv}${stem}`);
        html += `<td style="border:1px ${secLayout.tableBorder} ${tblColor};padding:1mm 3mm;vertical-align:top;${fsStyle}">`;
        html += `<div class="q" data-qid="${q._qid}" style="${fsStyle}">`;
        if (isSplit) {
          html += `${noTag}${renderNumberSplit(q, secLayout)}`;
        } else if (isCompare) {
          html += `${noTag}${renderCompare(q)}`;
        } else {
          html += `<div data-e="stem">${stemHtml}</div>`;
          if (q.options) {
            html += `<div class="opts" data-e="opts" style="grid-template-columns:repeat(${secLayout.optCols},1fr)">` + q.options.map((o, j) =>
              `<div>${String.fromCharCode(65 + j)}. ${esc(stripOptPrefix(o))}</div>`).join('') + `</div>`;
          } else if (q.left_items) {
            html += `<table class="match-table" data-e="match"><tr><th style="width:50%">左栏</th><th style="width:50%">右栏</th></tr>`;
            q.left_items.forEach((lft, i) => {
              html += `<tr data-i="${i}"><td>（${i + 1}）${esc(lft)}</td><td>（${i + 1}）${esc(q.right_items[i])}</td></tr>`;
            });
            html += `</table>`;
          }
        }
        html += `</div></td>`;
      });
      while (row.length < secLayout.qCols) {
        html += `<td style="border:1px ${secLayout.tableBorder} ${tblColor};padding:1mm 3mm;${fsStyle}"></td>`;
        row.push(null);
      }
      html += `</tr>`;
    });
    html += `</table>`;
  } else {
    html += `<div class="q-grid" style="display:grid;grid-template-columns:repeat(${secLayout.qCols},1fr);column-gap:${secLayout.qCols>1?'12mm':'0'}">`;
    qs.forEach(q => {
      const lv = q.difficulty_level ? `<span class="lv">[第${q.difficulty_level}关]</span> ` : '';
      let stem = q.stem ? esc(q.stem) : '';
      if (q.type === 'true_false') stem = esc(tfStem(q.stem));
      const noTag = secLayout.showNo === false ? '' : `${cirNum(q._secIdx + 1)} `;
      const isSplit = q.top != null;
      const isCompare = q.left_expr != null;
      html += `<div class="q" data-qid="${q._qid}" style="${fsStyle}">`;
      if (isSplit) {
        html += `${noTag}${renderNumberSplit(q, secLayout)}`;
      } else if (isCompare) {
        html += `${noTag}${renderCompare(q)}`;
      } else {
        html += `<div data-e="stem">${noTag}${lv}${stem}</div>`;
        if (q.options) {
          html += `<div class="opts" data-e="opts" style="grid-template-columns:repeat(${secLayout.optCols},1fr)">` + q.options.map((o, j) =>
            `<div>${String.fromCharCode(65 + j)}. ${esc(stripOptPrefix(o))}</div>`).join('') + `</div>`;
        } else if (q.left_items) {
          html += `<table class="match-table" data-e="match"><tr><th style="width:50%">左栏</th><th style="width:50%">右栏</th></tr>`;
          q.left_items.forEach((lft, i) => {
            html += `<tr data-i="${i}"><td>（${i + 1}）${esc(lft)}</td><td>（${i + 1}）${esc(q.right_items[i])}</td></tr>`;
          });
          html += `</table>`;
        }
      }
      html += `</div>`;
    });
    html += `</div>`; // q-grid
  }
  html += `</div>`; // sec-block
  return html;
}

function renderPaper() {
  const d = paperData;

  // 大题按固定顺序排列（客观题→计算题→主观题）；人工排版过的卷子保持用户顺序
  if (!d._manualOrder) {
    d.sections.sort((a, b) => TYPE_ORDER.indexOf(a.type) - TYPE_ORDER.indexOf(b.type));
  }

  // 每题独立编号（每块从 1 开始）
  let no = 0;
  d.sections.forEach(sec => { sec._startNo = no + 1; sec.data.questions.forEach(q => { no++; q._no = no; q._secIdx = q._no - sec._startNo; q._qid = q._qid || `q${no}_${Math.random().toString(36).slice(2,7)}`; }); });
  d.allQs = d.sections.flatMap(s => s.data.questions);
  const totalQ = no;

  // 分值：客观题(有选项)每题2分，其余平摊剩余，总和恒为 100
  const isObj = q => !!q.options;
  const objQs = [], subQs = [];
  d.sections.forEach(sec => sec.data.questions.forEach(q => (isObj(q) ? objQs : subQs).push(q)));
  const score = new Map();
  if (subQs.length) {
    objQs.forEach(q => score.set(q, 2));
    let remain = Math.max(100 - objQs.length * 2, subQs.length);
    const base = Math.floor(remain / subQs.length);
    let extra = remain - base * subQs.length;
    subQs.forEach(q => { score.set(q, base + (extra-- > 0 ? 1 : 0)); });
  } else {
    const base = Math.floor(100 / totalQ);
    let extra = 100 - base * totalQ;
    d.allQs.forEach(q => { score.set(q, base + (extra-- > 0 ? 1 : 0)); });
  }
  const secTotal = sec => sec.data.questions.reduce((s, q) => s + score.get(q), 0);

  $('#sumLine').textContent = `📋 ${d.grade} ${d.subject} ｜ ${d.keyword} ｜ 共 ${totalQ} 题（${d.sections.map(s => `${TYPE_NAME[s.type]}×${s.data.questions.length}`).join(' + ')}）｜ 满分 100 分`;

  // ── 学生卷 ──
  const tpl = currentTemplate || TEMPLATES[0];
  const showScore = tpl.showScore;
  const showInfoRow = tpl.showInfoRow;
  const showNotice = tpl.showNotice;

  let html = `<div class="paper" style="width:210mm;height:297mm;overflow:hidden;display:flex;flex-direction:column"><div class="exam" style="flex:1;display:flex;flex-direction:column">`;
  // 标题：优先用用户输入的titleInput，否则用模板组合
  const paperTitle = d.title || (tpl.titlePrefix ? (tpl.titlePrefix + ' · ' + d.grade + d.subject + (tpl.titleSuffix||'')) : (d.grade + d.subject + (tpl.titleSuffix||'测试卷')));
  html += `<h1>${esc(paperTitle)}</h1>`;
  // 副标题行
  const subParts = [];
  if (tpl.headerExtra) subParts.push(tpl.headerExtra);
  subParts.push('范围：' + esc(d.keyword));
  subParts.push('难度：' + DIFF_NAME[curDiff]);
  if (showScore) subParts.push('满分 100 分');
  html += `<div class="sub-line">${subParts.join(' ｜ ')}</div>`;
  // 信息栏
  if (showInfoRow) {
    html += `<div class="info-row"><div>姓名：<span>&nbsp;</span></div><div>班级：<span>&nbsp;</span></div><div>学号：<span>&nbsp;</span></div><div>得分：<span>&nbsp;</span></div></div>`;
  }
  // 注意事项
  if (showNotice) {
    html += `<div class="notice"><b>注意事项：</b>① 答题前请将姓名、班级填写清楚；② 选择题答案填入答题卡；③ 保持卷面整洁，字迹工整。</div>`;
  }

  // 各大题块（复用 renderSecHTML）
  d.sections.forEach((sec, si) => {
    html += renderSecHTML(sec, si, { showScore, secTotal });
  });
  html += `<div class="footer-note" style="margin-top:auto">${esc(tpl.footer || '')}</div>`;
  html += `</div></div>`;

  $('#paperStack').innerHTML = html;
}

function fillBlanks() {
  if (!paperData) return;
  document.querySelectorAll('#paperStack .paper:first-child .q').forEach(el => {
    if (el.querySelector('.q-ans-inline')) return;
    const qid = el.dataset.qid;
    const q = qid ? paperData.allQs.find(x => x._qid === qid) : null;
    if (!q) return;
    let a;
    if (q.top != null) {
      // 数的分成：答案即空位填入的数字
      const t = isBlankVal(q.top) ? q.answer : q.top;
      const l = isBlankVal(q.left) ? q.answer : q.left;
      const r = isBlankVal(q.right) ? q.answer : q.right;
      a = `${t} 分成 ${l} 和 ${r}`;
    } else if (q.left_expr != null) {
      // 比大小
      a = `${q.left_expr} ○ ${q.right_expr} → ${q.answer}`;
    } else if (q.left_items) {
      a = q.answer.map(p => `（${p[0] + 1}）→（${p[1] + 1}）`).join('；');
    } else {
      a = ansText(q);
      if (q.options && typeof q.answer === 'number') a += `（${stripOptPrefix(q.options[q.answer])}）`;
    }
    const span = document.createElement('div');
    span.className = 'q-ans-inline';
    span.style.cssText = 'color:#d0342c;font-weight:600;font-size:10.5pt;margin-top:1mm;';
    span.textContent = `✎ 答案：${a}`;
    el.appendChild(span);
  });
}
function clearBlanks() {
  document.querySelectorAll('#paperStack .q-ans-inline').forEach(el => el.remove());
}

/* ── 人工排版模式（SortableJS 拖拽 + contenteditable 编辑）── */
let layoutMode = false;
let sortables = [];

function initLayoutMode() {
  const stack = $('#paperStack');
  const tip = document.createElement('div');
  tip.className = 'layout-tip';
  tip.innerHTML = `<b>✏️ 排版模式</b>：拖 ⠿ 调整顺序（题目可跨大题移动）｜虚线框文字点击可直接修改｜✕ 删除题目或大题｜完成后点「✅ 完成排版」重新计算题号与分值`;
  stack.parentNode.insertBefore(tip, stack);

  $('#btnLayout').onclick = () => {
    if (!paperData) return;
    if (showAnswers) { $('#btnPreviewAns').click(); }
    exitLayout(false);
    enterLayout();
  };
  $('#btnLayoutDone').onclick = () => exitLayout(true);
}

/* 进入排版：激活 Sortable + contenteditable + 注入工具按钮 + 自由调整大小 */
function enterLayout() {
  layoutMode = true;
  $('#paperStack').classList.add('layouting');
  $('#btnLayout').style.display = 'none';
  $('#btnLayoutDone').style.display = '';
  $('.layout-tip').style.display = 'block';

  const paper = $('#paperStack .paper');
  if (!paper) return;

  // 大题工具条（删除大题）
  paper.querySelectorAll('.sec-block').forEach(secEl => {
    const tools = document.createElement('div');
    tools.className = 'sec-tools';
    tools.innerHTML = `<span class="tool-btn del" data-act="del-sec">✕ 删除整题（大题）</span>`;
    secEl.insertBefore(tools, secEl.firstChild);
  });

  // 题目工具条 + 拖拽手柄 + 可编辑字段
  paper.querySelectorAll('.q').forEach((qEl, qi) => {
    const tools = document.createElement('div');
    tools.className = 'q-tools';
    tools.innerHTML = `<span class="tool-btn del" data-act="del-q">✕ 删</span>`;
    qEl.appendChild(tools);
    const stem = qEl.querySelector('[data-e="stem"]');
    if (stem) {
      const h = document.createElement('span');
      h.className = 'sort-handle';
      h.textContent = '⠿';
      stem.appendChild(h);
      qEl._dragHandle = h;
    }
    qEl.querySelectorAll('[data-e]').forEach(ed => {
      ed.contentEditable = 'true';
      ed.spellcheck = false;
    });
  });

  // 自由排版：题目可拖拽调整大小（非表格模式）+ 表格列宽/行高
  enableCellResize(paper);
  enableTableResize(paper);
  // 题目可自由拖动位置（非表格模式下）
  enableFreeMove(paper);

  // 初始化 Sortable：外层大题排序 + 内层题目排序（共享 group，可跨大题拖）
  if (typeof Sortable !== 'undefined') {
    sortables = [];
    new Sortable(paper.querySelector('.exam'), {
      animation: 150,
      handle: 'h2.sec',
      draggable: '.sec-block',
      ghostClass: 'sortable-ghost',
      onEnd: syncFromDOM
    });
    paper.querySelectorAll('.sec-block').forEach(secEl => {
      sortables.push(new Sortable(secEl, {
        group: 'questions',
        animation: 150,
        handle: '.sort-handle',
        draggable: '.q',
        ghostClass: 'sortable-ghost',
        onEnd: syncFromDOM
      }));
    });
  }
}

/* 自由排版：非表格模式下，题目可拖拽自由移动位置（绝对定位） */
function enableFreeMove(paper) {
  paper.querySelectorAll('.q-grid .q').forEach(qEl => {
    qEl.style.position = 'relative';
    qEl.style.cursor = 'grab';
    if (qEl.dataset._freeMove) return;
    qEl.dataset._freeMove = '1';
    let sx, sy, ox, oy, dragging = false;
    qEl.addEventListener('mousedown', (e) => {
      // 忽略拖拽手柄、删除按钮、可编辑文字、大小调整手柄
      if (e.target.closest('.sort-handle') || e.target.closest('.q-tools') || e.target.closest('.cell-resizer') || e.target.closest('[contenteditable="true"]')) return;
      e.preventDefault();
      dragging = true;
      sx = e.clientX; sy = e.clientY;
      ox = qEl.offsetLeft; oy = qEl.offsetTop;
      qEl.style.cursor = 'grabbing';
      const onMove = (ev) => {
        if (!dragging) return;
        // 相对定位偏移
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        qEl.style.left = (ox + dx) + 'px';
        qEl.style.top = (oy + dy) + 'px';
      };
      const onUp = () => {
        dragging = false;
        qEl.style.cursor = 'grab';
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });
}

/* 退出排版：回写数据，保留自由排版样式，只重算题号（不重渲染，避免格式丢失） */
function exitLayout(apply) {
  if (!layoutMode) return;
  if (apply) syncFromDOM();
  const paper = $('#paperStack .paper');
  // 移除排版模式的临时工具（保留自由排版的 left/top/width/height 内联样式）
  paper.querySelectorAll('.sec-tools, .q-tools, .sort-handle, .cell-resizer, .col-resizer, .row-resizer').forEach(el => el.remove());
  paper.querySelectorAll('[contenteditable="true"]').forEach(el => { el.removeAttribute('contenteditable'); el.classList.remove('can-edit'); });
  paper.querySelectorAll('.q[data-_free-move]').forEach(el => { delete el.dataset._freeMove; el.style.cursor = ''; });
  layoutMode = false;
  sortables.forEach(s => s.destroy());
  sortables = [];
  $('#paperStack').classList.remove('layouting');
  $('#btnLayout').style.display = '';
  $('#btnLayoutDone').style.display = 'none';
  $('.layout-tip').style.display = 'none';
  if (apply) {
    // 只重算题号与分值，不重渲染整个纸张（保留自由排版样式）
    renumberAll();
    refreshScoreLabels(paper);
  }
}

/* 轻量刷新：仅重新计算题号显示与分值标签，不动 DOM 布局 */
function refreshScoreLabels(paper) {
  paper.querySelectorAll('.sec-block').forEach(secEl => {
    const sid = secEl.dataset.sid;
    const sec = paperData.sections.find(s => s._sid === sid);
    if (!sec) return;
    const scoreBox = secEl.querySelector('.score-box');
    if (scoreBox) {
      const qs = sec.data.questions;
      const secScore = qs.reduce((s, q) => s + (q._score || 0), 0);
      scoreBox.textContent = `共 ${secScore} 分`;
    }
  });
}

/* DOM → 数据回写：顺序、编辑文本、删除 */
function syncFromDOM() {
  if (!paperData) return;
  const paper = $('#paperStack .paper');
  if (!paper) return;

  // 1) 读取顺序与编辑内容
  const secs = [];
  paper.querySelectorAll('.sec-block').forEach(secEl => {
    const sid = secEl.dataset.sid;
    const sec = paperData.sections.find(s => s._sid === sid);
    if (!sec) return;
    sec._used = true;
    const qs = [];
    // 题目可能嵌套在 .q-grid 或 table td 里，用后代选择器全部收集（按 DOM 顺序）
    secEl.querySelectorAll('.q').forEach(qEl => {
      const q = findQByQid(qEl);
      if (!q) return;
      if (layoutMode) writeBackQ(qEl, q);
      qs.push(q);
    });
    secs.push({ type: sec.type, _sid: sec._sid, _layout: sec._layout, data: { ...sec.data, questions: qs } });
  });
  paperData.sections.forEach(s => delete s._used);

  // 2) 删除的大题/题目不再出现在数据里（上面重建时已天然剔除）
  paperData.sections = secs;

  // 3) 全量重新编号 + 标记人工顺序
  renumberAll();
  paperData._manualOrder = true;
}

/* 由 DOM 的 data-qid 精确反查题目对象（跨大题移动/删题后依然稳定） */
function findQByQid(qEl) {
  const qid = qEl.dataset.qid;
  return qid ? paperData.allQs.find(x => x._qid === qid) : null;
}

/* 编辑内容回写到题目对象 */
function writeBackQ(qEl, q) {
  const stemEl = qEl.querySelector('[data-e="stem"]');
  if (stemEl) {
    let t = stemEl.textContent.replace(/\s*⠿\s*$/g, '').trim();
    const m = t.match(/^(\d+)\s*[.、]?\s*(.*)$/s);
    if (m) {
      q.stem = m[2].trim() || q.stem;
    } else {
      // 题号前缀被误删时兜底：剥掉手柄字符后整体作为题干，避免编辑静默丢失
      q.stem = t || q.stem;
    }
  }
  const optsEl = qEl.querySelector('[data-e="opts"]');
  if (optsEl && q.options) {
    const lines = Array.from(optsEl.querySelectorAll(':scope > div')).map(d => d.textContent.replace(/^[A-H][.、:：]\s*/, '').trim()).filter(Boolean);
    if (lines.length) q.options = lines;
  }
  const matchEl = qEl.querySelector('[data-e="match"]');
  if (matchEl && q.left_items) {
    matchEl.querySelectorAll('tr[data-i]').forEach(tr => {
      const i = parseInt(tr.dataset.i);
      const tds = tr.querySelectorAll('td');
      if (tds.length === 2 && i < q.left_items.length) {
        q.left_items[i] = tds[0].textContent.replace(/^（\d+）\s*/, '').trim();
        q.right_items[i] = tds[1].textContent.replace(/^（\d+）\s*/, '').trim();
        q.left_items[i] = q.left_items[i] || ' ';
        q.right_items[i] = q.right_items[i] || ' ';
      }
    });
  }
}

/* 重新编号 + 计分 + 更新汇总行（不改 DOM 布局） */
function renumberAll() {
  let no = 0;
  paperData.sections.forEach(sec => {
    sec.data.questions.forEach(q => { no++; q._no = no; });
  });
  paperData.allQs = paperData.sections.flatMap(s => s.data.questions);

  // 分值：客观题每题 2 分，其余平摊剩余，总和 100
  const isObj = q => !!q.options;
  const objQs = paperData.allQs.filter(isObj);
  const subQs = paperData.allQs.filter(q => !isObj(q));
  const score = new Map();
  if (subQs.length) {
    objQs.forEach(q => score.set(q, 2));
    let remain = Math.max(100 - objQs.length * 2, subQs.length);
    const base = Math.floor(remain / subQs.length);
    let extra = remain - base * subQs.length;
    subQs.forEach(q => score.set(q, base + (extra-- > 0 ? 1 : 0)));
  } else {
    const base = Math.floor(100 / paperData.allQs.length);
    let extra = 100 - base * paperData.allQs.length;
    paperData.allQs.forEach(q => score.set(q, base + (extra-- > 0 ? 1 : 0)));
  }
  paperData.allQs.forEach(q => q._score = score.get(q));

  $('#sumLine').textContent = `📋 ${paperData.grade} ${paperData.subject} ｜ ${paperData.keyword} ｜ 共 ${no} 题（${paperData.sections.map(s => `${TYPE_NAME[s.type]}×${s.data.questions.length}`).join(' + ')}）｜ 满分 100 分`;
}

/* 删除按钮（事件委托） */
document.addEventListener('click', e => {
  const btn = e.target.closest('.tool-btn[data-act]');
  if (!btn || !layoutMode) return;
  const act = btn.dataset.act;
  if (act === 'del-q') {

      btn.closest('.sec-block').remove();
      syncFromDOM();
    }
  }
});

/* 构建参考答案页 HTML */
function buildAnswerPage() {
  if (!paperData || !paperData.sections) return '';
  let html = `<div class="exam"><h1 style="font-size:16pt;">参考答案与解析</h1>`;
  paperData.sections.forEach(sec => {
    const qs = sec.data?.questions || [];
    if (!qs.length) return;
    html += `<h2 class="sec">${TYPE_NAME[sec.type] || sec.type}</h2>`;
    qs.forEach((q, qi) => {
      html += `<div style="margin-bottom:3mm"><b>${cirNum(qi + 1)}</b> `;
      let a = '';
      if (q.top != null) {
        const t = isBlankVal(q.top) ? q.answer : q.top;
        const l = isBlankVal(q.left) ? q.answer : q.left;
        const r = isBlankVal(q.right) ? q.answer : q.right;
        a = `${t} 分成 ${l} 和 ${r}`;
      } else if (q.left_expr != null) {
        a = `${q.left_expr} ○ ${q.right_expr} → ${q.answer}`;
      } else if (q.left_items) {
        a = (q.answer || []).map(p => `（${p[0] + 1}）→（${p[1] + 1}）`).join('；');
      } else if (q.options) {
        a = ansText(q);
        if (typeof q.answer === 'number') a += `（${stripOptPrefix(q.options[q.answer] || '')}）`;
      } else {
        a = String(q.answer ?? '');
      }
      if (a) {
        html += `答案：${esc(a)}`;
      } else {
        html += `<span style="color:#999">（暂无答案）</span>`;
      }
      if (q.analysis) {
        html += `<br><span style="color:#666;font-size:9pt">解析：${esc(q.analysis)}</span>`;
      }
      html += `</div>`;
    });
  });
  html += `</div>`;
  return html;
}

/* 共用：离屏渲染试卷 → 按A4比例切成页画布数组 */
async function buildPageCanvases(withAnswers) {
  if (typeof html2canvas === 'undefined') throw new Error('组件加载失败，请检查网络后刷新重试');
  clearBlanks();

  // 从「当前最终试卷」（含排版模式的所有自由调整）取内容
  const srcStack = $('#paperStack') || $('#finalPaperStack');
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-99999px;top:0;background:#fff;z-index:-1;';
  const clone = srcStack.cloneNode(true);
  clone.style.display = 'block';
  // 清理排版模式的临时工具、分页符、内联预览答案，避免带入导出
  clone.querySelectorAll('.paper-breaker, .sec-tools, .q-tools, .sort-handle, .cell-resizer, .col-resizer, .row-resizer, .layout-tip, .q-ans-inline').forEach(b => b.remove());
  clone.querySelectorAll('.q[data-_free-move]').forEach(el => { el.style.cursor = ''; });
  clone.querySelectorAll('[contenteditable="true"]').forEach(el => el.removeAttribute('contenteditable'));
  clone.querySelectorAll('.paper').forEach(p => {
    p.style.display = 'block';
    p.style.visibility = 'visible';
  });
  // 先挂载到文档流（分页测量需要在文档里进行）
  holder.appendChild(clone);
  document.body.appendChild(holder);

  // 学生卷：只保留第一页；含答案版：追加答案页；仅答案版：只留答案页
  if (!withAnswers) {
    const papers = clone.querySelectorAll('.paper');
    papers.forEach((p, i) => { if (i > 0) p.remove(); });
  } else {
    // 答案页 = 复制学生卷排版，去掉题干只留题号+答案
    const srcPapers = clone.querySelectorAll('.paper');
    if (srcPapers.length) {
      const ansClone = clone.cloneNode(true);
      // 合并所有页到第一张纸
      const ansPapers = Array.from(ansClone.querySelectorAll('.paper'));
      if (ansPapers.length > 1) {
        const firstExam = ansPapers[0].querySelector('.exam');
        for (let i = 1; i < ansPapers.length; i++) {
          ansPapers[i].querySelectorAll('.sec-block, .footer-note').forEach(el => firstExam.appendChild(el));
        }
        ansPapers.slice(1).forEach(p => p.remove());
      }
      const firstPaper = ansClone.querySelector('.paper');
      firstPaper.style.height = 'auto';
      firstPaper.style.overflow = 'visible';
      // 换标题
      ansClone.querySelector('.exam h1')?.remove();
      const ansH1 = document.createElement('h1');
      ansH1.style.cssText = 'text-align:center;font-size:16pt;font-family:"SimHei","Microsoft YaHei",sans-serif;letter-spacing:2px;margin-bottom:4mm;';
      ansH1.textContent = '参考答案与解析';
      ansClone.querySelector('.exam').insertBefore(ansH1, ansClone.querySelector('.exam').firstChild);
      // 逐题替换：题干→答案文字（保留题号、布局、题型块结构）
      const typeSeen = {};
      const typeQOff = {};
      ansClone.querySelectorAll('.sec-block').forEach(block => {
        const type = block.dataset.type;
        const sid = block.dataset.sid;
        // 定位 section（sid 优先，type 出现序号兜底）
        let secIdx = -1;
        if (sid) secIdx = (paperData.sections || []).findIndex(s => String(s._sid) === String(sid));
        if (secIdx < 0) {
          const seen = typeSeen[type] || 0;
          let cnt = -1;
          (paperData.sections || []).forEach((s, i) => { if (s.type === type) { cnt++; if (cnt === seen) secIdx = i; } });
          typeSeen[type] = (typeSeen[type] || 0) + 1;
        }
        const sec = secIdx >= 0 ? paperData.sections[secIdx] : null;
        const offKey = secIdx >= 0 ? `i${secIdx}` : type;
        block.querySelectorAll('.q').forEach(qEl => {
          const off = (typeQOff[offKey] || 0);
          typeQOff[offKey] = off + 1;
          const q = sec?.data?.questions?.[off];
          // 生成答案文字
          let a = '';
          let analysis = '';
          if (!q) { a = '（暂无答案）'; }
          else {
            analysis = q.analysis || '';
            if (q.top != null) {
              const t = isBlankVal(q.top) ? q.answer : q.top;
              const l = isBlankVal(q.left) ? q.answer : q.left;
              const r = isBlankVal(q.right) ? q.answer : q.right;
              a = `${t} 分成 ${l} 和 ${r}`;
            } else if (q.left_expr != null) {
              a = `${q.left_expr} ○ ${q.right_expr} → ${q.answer}`;
            } else if (q.left_items) {
              a = (q.answer || []).map(p => `（${p[0]+1}）→（${p[1]+1}）`).join('；');
            } else if (q.options) {
              a = ansText(q) + (typeof q.answer === 'number' ? `（${stripOptPrefix(q.options[q.answer] || '')}）` : '');
            } else {
              a = String(q.answer ?? '（暂无答案）');
            }
          }
          // 保留题号（开头的圈号），替换正文为答案
          const txt = qEl.textContent || '';
          const m = txt.match(/^[①-⑳]/);
          const noTag = m ? m[0] + ' ' : '';
          qEl.innerHTML = `<span style="color:#c0392b"><b>${noTag}答案：</b>${esc(a)}</span>` +
            (analysis ? `<br><span style="color:#666;font-size:9pt">解析：${esc(analysis)}</span>` : '');
        });
      });
      firstPaper.style.height = '297mm';
      firstPaper.style.overflow = 'hidden';
      clone.appendChild(ansClone);
      try { paginateA4(ansClone); } catch (e) { console.warn('答案页分页失败', e); }
      // 仅答案模式：移除学生卷的纸，只留答案页
      if (withAnswers === 'answersOnly') {
        // 学生卷的纸在 clone 的直属 paper 里（ansClone 是后来 append 的容器）
        Array.from(clone.children).forEach(child => {
          if (child !== ansClone) child.remove();
        });
      }
    }
  }

  const pages = [];
  try {
    for (const paper of clone.querySelectorAll('.paper')) {
      // 高分辨率渲染（约 288 DPI）
      const canvas = await html2canvas(paper, { scale: 3, backgroundColor: '#ffffff' });
      const W = canvas.width;
      const pageH = Math.round(W * 297 / 210);   // A4 比例页高

      // 收集块级元素的分界位置（避免把题目从中间切开）
      const scale = W / paper.offsetWidth;
      const breaks = [];
      paper.querySelectorAll('.exam > *').forEach(el => {
        breaks.push(Math.round(el.offsetTop * scale) + Math.round(el.offsetHeight * scale));
      });
      breaks.sort((a, b) => a - b);

      // 逐页切片
      let y = 0;
      while (y < canvas.height - 2) {
        let cut = y + pageH;
        if (cut < canvas.height) {
          // 优先在元素边界处断页
          const ok = breaks.filter(b => b > y + pageH * 0.55 && b <= cut);
          if (ok.length) cut = ok[ok.length - 1];
        } else { cut = canvas.height; }
        const h = cut - y;

        const page = document.createElement('canvas');
        page.width = W; page.height = pageH;
        const ctx = page.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, W, pageH);
        ctx.drawImage(canvas, 0, y, W, h, 0, 0, W, h);
        pages.push(page);
        y = cut;
      }
    }
  } finally {
    document.body.removeChild(holder);
  }
  return pages;
}

async function exportPDF(withAnswers, btn) {
  if (!paperData) return;
  if (layoutMode) exitLayout(true);
  const mode = withAnswers === 'answersOnly' ? 'answersOnly' : !!withAnswers;
  await withExportState(btn, async () => {
    if (typeof window.jspdf === 'undefined') throw new Error('PDF 组件加载失败，请检查网络后刷新重试');
    const pages = await buildPageCanvases(mode);
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
    pages.forEach((pc, i) => {
      if (i) doc.addPage();
      doc.addImage(pc.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297);
    });
    // 页码：仅显示页数，无其他页眉页脚
    const total = pages.length;
    doc.setFont('times', 'normal');
    doc.setFontSize(9);
    for (let i = 1; i <= total; i++) {
      doc.setPage(i);
      const t = `- ${i} / ${total} -`;
      doc.text(t, 105, 292.5, { align: 'center' });
    }
    const title = paperData.title || (paperData.grade + paperData.subject + '测试卷');
    const suffix = mode === 'answersOnly' ? '（答案）' : (mode ? '（含答案）' : '');
    doc.save(`${title}${suffix}.pdf`);
  });
}

/* ── 批量导出：所有份数打包 ZIP（每份学生卷+仅答案）+ 全部合并 PDF；mergeOnly=true 时只下载合并 PDF ── */
async function exportBatch(btn, mergeOnly = false) {
  if (!mergeOnly && typeof window.JSZip === 'undefined') throw new Error('JSZip 组件加载失败，请检查网络后刷新重试');
  if (typeof window.jspdf === 'undefined') throw new Error('PDF 组件加载失败，请检查网络后刷新重试');
  if (layoutMode) exitLayout(true);

  const wasShown = showAnswers;
  const old = btn.textContent;
  btn.disabled = true;
  const totalN = batchPapers.length + 1;
  const baseTitleRaw = paperData.title || (paperData.grade + paperData.subject + '测试卷');
  const baseTitle = baseTitleRaw; // ZIP/文件名用（不带天数）

  // 备份当前状态（第 1 份）
  const firstSections = paperData.sections.map(s => ({ type: s.type, data: s.data, _layout: s._layout }));
  const firstTitle = paperData.title;

  // 模板：livePaperStack 的完整 DOM（含用户所有格式编辑：字体/颜色/加粗）
  const liveStack = $('#livePaperStack');
  const templateHTML = liveStack?.innerHTML || $('#paperStack').innerHTML;
  if (!templateHTML) throw new Error('预览区没有试卷内容，请先生成');

  const zip = new JSZip();
  const mergePages = []; // 全部合并 PDF 的页

  // 构建某一份的可导出 DOM：模板克隆 + 替换该份的题目数据 + 改标题
  const buildPaperFor = (k, sections) => {
    const holder = document.createElement('div');
    holder.innerHTML = templateHTML;
    // 替换题目内容（保留格式标签）
    const fakeSecs = sections.map(s => ({ type: s.type, data: s.data, el: { _layout: s._layout } }));
    patchLivePreviewInStack(holder, fakeSecs);
    // 改标题（h1）：只在最后一个文本节点末尾追加（第X天），不碰任何格式标签
    if (batchAddDay) {
      const h1 = holder.querySelector('.exam h1');
      if (h1) {
        const daySuffix = `（第${k + 1}天）`;
        // 找 h1 里最后一个非空文本节点
        let lastText = null;
        h1.childNodes.forEach(node => {
          if (node.nodeType === Node.TEXT_NODE && node.textContent.trim()) lastText = node;
        });
        // 没有直接文本节点时，深入最后一层元素找
        if (!lastText) {
          const walker = document.createTreeWalker(h1, NodeFilter.SHOW_TEXT, null);
          let n;
          while ((n = walker.nextNode())) { if (n.textContent.trim()) lastText = n; }
        }
        if (lastText) {
          // 去掉之前可能加过的（第X天）再追加新的（幂等）
          lastText.textContent = lastText.textContent.replace(/（第\d+天）\s*$/, '') + daySuffix;
        } else {
          h1.insertBefore(document.createTextNode(daySuffix), null);
        }
      }
    }
    return holder;
  };

  try {
    for (let k = 0; k < totalN; k++) {
      btn.textContent = `📦 正在处理第 ${k + 1}/${totalN} 份…`;
      // 该份的 sections：第 1 份用当前数据，其余用 batchPapers
      let sections;
      if (k === 0) {
        sections = firstSections;
      } else {
        const bp = batchPapers[k - 1];
        sections = (bp.sections || []).map((sec, si) => ({
          type: sec.game_type,
          data: { questions: sec.questions || [] },
          _layout: bp.layouts?.[si] || {qCols:1, optCols:2, tableBorder:'none', showNo:true}
        }));
      }
      // 基于模板（含格式）构建该份 DOM，替换 paperStack 用于导出
      const paperHolder = buildPaperFor(k, sections);
      const savedStackHTML = $('#paperStack').innerHTML;
      const psEl = $('#paperStack');
      // 挂到文档流（html2canvas 需要）
      psEl.innerHTML = paperHolder.innerHTML;
      // 学生卷 PDF
      const stuPages = await buildPageCanvases(false);
      stuPages.forEach(p => mergePages.push(p));
      if (!mergeOnly) {
        const stuDoc = pagesToPDF(stuPages);
        zip.file(`${baseTitle}-第${k + 1}份-学生卷.pdf`, stuDoc.output('arraybuffer'));
        // 仅答案 PDF
        const ansPages = await buildPageCanvases('answersOnly');
        const ansDoc = pagesToPDF(ansPages);
        zip.file(`${baseTitle}-第${k + 1}份-答案.pdf`, ansDoc.output('arraybuffer'));
      }
      void savedStackHTML;
    }
    // 全部合并 PDF（学生卷连续排）
    btn.textContent = '📦 正在合并全部 PDF…';
    const mergeDoc = pagesToPDF(mergePages);
    if (mergeOnly) {
      // 直接下载合并 PDF（不打包）
      mergeDoc.save(`${baseTitle}-全部${totalN}份合并.pdf`);
    } else {
      zip.file(`${baseTitle}-全部${totalN}份合并.pdf`, mergeDoc.output('arraybuffer'));
      // 生成 ZIP
      btn.textContent = '📦 正在打包…';
      const blob = await zip.generateAsync({ type: 'blob' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${baseTitle}-${totalN}份.zip`;
      a.click();
      URL.revokeObjectURL(a.href);
    }
  } finally {
    // 恢复第 1 份的显示（paperStack 用 livePaperStack 的最新内容）
    paperData.sections = firstSections;
    paperData.title = firstTitle;
    const lv = $('#livePaperStack');
    if (lv && lv.querySelector('.paper')) $('#paperStack').innerHTML = lv.innerHTML;
    btn.disabled = false;
    btn.textContent = old;
    if (wasShown) fillBlanks(); else clearBlanks();
  }
}

/* canvas 页数组 → jsPDF 文档（带页码） */
function pagesToPDF(pages) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
  pages.forEach((pc, i) => {
    if (i) doc.addPage();
    doc.addImage(pc.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297);
  });
  const total = pages.length;
  doc.setFont('times', 'normal');
  doc.setFontSize(9);
  for (let i = 1; i <= total; i++) {
    doc.setPage(i);
    doc.text(`- ${i} / ${total} -`, 105, 292.5, { align: 'center' });
  }
  return doc;
}

        }
        const sr = $('#subjectRow');
        if (sr) sr.querySelectorAll('.subject-pill').forEach(p => p.classList.toggle('on', p.dataset.v === tpl.subject));
      }
      // 3. 关键词
      if (tpl.keyword) $('#keyword').value = tpl.keyword;
      renderTypeGroups();
    } catch (err) { console.warn('模板条件恢复失败:', err); }
    // 清空搭建区，按模板重建卡片
    const secList = $('#secList');
    secList.querySelectorAll('.sec-card').forEach(c => c.remove());
    builderSeq = 0;
    (tpl.cards || []).forEach(c => addSecToBuilder(c.type, c.count));
    if (!secList.querySelector('.sec-card')) {
      // 旧模板没有 cards，尝试直接从 paperSnapshot 恢复
      if (tpl.paperSnapshot) {
        const liveStack = $('#livePaperStack');
        if (liveStack) {
          liveStack.innerHTML = tpl.paperSnapshot;
          paginateA4(liveStack);
          makePaperEditable(liveStack);
          $('#livePreview').style.display = '';
        }
        $('#myTplWrap').classList.remove('open');
        return;
      }
      alert('模板为空，请重新创建');
      return;
    }
    // 恢复排版
    setTimeout(() => {
      const cards = secList.querySelectorAll('.sec-card');
      (tpl.cards || []).forEach((sc, idx) => {
        if (cards[idx] && sc._layout) {
          cards[idx]._layout = Object.assign(cardLayout(cards[idx]), sc._layout);
          renderSecBody(cards[idx]);
        }
      });
      updateBuilderSummary();
      // 恢复预览区 A4 纸格式（含所有字体/颜色/字号编辑效果）
      if (tpl.paperSnapshot) {
        const liveStack = $('#livePaperStack');
        if (liveStack) {
          liveStack.innerHTML = tpl.paperSnapshot;
          $('#livePreview').style.display = '';
          // 重新激活编辑控制（加粗/字号/颜色/删除等）
          makePaperEditable(liveStack);
          paginateA4(liveStack);
          // 卡片与快照里的 sec-block 按 sid 一一对应（增量删除依赖此对应关系）
          const snapBlocks = liveStack.querySelectorAll('.sec-block');
          cards.forEach((card, idx) => {
            if (snapBlocks[idx]) card._sid = snapBlocks[idx].dataset.sid;
          });
        }
      } else {
        refreshLivePreview();
      }
    }, 50);
    $('#myTplWrap').classList.remove('open');
    return;
  }
});
// 全局关闭：点击 #myTplWrap 外部时收起下拉
document.addEventListener('click', e => {
  if (!e.target.closest('#myTplWrap')) {
    $('#myTplWrap').classList.remove('open');
  }
});

initBuilder();
</script>
</body>
</html>
