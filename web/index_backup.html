<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出题工作台 · Learning Coach</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Serif+SC:wght@400;600;900&display=swap');

  :root {
    --paper: #fdf6e3;
    --ink: #2b2b2b;
    --red: #d0342c;
    --blue: #1d4e89;
    --blue-soft: #3a6ea5;
    --pencil: #6b6456;
    --card: #fffdf7;
    --shadow: 0 2px 0 rgba(43,43,43,.14), 0 10px 28px rgba(43,43,43,.10);
    --font-title: 'ZCOOL KuaiLe', 'Microsoft YaHei', sans-serif;
    --font-body: 'Noto Serif SC', 'SimSun', serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-body);
    color: var(--ink);
    background-color: #8ea69c;
    background-image:
      repeating-linear-gradient(0deg, transparent 0 28px, rgba(255,255,255,.16) 28px 29px),
      repeating-linear-gradient(90deg, transparent 0 28px, rgba(255,255,255,.16) 28px 29px);
    min-height: 100vh;
    padding: 34px 18px 60px;
  }

  .wrap { max-width: 1400px; margin: 0 auto; }
  /* 双栏：左=出题条件，右=卷面搭建 */
  .workbench {
    display: grid;
    grid-template-columns: minmax(430px, 5fr) minmax(480px, 6fr);
    gap: 26px;
    align-items: start;
  }
  @media (max-width: 1080px) {
    .workbench { grid-template-columns: 1fr; }
  }

  /* ───── 顶部 ───── */
  .masthead { text-align: center; margin-bottom: 26px; position: relative; }
  .masthead h1 {
    font-family: var(--font-title);
    font-size: 40px;
    color: var(--card);
    letter-spacing: 6px;
    text-shadow: 3px 3px 0 rgba(0,0,0,.22);
    display: inline-block;
  }
  .masthead h1 em { font-style: normal; color: #ffd94a; }
  .masthead .sub {
    display: inline-block;
    background: var(--card);
    border: 2px solid var(--ink);
    padding: 3px 14px;
    font-size: 13px;
    border-radius: 999px;
    transform: rotate(-2deg) translateY(-14px);
    box-shadow: 2px 2px 0 rgba(0,0,0,.18);
  }

  /* ───── 表单卡片 ───── */
  .sheet {
    background: var(--card);
    border: 2px solid var(--ink);
    border-radius: 6px;
    box-shadow: var(--shadow);
    padding: 30px 34px 26px;
    position: relative;
    overflow: hidden;
  }
  .sheet::before {
    content: '';
    position: absolute;
    left: 46px; top: 0; bottom: 0;
    border-left: 2px solid rgba(208,53,44,.28);
  }
  .sheet::after {
    content: '';
    position: absolute;
    left: 26px; top: 16px;
    width: 13px; height: 13px;
    border-radius: 50%;
    background: repeating-linear-gradient(45deg, #fff, #fff 0 3px, #e8e0cc 3px 4px);
    box-shadow: 0 0 0 1.5px #fff, 0 1px 3px rgba(0,0,0,.25);
  }
  .tape {
    position: absolute;
    top: -12px; left: 50%;
    width: 120px; height: 26px;
    background: rgba(255,222,120,.75);
    transform: translateX(-50%) rotate(-2deg);
    box-shadow: 0 1px 3px rgba(0,0,0,.18);
  }

  .sheet h2 {
    font-family: var(--font-title);
    font-size: 21px;
    margin: 0 0 20px 26px;
    display: flex; align-items: center; gap: 10px;
  }
  .sheet h2::after { content: ''; flex: 1; border-top: 2px dashed rgba(43,43,43,.25); }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px 22px;
    margin-left: 26px;
  }
  .field label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--pencil);
  }
  .field label b { color: var(--red); margin-right: 2px; }
  select, input[type=text] {
    width: 100%;
    font-family: var(--font-body);
    font-size: 15px;
    padding: 9px 12px;
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 5px;
    outline: none;
    transition: box-shadow .15s, transform .15s;
  }
  select { cursor: pointer; }
  input[type=text] { cursor: text; }
  select:focus, input[type=text]:focus {
    box-shadow: 3px 3px 0 rgba(29,78,137,.35);
    transform: translate(-1px, -1px);
  }

  /* 题型：分类分组 + 药丸按钮 */
  .type-groups { display: flex; flex-direction: column; gap: 12px; }
  .type-group {
    border: 2px dashed rgba(43,43,43,.25);
    border-radius: 10px;
    padding: 8px 10px 10px;
    background: rgba(255,255,255,.45);
  }
  .tg-head {
    font-family: var(--font-title);
    font-size: 13px;
    color: var(--blue);
    letter-spacing: 1px;
    margin-bottom: 7px;
  }
  .tg-body { display: flex; flex-wrap: wrap; gap: 8px; }
  .type-pill {
    display: inline-flex; align-items: center; gap: 5px;
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 6px 14px;
    background: #fff;
    font-family: var(--font-title);
    font-size: 14px;
    color: var(--ink);
    cursor: pointer;
    transition: all .12s;
    box-shadow: 2px 2px 0 rgba(43,43,43,.25);
    user-select: none;
  }
  .type-pill:hover {
    transform: translateY(-2px);
    border-color: var(--blue);
    color: var(--blue);
    box-shadow: 2px 4px 0 rgba(29,78,137,.3);
  }
  .type-pill:active { transform: none; }
  .type-pill.flash { animation: pillFlash .5s ease; }
  @keyframes pillFlash {
    0% { background: var(--blue); color: #fff; }
    100% { background: #fff; color: var(--ink); }
  }

  /* 难度 */
  .diff-row { display: flex; gap: 8px; }
  .diff {
    flex: 1;
    text-align: center;
    padding: 8px 4px;
    border: 2px solid var(--ink);
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    font-size: 14px;
    transition: all .12s;
  }
  .diff small { display: block; font-size: 11px; color: var(--pencil); margin-top: 2px; }
  .diff.on-1 { background: #3e8e5a; color: #fff; }
  .diff.on-2 { background: #d98218; color: #fff; }
  .diff.on-3 { background: var(--red); color: #fff; }
  .diff.on-1 small, .diff.on-2 small, .diff.on-3 small { color: rgba(255,255,255,.85); }

  /* 知识点提示 */
  .scope-hint {
    grid-column: 1 / -1;
    background: rgba(58,110,165,.08);
    border: 1.5px dashed var(--blue-soft);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 13px;
    line-height: 1.8;
    color: var(--blue);
    display: none;
  }
  .scope-hint b { font-weight: 600; }
  .scope-hint .tag {
    display: inline-block;
    background: #fff;
    border: 1px solid var(--blue-soft);
    border-radius: 4px;
    padding: 0 8px;
    margin: 2px 3px 0 0;
    font-size: 12.5px;
    cursor: pointer;
    transition: all .12s;
  }
  .scope-hint .tag:hover { background: var(--blue); color: #fff; }
  .scope-hint .tag.on { background: var(--blue); color: #fff; border-color: var(--blue); }

  /* 操作按钮 */
  .actions {
    margin: 24px 0 0 26px;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }
  .btn-go {
    font-family: var(--font-title);
    font-size: 21px;
    letter-spacing: 3px;
    color: #fff;
    background: var(--red);
    border: 2px solid var(--ink);
    border-radius: 8px;
    padding: 11px 42px;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
    transition: all .12s;
  }
  .btn-go:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--ink); }
  .btn-go:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
  .btn-go:disabled { background: #9c9c9c; cursor: not-allowed; }
  .btn-go.regen {
    font-size: 16px;
    letter-spacing: 1px;
    padding: 11px 24px;
    background: var(--blue);
  }
  .hint-wait { font-size: 13px; color: var(--pencil); }

  .loading-bar {
    margin: 18px 0 0 26px;
    height: 10px;
    border: 2px solid var(--ink);
    border-radius: 999px;
    background: #fff;
    overflow: hidden;
    display: none;
  }
  .loading-bar i {
    display: block;
    height: 100%;
    width: 34%;
    background: repeating-linear-gradient(45deg, var(--red), var(--red) 8px, #e88880 8px, #e88880 16px);
    animation: run 1.1s linear infinite;
  }
  @keyframes run { from { margin-left: -36%; } to { margin-left: 100%; } }

  .err-box {
    display: none;
    margin: 16px 0 0 26px;
    border: 2px solid var(--red);
    background: #fdeceb;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 14px;
    color: var(--red);
  }

  /* ───── 卷面搭建区（点题型→右侧出骨架块） ───── */
  .builder-panel {
    background: var(--card);
    border: 2px solid var(--ink);
    border-radius: 6px;
    box-shadow: var(--shadow);
    padding: 22px 24px 24px;
    position: relative;
    overflow: hidden;
    min-height: 420px;
  }
  .builder-panel::before {
    content: '';
    position: absolute;
    left: 46px; top: 0; bottom: 0;
    border-left: 2px solid rgba(208,53,44,.28);
  }
  .builder-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .builder-head h2 {
    font-family: var(--font-title);
    font-size: 22px;
    margin: 0;
    display: flex; align-items: center; gap: 12px;
    width: 100%;
  }
  .builder-head h2::after { content: ''; flex: 1; border-top: 2px dashed rgba(43,43,43,.25); }
  .builder-head .b-count {
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 999px;
    font-size: 13px;
    font-family: var(--font-body);
    padding: 1px 10px;
    color: var(--pencil);
  }
  .builder-tip {
    font-size: 12.5px;
    color: var(--pencil);
    margin: 0 0 14px;
    line-height: 1.7;
  }
  .sec-list { display: flex; flex-direction: column; gap: 12px; min-height: 120px; }
  .sec-card {
    display: flex; flex-direction: column;
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 8px;
    box-shadow: 2px 2px 0 rgba(43,43,43,.28);
    transition: box-shadow .12s, transform .12s;
    overflow: hidden;
  }
  .sec-card:hover { transform: translateY(-1px); box-shadow: 2px 4px 0 rgba(43,43,43,.3); }
  .sec-card.loading { border-style: dashed; }
  .sec-card .s-head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: #f6f4ee;
    border-bottom: 2px solid rgba(43,43,43,.15);
    flex: none;
  }
  .sec-card .drag-handle {
    cursor: grab; color: var(--pencil); font-size: 17px; letter-spacing: 1px;
    user-select: none; padding: 2px; flex: none;
  }
  .sec-card .drag-handle:active { cursor: grabbing; }
  .sec-card .s-idx {
    flex: none;
    width: 28px; height: 28px;
    border: 2px solid var(--ink);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-title);
    font-size: 14px;
    background: #fff;
  }
  .sec-card .s-name { font-family: var(--font-title); font-size: 17px; flex: 1; }
  .sec-card .s-cnt { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--pencil); }
  .sec-card .s-cnt input {
    width: 44px; padding: 3px 5px;
    font-family: var(--font-body); font-size: 14px;
    border: 2px solid var(--ink); border-radius: 5px;
    text-align: center; background: #fff;
  }
  .sec-card .s-cnt .minus, .sec-card .s-cnt .plus {
    width: 24px; height: 24px;
    border: 2px solid var(--ink); border-radius: 5px;
    background: #fff; cursor: pointer;
    font-size: 14px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    user-select: none; color: var(--ink);
  }
  .sec-card .s-cnt .minus:hover, .sec-card .s-cnt .plus:hover { background: #eaf3fd; border-color: var(--blue); color: var(--blue); }
  .sec-card .s-btns { display: flex; gap: 8px; flex: none; }
  .sec-card .s-renew {
    border: 2px solid var(--ink); border-radius: 6px;
    background: #fff; color: var(--ink);
    padding: 3px 10px; font-size: 12.5px; cursor: pointer;
    font-family: var(--font-body); transition: all .12s;
  }
  .sec-card .s-renew:hover { background: var(--blue); border-color: var(--blue); color: #fff; }
  .sec-card .s-del {
    flex: none;
    border: 2px solid var(--red);
    color: var(--red);
    background: #fff;
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 12.5px;
    cursor: pointer;
    transition: all .12s;
  }
  .sec-card .s-del:hover { background: var(--red); color: #fff; }
  .sec-card .s-body { padding: 12px 16px 14px 18px; }
  .sec-card .s-body:empty { display: none; }
  .s-loading {
    display: flex; align-items: center; gap: 10px;
    color: var(--pencil); font-size: 13.5px; padding: 14px 0;
  }
  .spin {
    width: 16px; height: 16px; flex: none;
    border: 3px solid rgba(43,43,43,.2); border-top-color: var(--blue);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .s-error {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    color: var(--red); font-size: 13.5px; padding: 12px 0;
  }
  .s-error .s-retry {
    border: 2px solid var(--red); color: var(--red); background: #fff;
    border-radius: 6px; padding: 3px 12px; font-size: 13px; cursor: pointer;
  }
  .s-error .s-retry:hover { background: var(--red); color: #fff; }
  .s-passage {
    font-size: 13.5px; line-height: 1.9; color: var(--ink);
    background: #f9f7f2; border-left: 3px solid rgba(29,78,137,.4);
    padding: 10px 14px; margin-bottom: 12px; border-radius: 0 6px 6px 0;
  }
  .s-q { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 0; padding: 5px 0; }
  .s-q .s-q-no { flex: none; font-weight: 600; margin-right: 4px; font-family: var(--font-title); }
  .s-q .s-q-stem { flex: 1; min-width: 0; font-size: 14px; line-height: 1.7; outline: none; }
  .s-q .s-q-stem:focus, .s-opts > div:focus, .s-match td:focus, .s-passage:focus { background: #fff8e1; box-shadow: 0 0 0 2px rgba(240,177,66,.5); border-radius: 3px; }
  .s-opts { flex: 1 1 100%; padding-left: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 16px; }
  .s-opts > div { font-size: 13.5px; line-height: 1.8; outline: none; }
  .s-match { flex: 1 1 100%; padding-left: 22px; }
  .s-match table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .s-match th, .s-match td { border: 1px solid rgba(43,43,43,.35); padding: 5px 10px; text-align: left; outline: none; }
  .s-match th { background: #f6f4ee; font-family: var(--font-title); }
  .s-ans-line { flex: 1 1 100%; padding-left: 22px; color: var(--pencil); font-size: 13px; letter-spacing: 1px; }
  .s-loading-txt { color: var(--blue); }
  .s-err-txt { color: var(--red); }
  .s-ok-txt { color: #2e7d32; }
  .sec-card.sortable-ghost { opacity: .35; background: #ede9fe; }
  .sec-card.sortable-chosen { cursor: grabbing; }
  .sec-list:not(.empty)::after {
    content: '✛ 继续点击左侧题型卡片，把更多大题加进来';
    display: block;
    text-align: center;
    font-size: 12.5px;
    color: var(--pencil);
    padding: 10px 0 2px;
    letter-spacing: 1px;
  }
  .sec-list:has(.sec-card)::after { display: block; }
  .sec-list:not(:has(.sec-card))::after { content: ''; display: none; }
  .sec-list:not(:has(.sec-card)) { border: 2px dashed rgba(43,43,43,.3); border-radius: 8px; padding: 40px 16px; }
  .sec-list:not(:has(.sec-card)) .empty-hint {
    display: block; text-align: center; color: var(--pencil); font-size: 13.5px; line-height: 2;
  }
  .empty-hint { display: none; }
  .builder-empty {
    display: block;
    text-align: center;
    color: var(--pencil);
    font-size: 13.5px;
    line-height: 2.1;
    padding: 36px 10px;
  }
  .builder-empty b { font-size: 15px; display: block; margin-bottom: 4px; font-family: var(--font-title); color: var(--ink); }
  .builder-actions { margin-top: 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .builder-summary {
    flex: 1; text-align: right; font-size: 13px; color: var(--pencil); line-height: 1.6;
  }
  .builder-summary b { color: var(--ink); font-size: 15px; font-family: var(--font-title); }
  .builder-panel.need-attn { animation: attn 0.9s ease-in-out 2; }
  @keyframes attn {
    0%, 100% { box-shadow: var(--shadow); }
    50% { box-shadow: 0 0 0 6px rgba(208,53,44,.25), 4px 4px 0 rgba(43,43,43,.3); }
  }

  /* ───── 预览区（工作台风格，非打印风格） ───── */
  .result-area { display: none; margin-top: 30px; animation: drop .45s cubic-bezier(.2,1.4,.4,1); }
  @keyframes drop { from { opacity: 0; transform: translateY(-18px); } to { opacity: 1; transform: none; } }
  .preview-bar {
    background: var(--card);
    border: 2px solid var(--ink);
    border-radius: 6px;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
  }
  .preview-bar .sum { font-size: 14px; color: var(--pencil); flex: 1; min-width: 200px; }
  .btn-mini {
    font-family: var(--font-body);
    font-size: 13.5px;
    border: 2px solid var(--ink);
    background: #fff;
    border-radius: 6px;
    padding: 6px 14px;
    cursor: pointer;
    box-shadow: 2px 2px 0 rgba(43,43,43,.35);
    transition: all .12s;
  }
  .btn-mini:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 rgba(43,43,43,.35); }
  .btn-mini.warn { background: var(--red); color: #fff; }

  /* ───── 试卷纸（打印即所见） ───── */
  .paper-stack { position: relative; }
  .paper {
    background: #fff;
    width: 210mm;
    max-width: 100%;
    margin: 0 auto;
    padding: 15mm 16mm;
    border: 1px solid #d5cdb8;
    box-shadow: 0 4px 18px rgba(0,0,0,.16);
    position: relative;
    z-index: 1;
  }
  .paper + .paper { margin-top: 14px; }

  /* 试卷排版（与正式试卷一致） */
  .exam h1 {
    text-align: center;
    font-size: 22pt;
    font-family: "SimHei", "Microsoft YaHei", sans-serif;
    letter-spacing: 2px;
    line-height: 1.4;
  }
  .exam .sub-line {
    text-align: center;
    font-size: 10.5pt;
    margin: 2mm 0 3mm;
    color: #333;
  }
  .exam .info-row {
    display: flex;
    justify-content: center;
    gap: 10mm;
    margin: 3mm 0 4mm;
    font-size: 11pt;
  }
  .exam .info-row span {
    border-bottom: 1px solid #000;
    min-width: 24mm;
    display: inline-block;
    text-align: center;
  }
  .exam .notice {
    border: 1.5px solid #000;
    border-radius: 2mm;
    padding: 2mm 4mm;
    font-size: 10pt;
    margin-bottom: 5mm;
    line-height: 1.7;
  }
  .exam .notice b { font-family: "SimHei", sans-serif; }
  .exam h2.sec {
    font-size: 13pt;
    font-family: "SimHei", "Microsoft YaHei", sans-serif;
    margin: 6mm 0 3mm;
    padding-left: 2mm;
    border-left: 4px solid #000;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .exam h2.sec .score-box {
    float: right;
    border: 1.5px solid #000;
    padding: 1mm 3mm;
    font-size: 10.5pt;
    font-family: "SimHei", sans-serif;
    font-weight: normal;
    white-space: nowrap;
  }
  .exam .q {
    margin-bottom: 4mm;
    font-size: 11pt;
    line-height: 1.9;
  }
  .exam .opts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 6mm;
    padding-left: 8mm;
    margin-top: 1mm;
    font-size: 10.5pt;
  }
  .exam .opts.one { grid-template-columns: 1fr; }
  .exam .blank {
    display: inline-block;
    min-width: 16mm;
    border-bottom: 1px solid #000;
    text-align: center;
  }
  .exam .calc-area {
    height: 22mm;
    margin: 1.5mm 0 1mm 8mm;
    border: 1px dashed #999;
    border-radius: 1mm;
  }
  .exam .calc-area.tall {
    height: 30mm;
  }

  /* ── 排版模式 ── */
  .paper-stack.layouting .paper {
    box-shadow: 0 0 0 3px #8b5cf6, 0 8px 30px rgba(0,0,0,.18);
    background: #fffbf5;
  }
  .paper-stack.layouting .sec-block {
    outline: 1.5px dashed #a78bfa;
    outline-offset: 2mm;
    margin-bottom: 3mm;
  }
  .paper-stack.layouting .q {
    outline: 1px dashed rgba(139,92,246,.45);
    outline-offset: 1.5mm;
    margin: 1.5mm 0;
  }
  .paper-stack.layouting [data-e] {
    outline: 1px dashed rgba(236,72,153,.35);
    cursor: text;
    min-height: 1em;
  }
  .paper-stack.layouting [data-e]:focus {
    outline: 1.5px solid #ec4899;
    background: #fff;
  }
  .q-tools, .sec-tools {
    display: none;
  }
  .paper-stack.layouting .q-tools {
    display: flex;
    gap: 2mm;
    justify-content: flex-end;
    margin: 0.5mm 0;
  }
  .paper-stack.layouting .sec-block > .sec-tools {
    display: flex;
    gap: 2mm;
    justify-content: flex-end;
    margin: 1mm 0 0.5mm;
  }
  .tool-btn {
    font-size: 8.5pt;
    padding: 0.5mm 2mm;
    border: 1px solid #c4b5fd;
    border-radius: 1.5mm;
    background: #f5f3ff;
    color: #6d28d9;
    cursor: pointer;
    font-family: inherit;
  }
  .tool-btn.del {
    border-color: #fecaca;
    background: #fef2f2;
    color: #b91c1c;
  }
  .tool-btn:hover { background: #ede9fe; }
  .tool-btn.del:hover { background: #fee2e2; }
  .sort-handle {
    display: none;
    color: #8b5cf6;
    font-size: 10pt;
    cursor: grab;
    margin-right: 1.5mm;
    user-select: none;
    float: right;
  }
  .paper-stack.layouting .sort-handle { display: inline; }
  .paper-stack.layouting .sortable-ghost { opacity: .35; background: #ede9fe; }
  .paper-stack.layouting .sortable-chosen { cursor: grabbing; }
  .layout-tip {
    display: none;
    background: linear-gradient(135deg, #8b5cf6, #d946ef);
    color: #fff;
    padding: 2.5mm 4mm;
    border-radius: 2mm;
    font-size: 9.5pt;
    margin-bottom: 3mm;
  }
  .layout-tip b { font-weight: 700; }
  .paper-stack.layouting .pg-footer { display: none; }
  .exam .blank-ans {
    display: inline-block;
    min-width: 16mm;
    border-bottom: 1px solid #000;
    text-align: center;
    color: var(--red);
    font-weight: 600;
  }
  .exam .match-table {
    width: 100%;
    border-collapse: collapse;
    margin: 2mm 0 1mm;
    font-size: 10.5pt;
  }
  .exam .match-table th, .exam .match-table td {
    border: 1px solid #000;
    padding: 1.5mm 2.5mm;
    text-align: center;
  }
  .exam .match-table th { font-family: "SimHei", sans-serif; background: #f5f5f5; font-weight: normal; }
  .exam .reading-box {
    border: 1px solid #999;
    padding: 3mm 4mm;
    font-size: 10.5pt;
    line-height: 2;
    margin-bottom: 3mm;
    text-indent: 2em;
  }
  .exam .answer-sheet {
    margin-top: 3mm;
    border-collapse: collapse;
    width: 100%;
    font-size: 10.5pt;
  }
  .exam .answer-sheet th, .exam .answer-sheet td {
    border: 1px solid #000;
    text-align: center;
    padding: 1.5mm 0;
  }
  .exam .answer-sheet th { font-family: "SimHei", sans-serif; background: #f5f5f5; font-weight: normal; }
  .exam .footer-note {
    text-align: center;
    font-size: 9pt;
    color: #888;
    margin-top: 6mm;
  }
  .exam .lv { font-size: 10pt; color: #333; }
  .exam .tm { font-size: 9.5pt; color: #666; }

  /* 答案页 */
  .exam .ans-item { border-bottom: 1px dashed #bbb; padding-bottom: 2mm; margin-bottom: 2.5mm; font-size: 10.5pt; }
  .exam .ans-item:last-child { border-bottom: none; }
  .exam .ans-mark { color: var(--red); font-weight: bold; }
  .exam .ans-why { font-size: 10pt; color: #333; margin-top: 1mm; }

  .paper-breaker { display: none; }

  /* ───── 打印/存PDF：白纸黑字试卷，无浏览器页眉页脚，仅页码 ───── */
  .pg-footer { display: none; }

  @media print {
    /* 页边距设为 0：浏览器自带的页眉页脚（标题/网址/日期）无空间渲染，自动消失 */
    @page { size: A4 portrait; margin: 0; }
    body { background: #fff !important; padding: 0 !important; }
    .wrap { max-width: none !important; margin: 0 !important; width: auto !important; }
    .masthead, .sheet, .preview-bar, .loading-bar, .hint-wait, .err-box { display: none !important; }
    .result-area { display: block !important; margin: 0; animation: none; }
    .paper-stack { margin: 0; }
    .paper {
      width: auto; max-width: none;
      margin: 0; padding: 15mm 16mm 20mm;
      border: none; box-shadow: none;
    }
    .paper + .paper { margin-top: 0; }
    .paper-breaker { display: block; page-break-after: always; }
    .exam .footer-note { display: none; }
    /* 自制页码：固定页脚，每页重复，只显示页数 */
    .pg-footer {
      display: block;
      position: fixed;
      left: 0; right: 0; bottom: 5mm;
      text-align: center;
      font-size: 9pt;
      color: #444;
      font-family: "SimSun", serif;
    }
    .pg-footer::after { content: "— 第 " counter(page) " 页 / 共 " counter(pages) " 页 —"; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <h1>出题<em>工作台</em></h1>
    <span class="sub">选一选，AI 帮你出好题 ✏️</span>
  </div>

  <div class="workbench">

  <!-- 出题表单 -->
  <div class="sheet">
    <div class="tape"></div>
    <h2>出题条件</h2>
    <div class="grid">
      <div class="field">
        <label><b>*</b>年级</label>
        <select id="grade"><option value="">加载中…</option></select>
      </div>
      <div class="field">
        <label><b>*</b>科目</label>
        <select id="subject" disabled><option value="">请先选择年级</option></select>
      </div>
      <div class="field">
        <label><b>*</b>知识点关键词</label>
        <input type="text" id="keyword" maxlength="100" placeholder="如：分数的初步认识">
      </div>
      <div class="field">
        <label>试卷标题（可选）</label>
        <input type="text" id="titleInput" maxlength="40" placeholder="如：第一单元测验卷">
      </div>
      <div class="field" style="grid-column: 1 / -1;">
        <label>题型（点击立即出题并加入右侧卷面 →）</label>
        <div class="type-groups" id="typeGrid">
          <div class="type-group">
            <div class="tg-head">✏️ 基础题</div>
            <div class="tg-body">
              <button type="button" class="type-pill" data-v="quiz">☑️ 选择题</button>
              <button type="button" class="type-pill" data-v="fill_blank">🔤 填空题</button>
              <button type="button" class="type-pill" data-v="match_pair">🔗 连线配对</button>
            </div>
          </div>
          <div class="type-group">
            <div class="tg-head">🧮 计算专项</div>
            <div class="tg-body">
              <button type="button" class="type-pill" data-v="oral_math">⚡ 口算挑战</button>
              <button type="button" class="type-pill" data-v="vertical_calc">📐 竖式计算</button>
              <button type="button" class="type-pill" data-v="recursive_calc">🧩 脱式计算</button>
              <button type="button" class="type-pill" data-v="smart_calc">✨ 简便计算</button>
            </div>
          </div>
          <div class="type-group">
            <div class="tg-head">📚 综合拓展</div>
            <div class="tg-body">
              <button type="button" class="type-pill" data-v="reading">📖 阅读理解</button>
              <button type="button" class="type-pill" data-v="challenge">🏆 闯关挑战</button>
            </div>
          </div>
        </div>
      </div>
      <div class="field" style="grid-column: 1 / -1;">
        <label>难度</label>
        <div class="diff-row">
          <div class="diff" data-v="easy">简单<small>基础巩固</small></div>
          <div class="diff on-2" data-v="medium">中等<small>课堂同步</small></div>
          <div class="diff" data-v="hard">困难<small>拓展冲刺</small></div>
        </div>
      </div>
      <div class="scope-hint" id="scopeHint"></div>
    </div>

    <div class="actions">
      <button class="btn-go" id="btnGo">生成试卷（组卷）</button>
      <button class="btn-go regen" id="btnRegen" title="搭建区所有大题全部换一批新题">🔄 全部换一批</button>
      <span class="hint-wait">点题型即出题；同题型可加多块；全部就绪后组卷</span>
    </div>
    <div class="loading-bar" id="loadingBar"><i></i></div>
    <div class="err-box" id="errBox"></div>
  </div>

  <!-- 卷面搭建区：点题型 → 立即出现大题骨架块 -->
  <div class="builder-panel" id="builderPanel">
    <div class="builder-head">
      <h2>🧩 卷面搭建</h2>
      <span class="b-count" id="builderCount">0 个大题</span>
    </div>
    <p class="builder-tip">点击左侧题型卡片：立刻生成一批<b>真实题目</b>显示在这里（同题型可加多块）。<br>拖 ⠿ 调整顺序 ｜ －/＋ 改数量 ｜ 文字可直接点击修改 ｜ 🔄 换一批 ｜ ✕ 删除。全部就绪后点「生成试卷」组卷。</p>
    <div class="sec-list" id="secList">
      <div class="builder-empty" id="builderEmpty">
        <b>卷面还是空的</b>
        点击左侧「选择题」「填空题」等题型卡片，<br>真实的题目会立刻生成并出现在这里 🧩
      </div>
    </div>
    <div class="builder-actions">
      <div class="builder-summary" id="builderSummary">还没有安排任何大题</div>
    </div>
  </div>

  </div><!-- /workbench -->

  <!-- 结果预览 + 试卷 -->
  <div class="result-area" id="resultArea">
    <div class="preview-bar">
      <span class="sum" id="sumLine">—</span>
      <button class="btn-mini" id="btnPrint">💾 存 PDF（学生卷）</button>
      <button class="btn-mini warn" id="btnPrintAns">💾 存 PDF（含答案）</button>
      <button class="btn-mini" id="btnPNG">🖼 导出 PNG</button>
      <button class="btn-mini warn" id="btnPNGAns">🖼 导出 PNG（含答案）</button>
      <button class="btn-mini" id="btnPreviewAns">👁 预览答案</button>
      <button class="btn-mini" id="btnBackBuilder">🧩 返回搭建</button>
      <button class="btn-mini" id="btnLayout">✏️ 排版</button>
      <button class="btn-mini ok" id="btnLayoutDone" style="display:none">✅ 完成排版</button>
    </div>
    <div class="paper-stack" id="paperStack"></div>
  </div>
<!-- 打印页码（仅打印/PDF 时显示） -->
<div class="pg-footer"></div>

</div>

<script>
const API = '';
let curDiff = 'medium';
let paperData = null;   // {grade, subject, keyword, title, sections:[{type, data}], meta}
let showAnswers = false;

const $ = s => document.querySelector(s);
const TYPE_NAME = { quiz:'选择题', fill_blank:'填空题', match_pair:'连线配对', challenge:'闯关挑战', oral_math:'口算挑战', reading:'阅读理解', vertical_calc:'竖式计算', recursive_calc:'脱式计算', smart_calc:'简便计算' };
const TYPE_DEFAULT = { quiz:4, fill_blank:4, match_pair:1, challenge:3, oral_math:4, reading:1, vertical_calc:4, recursive_calc:4, smart_calc:4 };
const TYPE_ORDER = ['quiz','fill_blank','vertical_calc','recursive_calc','smart_calc','match_pair','oral_math','challenge','reading'];
const CN_NUM = ['一','二','三','四','五','六','七','八','九'];
const DIFF_NAME = { easy:'简单', medium:'中等', hard:'困难' };

/* ── 年级/科目 ── */
async function loadAvailable() {
  try {
    const r = await fetch(API + '/api/v1/scope/available');
    const d = await r.json();
    const grades = Object.keys(d.available);
    $('#grade').innerHTML = '<option value="">请选择年级</option>' +
      grades.map(g => `<option value="${g}">${g}</option>`).join('');
    $('#grade').onchange = () => {
      const g = $('#grade').value;
      const subs = d.available[g] || [];
      $('#subject').disabled = !g;
      $('#subject').innerHTML = `<option value="">请选择科目</option>` +
        subs.map(s => `<option value="${s}">${s}</option>`).join('');
      $('#scopeHint').style.display = 'none';
    };
    $('#subject').onchange = loadScope;
  } catch (e) {
    $('#grade').innerHTML = '<option value="">加载失败，请刷新</option>';
  }
}

async function loadScope() {
  const g = $('#grade').value, s = $('#subject').value;
  if (!g || !s) return;
  try {
    const r = await fetch(API + `/api/v1/scope?grade=${encodeURIComponent(g)}&subject=${encodeURIComponent(s)}`);
    const d = await r.json();
    const box = $('#scopeHint');
    box.style.display = 'block';
    box.innerHTML = `<b>📐 ${g} · ${s} 可出题的知识点</b>（可多选，点击选中/取消，也可在上方手动输入）：<br>` +
      d.allowed.map(k => `<span class="tag">${esc(k)}</span>`).join('');
    box.querySelectorAll('.tag').forEach(t => t.onclick = () => {
      t.classList.toggle('on');
      syncKeywordFromTags();
    });
  } catch (e) {}
}

/* 多选知识点 → 拼入关键词输入框 */
function syncKeywordFromTags() {
  const sel = [...document.querySelectorAll('#scopeHint .tag.on')].map(t => t.textContent);
  $('#keyword').value = sel.join('、');
}

/* ── 卷面搭建区：点题型 → 立即生成真实题目并展示 ── */
let builderSeq = 0;
let builderSecSortable = null;

/* 表单校验：点题型/组卷前必须有年级+科目+关键词 */
function builderForm() {
  const grade = $('#grade').value, subject = $('#subject').value, keyword = $('#keyword').value.trim();
  if (!grade || !subject || !keyword) {
    alert('请先选好年级、科目，并填写知识点关键词～');
    return null;
  }
  return { grade, subject, keyword };
}

function cardCount(card) {
  return Math.min(10, Math.max(1, parseInt(card.querySelector('.s-cnt input').value) || 1));
}

function initBuilder() {
  // 点击左侧题型药丸 → 立即出题并加入卷面（默认数量内置）
  document.querySelectorAll('.type-pill').forEach(item => {
    item.onclick = () => {
      addSecToBuilder(item.dataset.v, TYPE_DEFAULT[item.dataset.v] || 4);
      item.classList.remove('flash');
      void item.offsetWidth;
      item.classList.add('flash');
    };
  });

  // 大题块拖拽排序
  if (typeof Sortable !== 'undefined') {
    builderSecSortable = new Sortable($('#secList'), {
      animation: 150,
      handle: '.drag-handle',
      draggable: '.sec-card',
      ghostClass: 'sortable-ghost',
      onEnd: updateBuilderSummary
    });
  }

  // 换一批 / 重试 / 删除 / 数量加减（事件委托）
  $('#secList').addEventListener('click', e => {
    const card = e.target.closest('.sec-card');
    if (!card) return;
    if (e.target.classList.contains('s-del')) {
      card.remove();
      updateBuilderSummary();
    } else if (e.target.classList.contains('s-renew') || e.target.classList.contains('s-retry')) {
      fetchSecData(card, card.dataset.type, cardCount(card));
    } else if (e.target.classList.contains('minus') || e.target.classList.contains('plus')) {
      const input = card.querySelector('.s-cnt input');
      let n = parseInt(input.value) || 1;
      n = e.target.classList.contains('plus') ? n + 1 : n - 1;
      n = Math.min(10, Math.max(1, n));
      input.value = n;
      onCountChange(card, n);
    }
  });

  // 直接输入数量（防抖：减少=裁剪展示，增加=重新出一批）
  $('#secList').addEventListener('input', e => {
    if (e.target.tagName !== 'INPUT') return;
    const card = e.target.closest('.sec-card');
    if (!card) return;
    clearTimeout(card._cntTimer);
    card._cntTimer = setTimeout(() => {
      let n = parseInt(e.target.value) || 1;
      n = Math.min(10, Math.max(1, n));
      e.target.value = n;
      onCountChange(card, n);
    }, 600);
  });

  // 难度切换 → 已有大题自动重新出题（换难度=换题）
  document.querySelectorAll('.diff').forEach(d => d.addEventListener('click', () => {
    document.querySelectorAll('#secList .sec-card').forEach(card => {
      if (card._status === 'loading') return;
      fetchSecData(card, card.dataset.type, cardCount(card));
    });
  }));
}

/* 添加大题块（先出骨架 + 加载动画，再异步填充真实题目） */
function addSecToBuilder(type, count) {
  const form = builderForm();
  if (!form) return;
  builderSeq++;
  const el = document.createElement('div');
  el.className = 'sec-card';
  el.dataset.type = type;
  el.dataset.seq = builderSeq;
  el._status = 'loading';
  el.innerHTML = `
    <div class="s-head">
      <span class="drag-handle" title="拖拽调整顺序">⠿</span>
      <span class="s-idx">${builderSeq}</span>
      <span class="s-name">${TYPE_NAME[type]}</span>
      <span class="s-cnt">
        <span class="minus" title="减少一题">－</span>
        <input type="number" value="${Math.min(10, Math.max(1, count || 1))}" min="1" max="10">
        <span class="plus" title="增加一题">＋</span>
        <span>题</span>
      </span>
      <span class="s-btns">
        <button class="s-renew" title="全部换一批新题">🔄 换一批</button>
        <button class="s-del" title="删除这个大题">✕</button>
      </span>
    </div>
    <div class="s-body"></div>`;
  $('#secList').appendChild(el);
  showBuilderEmpty(false);
  updateBuilderSummary();
  fetchSecData(el, type, Math.min(10, Math.max(1, count || 1)));
}

/* 调后端出一批题 → 渲染进卡片（append=true 时追加到已有题目后面） */
async function fetchSecData(card, type, count, append = false) {
  const form = builderForm();
  if (!form) return;
  const body = card.querySelector('.s-body');
  card._status = 'loading';
  card.classList.add('loading');
  if (!append) {
    body.innerHTML = `<div class="s-loading"><span class="spin"></span>正在出题…（约 3~15 秒）</div>`;
  }
  try {
    const r = await fetch(API + '/api/v1/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        grade: form.grade, subject: form.subject, keyword: form.keyword,
        game_type: type, difficulty: curDiff,
        question_count: count, use_cache: false
      })
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      throw new Error(e.detail?.error || ('HTTP ' + r.status));
    }
    const data = await r.json();
    if (append && card._data?.questions) {
      card._data.questions.push(...(data.questions || []));
    } else {
      card._data = data;
    }
    card._status = 'ready';
    card.classList.remove('loading');
    const input = card.querySelector('.s-cnt input');
    if (input) input.value = card._data.questions.length;
    renderSecBody(card);
    updateBuilderSummary();
  } catch (err) {
    card._status = 'error';
    card.classList.remove('loading');
    body.innerHTML = `<div class="s-error">⚠ ${TYPE_NAME[type]}出题失败：${esc(err.message)}<button class="s-retry">↻ 重试</button></div>`;
    updateBuilderSummary();
  }
}

/* 把大题的真实题目渲染进卡片（可编辑文本用 contenteditable） */
function renderSecBody(card) {
  const type = card.dataset.type;
  const data = card._data;
  const body = card.querySelector('.s-body');
  let html = '';
  if (type === 'reading' && data.passage) {
    html += `<div class="s-passage" contenteditable="true" spellcheck="false">${esc(data.passage).replace(/\n/g, '<br>')}</div>`;
  }
  data.questions.forEach((q, i) => {
    const stem = q.stem ? esc(q.stem) : (type === 'match_pair' ? '请把左右两组中相互对应的内容用线连起来。' : '');
    html += `<div class="s-q" data-i="${i}">
      <span class="s-q-no">${i + 1}.</span>
      <span class="s-q-stem" contenteditable="true" spellcheck="false">${stem}</span>`;
    if (q.options) {
      html += `<div class="s-opts">` + q.options.map((o, j) =>
        `<div contenteditable="true" spellcheck="false" data-oi="${j}">${String.fromCharCode(65 + j)}. ${esc(stripOptPrefix(o))}</div>`).join('') + `</div>`;
    } else if (q.left_items) {
      html += `<div class="s-match"><table><tr><th>左栏</th><th>右栏</th></tr>`;
      q.left_items.forEach((lft, i2) => {
        html += `<tr><td contenteditable="true" spellcheck="false">${esc(lft)}</td><td contenteditable="true" spellcheck="false">${esc(q.right_items[i2])}</td></tr>`;
      });
      html += `</table></div>`;
    } else if (type === 'oral_math') {
      html += `<div class="s-ans-line">得数：______</div>`;
    } else if (type === 'vertical_calc' || type === 'recursive_calc' || type === 'smart_calc') {
      html += `<div class="s-ans-line">（${type === 'vertical_calc' ? '竖式' : '脱式'}计算）______</div>`;
    } else {
      html += `<div class="s-ans-line">______</div>`;
    }
    html += `</div>`;
  });
  body.innerHTML = html;
}

/* 数量变化：减少→裁剪题目；增加→追加生成（不丢已有题） */
function onCountChange(card, n) {
  const qs = card._data?.questions || [];
  if (card._status !== 'ready') { updateBuilderSummary(); return; }
  if (n < qs.length) {
    card._data.questions = qs.slice(0, n);
    renderSecBody(card);
    updateBuilderSummary();
  } else if (n > qs.length) {
    fetchSecData(card, card.dataset.type, n - qs.length, true);
  } else {
    updateBuilderSummary();
  }
}

/* 空态显隐 */
function showBuilderEmpty(show) {
  const empty = $('#builderEmpty');
  if (show) {
    if (!empty) {
      const el = document.createElement('div');
      el.className = 'builder-empty';
      el.id = 'builderEmpty';
      el.innerHTML = `<b>卷面还是空的</b>点击左侧「选择题」「填空题」等题型卡片，<br>这里会实时出现对应的题型大题块 🧩`;
      $('#secList').appendChild(el);
    }
  } else {
    empty?.remove();
  }
}

/* 读取搭建区 → [{type, count, seq, data, status}]（按当前拖拽后的顺序） */
function readBuilder() {
  return Array.from(document.querySelectorAll('#secList .sec-card')).map(el => ({
    type: el.dataset.type,
    count: Math.min(10, Math.max(1, parseInt(el.querySelector('.s-cnt input').value) || 1)),
    seq: parseInt(el.dataset.seq),
    status: el._status,
    data: el._data,
    el
  }));
}

/* 更新搭建区汇总（大题数 / 总题数 / 预估分值） */
function updateBuilderSummary() {
  const secs = readBuilder();
  const nSec = secs.length;
  const nQ = secs.reduce((s, x) => s + (x.status === 'ready' ? x.data.questions.length : x.count), 0);
  const nReady = secs.filter(x => x.status === 'ready').length;
  const nLoading = secs.filter(x => x.status === 'loading').length;
  const nError = secs.filter(x => x.status === 'error').length;
  const seqs = Array.from(document.querySelectorAll('#secList .sec-card')).map(el => el.querySelector('.s-idx'));
  seqs.forEach((s, i) => s.textContent = i + 1);
  $('#builderCount').textContent = nSec ? `${nSec} 个大题` : '0 个大题';
  if (!nSec) {
    $('#builderSummary').innerHTML = '还没有安排任何大题';
    showBuilderEmpty(true);
  } else {
    let html = `共 <b>${nSec}</b> 个大题 ｜ <b>${nQ}</b> 道题 ｜ 预计总分 <b>100</b> 分`;
    if (nLoading) html += ` ｜ <span class="s-loading-txt">⏳ ${nLoading} 个出题中…</span>`;
    if (nError) html += ` ｜ <span class="s-err-txt">⚠ ${nError} 个失败</span>`;
    if (!nLoading && !nError && nReady === nSec) html += ` ｜ <span class="s-ok-txt">✅ 全部就绪，可组卷</span>`;
    $('#builderSummary').innerHTML = html;
    showBuilderEmpty(false);
  }
}

/* 卷面为空时闪烁提示 */
function flashBuilder() {
  const p = $('#builderPanel');
  if (!p) return;
  p.classList.remove('need-attn');
  void p.offsetWidth;
  p.classList.add('need-attn');
  setTimeout(() => p.classList.remove('need-attn'), 2000);
}

/* ── 难度 ── */
document.querySelectorAll('.diff').forEach(d => d.onclick = () => {
  document.querySelectorAll('.diff').forEach(x => x.classList.remove('on-1','on-2','on-3'));
  d.classList.add(d.dataset.v === 'easy' ? 'on-1' : d.dataset.v === 'medium' ? 'on-2' : 'on-3');
  curDiff = d.dataset.v;
});

/* ── 组卷（题目已在搭建区实时生成，这里只是组装渲染） ── */
async function doGenerate() {
  const secs = readBuilder();
  if (!secs.length) {
    flashBuilder();
    alert('卷面还是空的～ 点击左侧题型卡片，先出题加进右侧卷面。');
    return;
  }
  const loading = secs.filter(s => s.status === 'loading');
  if (loading.length) { flashBuilder(); alert(`还有 ${loading.length} 个大题正在出题，稍等几秒再组卷～`); return; }
  const failed = secs.filter(s => s.status === 'error');
  if (failed.length) { flashBuilder(); alert(`有 ${failed.length} 个大题出题失败，请点「↻ 重试」修复或删除后再组卷。`); return; }
  const form = builderForm();
  if (!form) return;

  secs.forEach(s => syncCardEdits(s.el));
  paperData = {
    grade: form.grade, subject: form.subject, keyword: form.keyword,
    title: $('#titleInput').value.trim(),
    sections: secs.map(s => ({ type: s.type, data: s.data })),
    _manualOrder: true
  };
  showAnswers = false;
  $('#btnPreviewAns').textContent = '👁 预览答案';
  renderPaper();
  $('#resultArea').style.display = 'block';
  $('#resultArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
$('#btnGo').onclick = doGenerate;

/* 重新生成 = 搭建区所有大题全部换一批新题 */
$('#btnRegen').onclick = () => {
  const cards = document.querySelectorAll('#secList .sec-card');
  if (!cards.length) {
    flashBuilder();
    alert('卷面还是空的～ 点击左侧题型卡片，先出题加进右侧卷面。');
    return;
  }
  const form = builderForm();
  if (!form) return;
  cards.forEach(card => fetchSecData(card, card.dataset.type, cardCount(card)));
  $('#builderPanel').scrollIntoView({ behavior: 'smooth', block: 'center' });
};

/* 搭建区 contenteditable 编辑内容 → 回写到大题数据（组卷前调用） */
function syncCardEdits(card) {
  if (!card._data?.questions) return;
  const type = card.dataset.type;
  if (type === 'reading') {
    const p = card.querySelector('.s-passage');
    if (p) card._data.passage = p.innerText.trim();
  }
  card.querySelectorAll('.s-q').forEach(qEl => {
    const q = card._data.questions[parseInt(qEl.dataset.i)];
    if (!q) return;
    const stemEl = qEl.querySelector('.s-q-stem');
    if (stemEl && q.stem != null) q.stem = stemEl.innerText.trim();
    qEl.querySelectorAll('.s-opts > div').forEach(oEl => {
      const j = parseInt(oEl.dataset.oi);
      if (q.options && q.options[j] != null) {
        const m = oEl.innerText.trim().match(/^[A-H][.、：:．]\s*(.+)$/);
        q.options[j] = m ? m[1] : oEl.innerText.trim();
      }
    });
    const tds = qEl.querySelectorAll('.s-match td');
    tds.forEach((td, k) => {
      if (!q.left_items || !q.right_items) return;
      if (k % 2 === 0) q.left_items[k / 2] = td.innerText.trim();
      else q.right_items[(k - 1) / 2] = td.innerText.trim();
    });
  });
}
$('#btnBackBuilder').onclick = () => {
  flashBuilder();
  $('#builderPanel').scrollIntoView({ behavior: 'smooth', block: 'center' });
};

/* ── 渲染试卷 ── */
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function ansText(q) {
  if (q.options && typeof q.answer === 'number') return String.fromCharCode(65 + q.answer);
  if (Array.isArray(q.answer)) return q.answer.map(p => `${p[0]+1}－${p[1]+1}`).join('，');
  return String(q.answer);
}

/* 剥掉 LLM 可能误带的选项字母前缀（如 "A." "B：" "(C)" "D、"），避免出现 "A. A" 重复 */
function stripOptPrefix(o) {
  const m = String(o).trim().match(/^(?:[（(][A-H][）)]|[A-H](?:\.|:|：|、|．|\)|）))\s*(.+)$/);
  return m ? m[1] : String(o);
}

function renderPaper() {
  const d = paperData;

  // 大题按固定顺序排列（客观题→计算题→主观题）；人工排版过的卷子保持用户顺序
  if (!d._manualOrder) {
    d.sections.sort((a, b) => TYPE_ORDER.indexOf(a.type) - TYPE_ORDER.indexOf(b.type));
  }

  // 全局题号 + 稳定qid（供排版模式 DOM↔数据双向绑定）
  let no = 0;
  d.sections.forEach(sec => sec.data.questions.forEach(q => { no++; q._no = no; q._qid = q._qid || `q${no}_${Math.random().toString(36).slice(2,7)}`; }));
  d.allQs = d.sections.flatMap(s => s.data.questions);
  const totalQ = no;

  // 分值：客观题(有选项)每题2分，其余平摊剩余，总和恒为 100
  const isObj = q => !!q.options;
  const objQs = [], subQs = [];
  d.sections.forEach(sec => sec.data.questions.forEach(q => (isObj(q) ? objQs : subQs).push(q)));
  const score = new Map();
  if (subQs.length) {
    objQs.forEach(q => score.set(q, 2));
    let remain = Math.max(100 - objQs.length * 2, subQs.length);
    const base = Math.floor(remain / subQs.length);
    let extra = remain - base * subQs.length;
    subQs.forEach(q => { score.set(q, base + (extra-- > 0 ? 1 : 0)); });
  } else {
    const base = Math.floor(100 / totalQ);
    let extra = 100 - base * totalQ;
    d.allQs.forEach(q => { score.set(q, base + (extra-- > 0 ? 1 : 0)); });
  }
  const secTotal = sec => sec.data.questions.reduce((s, q) => s + score.get(q), 0);

  $('#sumLine').textContent = `📋 ${d.grade} ${d.subject} ｜ ${d.keyword} ｜ 共 ${totalQ} 题（${d.sections.map(s => `${TYPE_NAME[s.type]}×${s.data.questions.length}`).join(' + ')}）｜ 满分 100 分`;

  // ── 学生卷 ──
  let html = `<div class="paper"><div class="exam">`;
  html += `<h1>${esc(d.title || (d.grade + d.subject + '测试卷'))}</h1>`;
  html += `<div class="sub-line">范围：${esc(d.keyword)} ｜ 难度：${DIFF_NAME[curDiff]} ｜ 满分 100 分 ｜ 时间 60 分钟</div>`;
  html += `<div class="info-row"><div>姓名：<span>&nbsp;</span></div><div>班级：<span>&nbsp;</span></div><div>学号：<span>&nbsp;</span></div><div>得分：<span>&nbsp;</span></div></div>`;
  html += `<div class="notice"><b>注意事项：</b>① 答题前请将姓名、班级填写清楚；② 选择题答案填入答题卡；③ 保持卷面整洁，字迹工整。</div>`;

  d.sections.forEach((sec, si) => {
    const qs = sec.data.questions;
    sec._sid = sec._sid || `s${si}_${Math.random().toString(36).slice(2,7)}`;
    html += `<div class="sec-block" data-type="${sec.type}" data-sid="${sec._sid}">`;
    html += `<h2 class="sec"><span>${CN_NUM[si]}、${TYPE_NAME[sec.type]}</span><span class="score-box">共 ${secTotal(sec)} 分</span></h2>`;

    if (sec.type === 'reading' && sec.data.passage) {
      html += `<div class="reading-box" data-e="passage">${esc(sec.data.passage).replace(/\n/g, '<br>')}</div>`;
    }

    qs.forEach(q => {
      const lv = q.difficulty_level ? `<span class="lv">[第${q.difficulty_level}关]</span> ` : '';
      const stem = q.stem ? esc(q.stem) : '请把左右两组中相互对应的内容用线连起来。';
      html += `<div class="q" data-qid="${q._qid}"><div data-e="stem">${q._no}. ${lv}${stem}</div>`;
      if (q.options) {
        html += `<div class="opts" data-e="opts">` + q.options.map((o, j) =>
          `<div>${String.fromCharCode(65 + j)}. ${esc(stripOptPrefix(o))}</div>`).join('') + `</div>`;
      } else if (q.left_items) {
        html += `<table class="match-table" data-e="match"><tr><th style="width:50%">左栏</th><th style="width:50%">右栏</th></tr>`;
        q.left_items.forEach((lft, i) => {
          html += `<tr data-i="${i}"><td>（${i + 1}）${esc(lft)}</td><td>（${i + 1}）${esc(q.right_items[i])}</td></tr>`;
        });
        html += `</table>`;
      } else if (q.type === 'oral_math' || sec.type === 'oral_math') {
        html += `<div class="opts one"><div>得数：<span class="blank">&nbsp;</span></div></div>`;
      } else if (q.type === 'vertical_calc' || sec.type === 'vertical_calc') {
        html += `<div class="calc-area"></div>`;
      } else if (q.type === 'recursive_calc' || q.type === 'smart_calc' || sec.type === 'recursive_calc' || sec.type === 'smart_calc') {
        html += `<div class="calc-area tall"></div>`;
      } else if (q.type !== 'fill_blank' && sec.type !== 'fill_blank') {
        html += `<div class="opts one"><div>答：<span class="blank">&nbsp;</span></div></div>`;
      }
      html += `</div>`;
    });

    const objInSec = qs.filter(q => q.options);
    if (objInSec.length) {
      html += `<table class="answer-sheet"><tr><th>题号</th>`;
      objInSec.forEach(q => { html += `<th>${q._no}</th>`; });
      html += `</tr><tr><td>答案</td>`;
      objInSec.forEach(() => { html += `<td></td>`; });
      html += `</tr></table>`;
    }
    html += `</div>`;  // sec-block
  });
  html += `<div class="footer-note">—— 卷终 · 认真检查，你一定行！——</div>`;
  html += `</div></div><div class="paper-breaker"></div>`;

  // ── 答案页 ──
  html += `<div class="paper"><div class="exam"><h1 style="font-size:16pt;">参考答案与解析</h1>`;
  d.sections.forEach((sec, si) => {
    html += `<h2 class="sec"><span>${CN_NUM[si]}、${TYPE_NAME[sec.type]}</span></h2>`;
    sec.data.questions.forEach(q => {
      let a;
      if (sec.type === 'match_pair') {
        a = q.answer.map(p => `（${p[0] + 1}）→（${p[1] + 1}）`).join('；');
      } else {
        a = ansText(q);
        if (q.options && typeof q.answer === 'number') a += `（${stripOptPrefix(q.options[q.answer])}）`;
      }
      html += `<div class="ans-item">${q._no}. <span class="ans-mark">${esc(a)}</span><div class="ans-why">${esc(q.analysis || '')}</div></div>`;
    });
  });
  html += `</div></div>`;

  $('#paperStack').innerHTML = html;
}

/* ── 预览答案 / 打印 ── */
$('#btnPreviewAns').onclick = () => {
  showAnswers = !showAnswers;
  if (showAnswers) fillBlanks(); else clearBlanks();
  $('#btnPreviewAns').textContent = showAnswers ? '👁 隐藏答案' : '👁 预览答案';
};

function fillBlanks() {
  if (!paperData) return;
  document.querySelectorAll('#paperStack .paper:first-child .q').forEach(el => {
    if (el.querySelector('.q-ans-inline')) return;
    const num = parseInt(el.querySelector('div').textContent);
    const q = paperData.allQs.find(x => x._no === num);
    if (!q) return;
    let a;
    if (q.left_items) {
      a = q.answer.map(p => `（${p[0] + 1}）→（${p[1] + 1}）`).join('；');
    } else {
      a = ansText(q);
      if (q.options && typeof q.answer === 'number') a += `（${stripOptPrefix(q.options[q.answer])}）`;
    }
    const span = document.createElement('div');
    span.className = 'q-ans-inline';
    span.style.cssText = 'color:#d0342c;font-weight:600;font-size:10.5pt;margin-top:1mm;';
    span.textContent = `✎ 答案：${a}`;
    el.appendChild(span);
  });
}
function clearBlanks() {
  document.querySelectorAll('#paperStack .q-ans-inline').forEach(el => el.remove());
}

/* ── 人工排版模式（SortableJS 拖拽 + contenteditable 编辑）── */
let layoutMode = false;
let sortables = [];

function initLayoutMode() {
  const stack = $('#paperStack');
  const tip = document.createElement('div');
  tip.className = 'layout-tip';
  tip.innerHTML = `<b>✏️ 排版模式</b>：拖 ⠿ 调整顺序（题目可跨大题移动）｜虚线框文字点击可直接修改｜✕ 删除题目或大题｜完成后点「✅ 完成排版」重新计算题号与分值`;
  stack.parentNode.insertBefore(tip, stack);

  $('#btnLayout').onclick = () => {
    if (!paperData) return;
    if (showAnswers) { $('#btnPreviewAns').click(); }
    exitLayout(false);
    enterLayout();
  };
  $('#btnLayoutDone').onclick = () => exitLayout(true);
}

/* 进入排版：激活 Sortable + contenteditable + 注入工具按钮 */
function enterLayout() {
  layoutMode = true;
  $('#paperStack').classList.add('layouting');
  $('#btnLayout').style.display = 'none';
  $('#btnLayoutDone').style.display = '';
  $('.layout-tip').style.display = 'block';

  const paper = $('#paperStack .paper');
  if (!paper) return;

  // 大题工具条（删除大题）
  paper.querySelectorAll('.sec-block').forEach(secEl => {
    const tools = document.createElement('div');
    tools.className = 'sec-tools';
    tools.innerHTML = `<span class="tool-btn del" data-act="del-sec">✕ 删除整题（大题）</span>`;
    secEl.insertBefore(tools, secEl.firstChild);
  });

  // 题目工具条 + 拖拽手柄 + 可编辑字段
  paper.querySelectorAll('.q').forEach((qEl, qi) => {
    const tools = document.createElement('div');
    tools.className = 'q-tools';
    tools.innerHTML = `<span class="tool-btn del" data-act="del-q">✕ 删</span>`;
    qEl.appendChild(tools);
    const stem = qEl.querySelector('[data-e="stem"]');
    if (stem) {
      const h = document.createElement('span');
      h.className = 'sort-handle';
      h.textContent = '⠿';
      stem.appendChild(h);
      qEl._dragHandle = h;
    }
    qEl.querySelectorAll('[data-e]').forEach(ed => {
      ed.contentEditable = 'true';
      ed.spellcheck = false;
    });
  });

  // 初始化 Sortable：外层大题排序 + 内层题目排序（共享 group，可跨大题拖）
  if (typeof Sortable !== 'undefined') {
    sortables = [];
    new Sortable(paper.querySelector('.exam'), {
      animation: 150,
      handle: 'h2.sec',
      draggable: '.sec-block',
      ghostClass: 'sortable-ghost',
      onEnd: syncFromDOM
    });
    paper.querySelectorAll('.sec-block').forEach(secEl => {
      sortables.push(new Sortable(secEl, {
        group: 'questions',
        animation: 150,
        handle: '.sort-handle',
        draggable: '.q',
        ghostClass: 'sortable-ghost',
        onEnd: syncFromDOM
      }));
    });
  }
}

/* 退出排版：回写数据 + 重渲染（重新编号、重新算分） */
function exitLayout(apply) {
  if (!layoutMode) return;
  if (apply) syncFromDOM();
  layoutMode = false;
  sortables.forEach(s => s.destroy());
  sortables = [];
  $('#paperStack').classList.remove('layouting');
  $('#btnLayout').style.display = '';
  $('#btnLayoutDone').style.display = 'none';
  $('.layout-tip').style.display = 'none';
  if (apply) renderPaper();
}

/* DOM → 数据回写：顺序、编辑文本、删除 */
function syncFromDOM() {
  if (!paperData) return;
  const paper = $('#paperStack .paper');
  if (!paper) return;

  // 1) 读取顺序与编辑内容
  const secs = [];
  paper.querySelectorAll('.sec-block').forEach(secEl => {
    const sid = secEl.dataset.sid;
    const sec = paperData.sections.find(s => s._sid === sid);
    if (!sec) return;
    sec._used = true;
    const qs = [];
    secEl.querySelectorAll(':scope > .q').forEach(qEl => {
      const q = findQByQid(qEl);
      if (!q) return;
      if (layoutMode) writeBackQ(qEl, q);
      qs.push(q);
    });
    secs.push({ type: sec.type, _sid: sec._sid, data: { ...sec.data, questions: qs } });
  });
  paperData.sections.forEach(s => delete s._used);

  // 2) 删除的大题/题目不再出现在数据里（上面重建时已天然剔除）
  paperData.sections = secs;

  // 3) 全量重新编号 + 标记人工顺序
  renumberAll();
  paperData._manualOrder = true;
}

/* 由 DOM 的 data-qid 精确反查题目对象（跨大题移动/删题后依然稳定） */
function findQByQid(qEl) {
  const qid = qEl.dataset.qid;
  return qid ? paperData.allQs.find(x => x._qid === qid) : null;
}

/* 编辑内容回写到题目对象 */
function writeBackQ(qEl, q) {
  const stemEl = qEl.querySelector('[data-e="stem"]');
  if (stemEl) {
    let t = stemEl.textContent.replace(/\s*⠿\s*$/g, '').trim();
    const m = t.match(/^(\d+)\s*[.、]?\s*(.*)$/s);
    if (m) {
      q.stem = m[2].trim() || q.stem;
    } else {
      // 题号前缀被误删时兜底：剥掉手柄字符后整体作为题干，避免编辑静默丢失
      q.stem = t || q.stem;
    }
  }
  const optsEl = qEl.querySelector('[data-e="opts"]');
  if (optsEl && q.options) {
    const lines = Array.from(optsEl.querySelectorAll(':scope > div')).map(d => d.textContent.replace(/^[A-H][.、:：]\s*/, '').trim()).filter(Boolean);
    if (lines.length) q.options = lines;
  }
  const matchEl = qEl.querySelector('[data-e="match"]');
  if (matchEl && q.left_items) {
    matchEl.querySelectorAll('tr[data-i]').forEach(tr => {
      const i = parseInt(tr.dataset.i);
      const tds = tr.querySelectorAll('td');
      if (tds.length === 2 && i < q.left_items.length) {
        q.left_items[i] = tds[0].textContent.replace(/^（\d+）\s*/, '').trim();
        q.right_items[i] = tds[1].textContent.replace(/^（\d+）\s*/, '').trim();
        q.left_items[i] = q.left_items[i] || ' ';
        q.right_items[i] = q.right_items[i] || ' ';
      }
    });
  }
}

/* 重新编号 + 计分 + 更新汇总行 */
function renumberAll() {
  let no = 0;
  paperData.sections.forEach(sec => sec.data.questions.forEach(q => { no++; q._no = no; }));
  paperData.allQs = paperData.sections.flatMap(s => s.data.questions);
  $('#sumLine').textContent = `📋 ${paperData.grade} ${paperData.subject} ｜ ${paperData.keyword} ｜ 共 ${no} 题（${paperData.sections.map(s => `${TYPE_NAME[s.type]}×${s.data.questions.length}`).join(' + ')}）｜ 满分 100 分`;
}

/* 删除按钮（事件委托） */
document.addEventListener('click', e => {
  const btn = e.target.closest('.tool-btn[data-act]');
  if (!btn || !layoutMode) return;
  const act = btn.dataset.act;
  if (act === 'del-q') {

});

/* 共用：离屏渲染试卷 → 按A4比例切成页画布数组 */
async function buildPageCanvases(withAnswers) {
  if (typeof html2canvas === 'undefined') throw new Error('组件加载失败，请检查网络后刷新重试');
  clearBlanks();   // 卷面始终是干净的学生卷，答案只出现在末尾答案页

  // 离屏克隆试卷，去掉屏幕装饰，固定为 A4 版式
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-99999px;top:0;background:#fff;z-index:-1;';
  const clone = $('#paperStack').cloneNode(true);
  clone.querySelectorAll('.paper-breaker').forEach(b => b.remove());
  clone.querySelectorAll('.paper').forEach(p => {
    p.style.cssText = 'width:210mm;max-width:none;margin:0;padding:15mm 16mm 20mm;border:none;box-shadow:none;background:#fff;';
  });
  // 学生卷：只保留第一张试卷；含答案版：完整学生卷 + 末尾独立的参考答案页
  if (!withAnswers) clone.querySelectorAll('.paper:not(:first-child)').forEach(p => p.remove());
  holder.appendChild(clone);
  document.body.appendChild(holder);

  const pages = [];
  try {
    for (const paper of clone.querySelectorAll('.paper')) {
      // 高分辨率渲染（约 288 DPI）
      const canvas = await html2canvas(paper, { scale: 3, backgroundColor: '#ffffff' });
      const W = canvas.width;
      const pageH = Math.round(W * 297 / 210);   // A4 比例页高

      // 收集块级元素的分界位置（避免把题目从中间切开）
      const scale = W / paper.offsetWidth;
      const breaks = [];
      paper.querySelectorAll('.exam > *').forEach(el => {
        breaks.push(Math.round(el.offsetTop * scale) + Math.round(el.offsetHeight * scale));
      });
      breaks.sort((a, b) => a - b);

      // 逐页切片
      let y = 0;
      while (y < canvas.height - 2) {
        let cut = y + pageH;
        if (cut < canvas.height) {
          // 优先在元素边界处断页
          const ok = breaks.filter(b => b > y + pageH * 0.55 && b <= cut);
          if (ok.length) cut = ok[ok.length - 1];
        } else { cut = canvas.height; }
        const h = cut - y;

        const page = document.createElement('canvas');
        page.width = W; page.height = pageH;
        const ctx = page.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, W, pageH);
        ctx.drawImage(canvas, 0, y, W, h, 0, 0, W, h);
        pages.push(page);
        y = cut;
      }
    }
  } finally {
    document.body.removeChild(holder);
  }
  return pages;
}

/* 统一的按钮状态管理 */
async function withExportState(btn, job) {
  const wasShown = showAnswers;
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = '导出中…';
  try {
    await job();
  } catch (e) {
    alert('导出失败：' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = old;
    if (wasShown) fillBlanks(); else clearBlanks();  // 恢复原预览状态
  }
}

async function exportPDF(withAnswers, btn) {
  if (!paperData) return;
  if (layoutMode) exitLayout(true);
  await withExportState(btn, async () => {
    if (typeof window.jspdf === 'undefined') throw new Error('PDF 组件加载失败，请检查网络后刷新重试');
    const pages = await buildPageCanvases(withAnswers);
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
    pages.forEach((pc, i) => {
      if (i) doc.addPage();
      doc.addImage(pc.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297);
    });
    // 页码：仅显示页数，无其他页眉页脚
    const total = pages.length;
    doc.setFont('times', 'normal');
    doc.setFontSize(9);
    for (let i = 1; i <= total; i++) {
      doc.setPage(i);
      const t = `- ${i} / ${total} -`;
      doc.text(t, 105, 292.5, { align: 'center' });
    }
    const title = paperData.title || (paperData.grade + paperData.subject + '测试卷');
    doc.save(`${title}${withAnswers ? '（含答案）' : ''}.pdf`);
  });
}

async function exportPNG(withAnswers, btn) {
  if (!paperData) return;
  if (layoutMode) exitLayout(true);
  await withExportState(btn, async () => {
    const pages = await buildPageCanvases(withAnswers);
    const title = paperData.title || (paperData.grade + paperData.subject + '测试卷');
    pages.forEach((pc, i) => {
      const a = document.createElement('a');
      a.href = pc.toDataURL('image/png');
      a.download = `${title}_第${i + 1}页.png`;
      a.click();
    });
  });
}
