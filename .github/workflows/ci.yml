name: Regression Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

# 同一 PR / 同一分支的新一轮推送会取消还在跑的旧一轮；push 与 pull_request 用不同的 key，互不误杀
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Whitespace and merge conflicts
        run: |
          git diff --check ${{ github.event.pull_request.base.sha || 'HEAD~1' }} HEAD
          python scripts/check_text_files.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [web, admin, miniprogram]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # 与 Dockerfile 的 corepack prepare pnpm@10.14.0 保持一致
          version: 10.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ${{ matrix.project }}/pnpm-lock.yaml
      - run: pnpm --dir ${{ matrix.project }} install --frozen-lockfile
      - name: Audit frontend dependencies
        # braces GHSA-vfj7-8cjw-p6xm 官方补丁版本为 <0.0.0（截至 2026-10-07 未发布修复版，
        # 3.0.3 已是最新，且仅在 eslint 开发依赖链），经三端 pnpm.auditConfig.ignoreCves /
        # auditConfig.ignoreCves 精确豁免该 CVE（CVE-2026-93687），其余可修复漏洞仍拦截 CI。
        run: pnpm --dir ${{ matrix.project }} audit --audit-level=high --registry https://registry.npmjs.org
      - name: Lint
        run: pnpm --dir ${{ matrix.project }} lint
      - if: matrix.project == 'miniprogram'
        run: pnpm --dir miniprogram check:overrides
      - run: pnpm --dir ${{ matrix.project }} typecheck
      - run: pnpm --dir ${{ matrix.project }} test
      - if: matrix.project != 'miniprogram'
        run: pnpm --dir ${{ matrix.project }} build
      - name: Cache browser downloads
        if: matrix.project != 'miniprogram'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml', 'admin/pnpm-lock.yaml') }}
      - name: Install browser for workspace regression
        if: matrix.project != 'miniprogram'
        run: pnpm --dir ${{ matrix.project }} exec playwright install --with-deps chromium
      - name: Workspace browser regression
        if: matrix.project != 'miniprogram'
        run: pnpm --dir ${{ matrix.project }} test:browser
      - name: Browser regression evidence
        if: always() && matrix.project != 'miniprogram'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.project }}-browser-evidence
          path: |
            artifacts/browser-tests
            artifacts/admin-browser-tests
          retention-days: 7
      - if: matrix.project == 'miniprogram'
        run: |
          pnpm --dir miniprogram build:mp-weixin
          pnpm --dir miniprogram check:mp
          VITE_API_BASE_URL=/ pnpm --dir miniprogram build:h5
      - if: matrix.project == 'miniprogram'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: miniprogram-h5-dist
          path: miniprogram/dist/build/h5
          if-no-files-found: error
          retention-days: 1
      - if: matrix.project != 'miniprogram'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.project }}-dist
          path: ${{ matrix.project }}/dist
          if-no-files-found: error
          retention-days: 1

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        check: [lint, types, tests, audit, contracts]
    services:
      postgres:
        # 与 docker-compose*.yml 的 db 服务同一 tag
        image: postgres:16-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 测试只会在这个本地实例上创建/删除 lc_test_* 前缀的一次性库（tests/pg_support.py 有护栏）
      LC_TEST_PG_ADMIN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      # requirements-dev.txt 已包含 -r requirements.txt，外加 pytest / pytest-xdist / mypy / pip-audit / ruff
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Lint (ruff)
        if: matrix.check == 'lint'
        # 只做 check，不做 format --check：全量格式化会是巨大 diff，另行安排
        run: ruff check app tests run.py scripts
      - name: Security audit
        if: matrix.check == 'audit'
        # pip-audit 的 --no-deps 只能与 -r/--requirement 同用，单独使用会直接报用法错误
        # （exit 2）。这里改为审计上一步 pip install -r 装出来的环境。
        run: pip-audit --skip-editable
      - name: Type check
        if: matrix.check == 'types'
        run: mypy app run.py scripts
      - name: Backend tests (pytest, parallel on disposable lc_test_* databases)
        if: matrix.check == 'tests'
        run: python -m pytest -n auto
      - if: matrix.check == 'contracts'
        run: |
          python scripts/check-metrics-workers.py
          python scripts/generate_api_types.py --check

  docker:
    # 验证生产镜像能构建、非 root 用户下应用能被 import；不推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: learn-coach:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          python3 -c "import sys; sys.path.insert(0, 'scripts/release'); from image_checks import verify_image; verify_image('learn-coach:ci')"
      - name: Scan runtime image
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed learn-coach:ci
      - name: Build operations image
        run: docker build --target ops -t learn-coach-ops:ci .
      - name: Verify PostgreSQL tools and encrypted restore
        run: |
          python3 -c "import sys; sys.path.insert(0, 'scripts/release'); from image_checks import verify_image; verify_image('learn-coach-ops:ci')"
          docker run --rm --network none --entrypoint pg_dump learn-coach-ops:ci --version
          docker run --rm --network none --entrypoint pg_restore learn-coach-ops:ci --version
          docker run --rm --network none --entrypoint sh learn-coach-ops:ci -ec '
            printf "ci-only-test-password" > /tmp/password
            export RESTIC_REPOSITORY=/tmp/repository RESTIC_PASSWORD_FILE=/tmp/password RESTIC_CACHE_DIR=/tmp/cache
            mkdir /tmp/source
            printf "roundtrip fixture" > /tmp/source/content
            restic init
            restic backup --host learn-coach --tag learn-coach /tmp/source
            restic restore latest --host learn-coach --tag learn-coach --target /tmp/restored
            cmp /tmp/source/content /tmp/restored/tmp/source/content
            restic check
          '
      - name: Receipt permissions across isolated writer and monitor roles
        run: docker run --rm --network none --read-only --tmpfs /tmp --user 0 -v "$PWD:/verify:ro" --entrypoint python learn-coach-ops:ci /verify/tests/verify_receipt_permissions.py

  ui-contracts:
    needs: [frontend, backend]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [http, home, profile, discovery, performance]
    services:
      postgres:
        image: postgres:16-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LC_TEST_PG_ADMIN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admin-dist
          path: admin/dist
      - if: matrix.suite != 'http'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: miniprogram-h5-dist
          path: miniprogram/dist/build/h5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        if: matrix.suite != 'http'
        with:
          version: 10.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: matrix.suite != 'http'
        with:
          node-version: '22'
      - if: matrix.suite != 'http'
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir miniprogram install --frozen-lockfile
          pnpm --dir web exec playwright install --with-deps chromium
      - run: python tests/run_ui_contracts.py --suite ${{ matrix.suite }}
      - name: UI contract evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ui-contracts-${{ matrix.suite }}
          path: |
            artifacts/home-redesign
            artifacts/profile-membership
            artifacts/mini-optimization
            artifacts/mini-discovery
            artifacts/mini-performance
          retention-days: 7
