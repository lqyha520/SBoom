name: Regression Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一 PR / 同一分支的新一轮推送会取消还在跑的旧一轮；push 与 pull_request 用不同的 key，互不误杀
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [web, admin, miniprogram]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # 与 Dockerfile 的 corepack prepare pnpm@10.14.0 保持一致
          version: 10.14.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ${{ matrix.project }}/pnpm-lock.yaml
      - run: pnpm --dir ${{ matrix.project }} install --frozen-lockfile
      - name: Audit frontend dependencies
        run: pnpm --dir ${{ matrix.project }} audit --audit-level=high --registry https://registry.npmjs.org
      - name: Lint (if the project defines a lint script)
        run: pnpm --dir ${{ matrix.project }} run --if-present lint
      - run: pnpm --dir ${{ matrix.project }} typecheck
      - run: pnpm --dir ${{ matrix.project }} test
      - if: matrix.project != 'miniprogram'
        run: pnpm --dir ${{ matrix.project }} build
      - name: Install browser for workspace regression
        if: matrix.project == 'web'
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Workspace browser regression
        if: matrix.project == 'web'
        run: pnpm --dir web test:browser
      - name: Browser failure evidence
        if: failure() && matrix.project == 'web'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-browser-failures
          path: artifacts/browser-tests
          retention-days: 7
      - if: matrix.project == 'miniprogram'
        run: |
          pnpm --dir miniprogram build:mp-weixin
          pnpm --dir miniprogram check:mp
          pnpm --dir miniprogram build:h5
      - if: matrix.project != 'miniprogram'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.project }}-dist
          path: ${{ matrix.project }}/dist
          if-no-files-found: error
          retention-days: 1

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # 与 docker-compose*.yml 的 db 服务同一 tag
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 测试只会在这个本地实例上创建/删除 lc_test_* 前缀的一次性库（tests/pg_support.py 有护栏）
      LC_TEST_PG_ADMIN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip
      # requirements-dev.txt 已包含 -r requirements.txt，外加 pytest / pytest-xdist / mypy / pip-audit / ruff
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint (ruff)
        # 只做 check，不做 format --check：全量格式化会是巨大 diff，另行安排
        run: ruff check app tests run.py scripts
      - name: Security audit
        # pip-audit 的 --no-deps 只能与 -r/--requirement 同用，单独使用会直接报用法错误
        # （exit 2）。这里改为审计上一步 pip install -r 装出来的环境。
        run: pip-audit --skip-editable
      - name: Type check
        run: mypy app run.py scripts
      - name: Backend tests (pytest, parallel on disposable lc_test_* databases)
        run: python -m pytest -n auto
      - run: python scripts/check-metrics-workers.py

  docker:
    # 验证生产镜像能构建、非 root 用户下应用能被 import；不推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: learn-coach:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          docker run --rm --network none learn-coach:ci python -c "import app.main; print('app.main import ok')"
          docker run --rm --network none learn-coach:ci id -u | grep -qx 10001

  ui-contracts:
    needs: [frontend, backend]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LC_TEST_PG_ADMIN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: admin-dist
          path: admin/dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python tests/run_ui_contracts.py
