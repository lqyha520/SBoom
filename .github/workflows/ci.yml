name: Regression Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            admin/pnpm-lock.yaml
            miniprogram/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir admin install --frozen-lockfile
      - run: pnpm --dir miniprogram install --frozen-lockfile
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      - run: pnpm --dir admin typecheck
      - run: pnpm --dir admin build
      - run: pnpm --dir miniprogram typecheck
      - run: pnpm --dir miniprogram test
      - run: pnpm --dir miniprogram build:mp-weixin
      - run: pnpm --dir miniprogram check:mp
      - run: pnpm --dir miniprogram build:h5
      - run: python -m unittest discover -s tests -p 'test_backend*.py' -v
      - run: python tests/run_ui_contracts.py
