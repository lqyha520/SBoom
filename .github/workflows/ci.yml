name: Regression Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一 PR / 同一分支的新一轮推送会取消还在跑的旧一轮；push 与 pull_request 用不同的 key，互不误杀
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [web, admin, miniprogram]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          # 与 Dockerfile 的 corepack prepare pnpm@10.14.0 保持一致
          version: 10.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ${{ matrix.project }}/pnpm-lock.yaml
      - run: pnpm --dir ${{ matrix.project }} install --frozen-lockfile
      - name: Audit frontend dependencies
        run: pnpm --dir ${{ matrix.project }} audit --audit-level=high --registry https://registry.npmjs.org
      - name: Lint (if the project defines a lint script)
        run: pnpm --dir ${{ matrix.project }} run --if-present lint
      - run: pnpm --dir ${{ matrix.project }} typecheck
      - run: pnpm --dir ${{ matrix.project }} test
      - if: matrix.project != 'miniprogram'
        run: pnpm --dir ${{ matrix.project }} build
      - if: matrix.project == 'miniprogram'
        run: |
          pnpm --dir miniprogram build:mp-weixin
          pnpm --dir miniprogram check:mp
          pnpm --dir miniprogram build:h5
      - if: matrix.project != 'miniprogram'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.project }}-dist
          path: ${{ matrix.project }}/dist
          if-no-files-found: error
          retention-days: 1

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # 与 docker-compose*.yml 的 db 服务同一 tag
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 测试只会在这个本地实例上创建/删除 lc_test_* 前缀的一次性库（tests/pg_support.py 有护栏）
      LC_TEST_PG_ADMIN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip
      # requirements-dev.txt 已包含 -r requirements.txt，外加 pytest / pytest-xdist / mypy / pip-audit / ruff
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint (ruff)
        # 只做 check，不做 format --check：全量格式化会是巨大 diff，另行安排
        run: ruff check app tests run.py scripts
      - name: Security audit
        # pip-audit 的 --no-deps 只能与 -r/--requirement 同用，单独使用会直接报用法错误
        # （exit 2）。这里改为审计上一步 pip install -r 装出来的环境。
        run: pip-audit --skip-editable
      - name: Type check
        run: mypy app run.py scripts
      - name: Backend tests (pytest, parallel on disposable lc_test_* databases)
        run: python -m pytest -n auto
      - run: python scripts/check-metrics-workers.py

  docker:
    # 验证生产镜像能构建、非 root 用户下应用能被 import；不推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: learn-coach:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          docker run --rm --network none learn-coach:ci python -c "import app.main; print('app.main import ok')"
          docker run --rm --network none learn-coach:ci id -u | grep -qx 10001

  ui-contracts:
    needs: [frontend, backend]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LC_TEST_PG_ADMIN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: web/dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: admin-dist
          path: admin/dist
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python tests/run_ui_contracts.py
