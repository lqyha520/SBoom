# Learning Coach —— PostgreSQL 数据库容器
#
# 使用方法（在你装了 Docker 的 WSL 终端里执行）：
#   cd /mnt/f/开源项目/learn-coach
#   docker compose up -d          # 启动数据库
#   docker compose ps             # 查看状态
#   docker compose logs -f db     # 看日志
#   docker compose down           # 停止（数据保留在卷里）
#   docker compose down -v        # 停止并清空数据（慎用）
#
# 启动后 Windows 侧通过 localhost:5432 访问（WSL2 端口自动转发），
# 然后在 .env 里设置：
#   DATABASE_URL=postgresql://learncoach:learncoach@127.0.0.1:5432/learncoach
# 然后 python run.py 启动：首次启动自动幂等建表，无需手动迁移脚本。

# 日志轮转：单文件 10m × 3 份，避免本机长期跑库把磁盘吃满
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    # 与 deploy/ 两个 compose 及 CI 的 postgres 服务保持同一 tag
    image: postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
    container_name: learncoach-db
    logging: *default-logging
    shm_size: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learncoach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learncoach}
      POSTGRES_DB: ${POSTGRES_DB:-learncoach}
    ports:
      # 只绑回环：数据库仅本机可访问（远程需要时再显式放开并改强密码）
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-learncoach} -d $${POSTGRES_DB:-learncoach}"]
      interval: 5s
      timeout: 3s
      retries: 10

  test-db:
    profiles: [tests]
    image: postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
    init: true
    stop_grace_period: 60s
    pids_limit: 256
    cpus: 2.0
    mem_limit: 2g
    shm_size: 256m
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:55432:5432"]
    # 模板库克隆会产生 WAL；自动并发限制为 4，给临时数据与检查点留足空间。
    tmpfs: [/var/lib/postgresql/data:size=1g]
    command: [postgres, -c, max_wal_size=256MB, -c, min_wal_size=80MB, -c, checkpoint_timeout=1min]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d postgres]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
