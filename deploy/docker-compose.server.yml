# Secure server deployment. Set up the encrypted upstream before applying.
# The application port is reachable only from the host; remote proxies use a TLS
# or SSH tunnel. See docs/optimization-2026-09-21.md for migration and rollback.
# docker compose -p learncoach --env-file .env.production -f docker-compose.server.yml up -d --build
#
# 镜像内应用以非 root（uid 10001）运行；从旧版镜像升级时 appdata 卷需一次性
# chown，网络改为固定网段后首次 up 前需先 `docker compose down`（不带 -v），见 docs/deploy.md。

# 服务共用的日志轮转：单文件 10m × 3 份，防止 json-file 日志把磁盘吃满
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    # 与根目录 docker-compose.yml、deploy/docker-compose.yml、CI 统一用 16-alpine（宿主机现有的
    # deploy-db-1 / learncoach-db 也是这个镜像）。不要在 postgres:16（glibc）与 16-alpine（musl）之间
    # 切换已有的 pgdata 卷：两者文本排序规则不同，换镜像后需要 REINDEX，见 docs/deploy.md。
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    shm_size: 256m
    deploy:
      resources:
        limits:
          memory: 1g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learncoach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-learncoach}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-learncoach} -d $${POSTGRES_DB:-learncoach}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.production
    logging: *default-logging
    # 给在途生成任务/连接池收尾留时间；超过后才 SIGKILL
    stop_grace_period: 40s
    deploy:
      resources:
        limits:
          memory: 2g
    environment:
      # 容器内固定项：监听全部网卡、连 compose 网络里的 db、开多 worker
      HOST: 0.0.0.0
      PORT: "8000"
      LOG_TO_FILE: "false"
      FORCE_HTTPS: "true"
      # 宿主机上的隧道/反代连到 127.0.0.1:33403 时，容器看到的来源是 docker 网桥网关（172.30.0.1），
      # 不是 127.0.0.1。旧默认值 127.0.0.1 会让 uvicorn 丢弃 X-Forwarded-For，所有请求共用一个限流桶。
      # 下面把网段固定为 172.30.0.0/24 并默认信任它（uvicorn 0.34 支持 CIDR）。绝不要填 "*"。
      # 若反代直接在容器网络之外且来源不同，请在 .env.production 里按实测值覆盖。
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.30.0.0/24}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-learncoach}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@db:5432/${POSTGRES_DB:-learncoach}
    ports:
      - "127.0.0.1:33403:8000"
    volumes:
      - appdata:/app/data
    depends_on:
      db:
        condition: service_healthy

# 固定网段，使 FORWARDED_ALLOW_IPS 默认值可预期；改网段后需要 `docker compose down` 让 compose 重建网络
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
  appdata:
